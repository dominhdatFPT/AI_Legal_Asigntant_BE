stages:
  - test

backend_tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements-test.txt
  script:
    - pytest tests libs/common_auth services/user-service/tests -q --junitxml=backend-junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: backend-junit.xml
