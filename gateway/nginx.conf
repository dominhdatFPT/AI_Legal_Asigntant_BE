events {}

http {
    # Local frontend origins. Add the deployed frontend origin when deploying.
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://127.0.0.1:3000" $http_origin;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }
    # Docker DNS + dynamic upstreams (NGINX >= 1.27.3).
    # A stopped service must not block all routes; recreated containers can change IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream agent_service {
        zone agent_service 64k;
        server agent-service:8000 resolve;
    }
    upstream user_service {
        zone user_service 64k;
        server user-service:8000 resolve;
    }
    upstream lawyer_service {
        zone lawyer_service 64k;
        server lawyer-service:8000 resolve;
    }
    upstream procedure_service {
        zone procedure_service 64k;
        server procedure-service:8000 resolve;
    }
    upstream rag_service {
        zone rag_service 64k;
        server rag-service:8000 resolve;
    }
    upstream contract_service {
        zone contract_service 64k;
        server contract-service:8000 resolve;
    }
    upstream document_service {
        zone document_service 64k;
        server document-service:8000 resolve;
        # Temporary compatibility for the old local Flask container; new code uses 8000.
        server document-service:5000 resolve backup;
    }
    upstream location_service {
        zone location_service 64k;
        server location-service:8000 resolve;
    }
    upstream consultation_service {
        zone consultation_service 64k;
        server consultation-service:8000 resolve;
    }
    upstream notification_service {
        zone notification_service 64k;
        server notification-service:8000 resolve;
    }

    server {
        listen 80;
        client_max_body_size 10m;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID, Idempotency-Key" always;
        # Cho phép FE gửi/nhận HttpOnly cookie (fetch credentials: "include" / axios withCredentials).
        # Chỉ an toàn vì Allow-Origin là origin cụ thể trong map ở trên, không phải "*".
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "X-Request-ID, Content-Disposition, X-Content-SHA256" always;
        add_header Vary "Origin" always;

        # Loại bỏ header CORS trùng lặp từ upstream service để tránh lỗi multiple values trên trình duyệt
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = / {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway","message":"Backend Gateway is running","try":"/api/agent/health"}\n';
        }

        location = /favicon.ico {
            return 204;
        }

        location = /api/procedures {
            proxy_pass http://procedure_service/api/v1/procedures;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/procedures/ {
            proxy_pass http://procedure_service/api/v1/procedures;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/agent/ {
            proxy_pass http://agent_service/api/v1/agent/;
            proxy_set_header X-Request-ID $request_id;
        }

        # GET /api/users (danh sách) và POST /api/users (admin tạo tài khoản) không có dấu "/" cuối,
        # nên không khớp location /api/users/ bên dưới.
        location = /api/users {
            proxy_pass http://user_service/api/v1/users;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/users/ {
            proxy_pass http://user_service/api/v1/users/;
            proxy_set_header X-Request-ID $request_id;
        }

        # POST /api/lawyers (gửi hồ sơ luật sư) không có dấu "/" cuối.
        location = /api/lawyers {
            proxy_pass http://lawyer_service/api/v1/lawyers;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/lawyers/ {
            proxy_pass http://lawyer_service/api/v1/lawyers/;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/procedures/ {
            proxy_pass http://procedure_service/api/v1/procedures/;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/rag/ {
            proxy_pass http://rag_service/api/v1/rag/;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/contracts/ {
            proxy_pass http://contract_service/api/v1/contracts/;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/documents/ {
            proxy_pass http://document_service/api/v1/documents/;
            # Two private Storage writes and two bounded OCR calls; no proxy retry of POST.
            proxy_read_timeout 120s;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/locations/ {
            proxy_pass http://location_service/api/v1/locations/;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/consultations/ {
            proxy_pass http://consultation_service/api/v1/consultations/;
            proxy_set_header X-Request-ID $request_id;
        }

        location /ws/consultations/ {
            proxy_pass http://consultation_service/ws/v1/consultations/;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/notifications/ {
            proxy_pass http://notification_service/api/v1/notifications/;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
