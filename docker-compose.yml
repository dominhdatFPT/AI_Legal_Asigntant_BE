services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent-service:
        condition: service_healthy
        required: false
      user-service:
        condition: service_healthy
        required: false
      lawyer-service:
        condition: service_healthy
        required: false
      procedure-service:
        condition: service_healthy
        required: false
      rag-service:
        condition: service_healthy
        required: false
      contract-service:
        condition: service_healthy
        required: false
      document-service:
        condition: service_healthy
        required: false
      location-service:
        condition: service_healthy
        required: false
      consultation-service:
        condition: service_healthy
        required: false
      notification-service:
        condition: service_healthy
        required: false

  agent-service:
    build:
      context: ./services/agent-service
      additional_contexts:
        libs: ./libs
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/agent/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      PROCEDURE_SERVICE_URL: ${PROCEDURE_SERVICE_URL:-http://procedure-service:8000}
      LOCATION_SERVICE_URL: ${LOCATION_SERVICE_URL:-http://location-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
      # Chỉ OpenRouter: tuyến duy nhất đã xác minh giá + trần $0.01/câu (không tự chuyển sang provider chưa xác minh giá)
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      # Chỉ để test: true = bỏ bước LLM, trả thẳng các đoạn luật rag tìm được
      LLM_BYPASS: ${LLM_BYPASS:-false}
      # Chặn câu hỏi ngoài phạm vi kho luật: nhờ LLM chấm độ liên quan của các đoạn luật trước khi trả lời
      RELEVANCE_CHECK: ${RELEVANCE_CHECK:-true}
      RELEVANCE_TIMEOUT_SECONDS: ${RELEVANCE_TIMEOUT_SECONDS:-8}
      # Kích thước cửa sổ xem trước theo từ khóa của vấn đề cần chấm
      RELEVANCE_CHUNK_CHARS: ${RELEVANCE_CHUNK_CHARS:-800}
      # Viết lại câu hỏi thành câu tìm kiếm dùng thuật ngữ luật trước khi tìm trong rag-service (nhờ LLM, lỗi thì dùng câu gốc)
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-false}
      QUERY_REWRITE_TIMEOUT_SECONDS: ${QUERY_REWRITE_TIMEOUT_SECONDS:-5}
      # Số đoạn luật rag-service trả về cho mỗi lần tìm (agent-service)
      RAG_TOP_K: ${RAG_TOP_K:-5}
      # Tìm 2 bước (cần RELEVANCE_CHECK=true): lấy RAG_CANDIDATE_K đoạn làm ứng viên rồi AI chấm giữ tối đa RAG_SELECT_MAX đoạn. 0 = tắt
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-12}
      RAG_SELECT_MAX: ${RAG_SELECT_MAX:-5}
      ADAPTIVE_RAG_ENABLED: ${ADAPTIVE_RAG_ENABLED:-true}
      COMPLEX_QUERY_CHARS: ${COMPLEX_QUERY_CHARS:-1200}
      CASE_MAX_ISSUES: ${CASE_MAX_ISSUES:-8}
      CASE_MAX_RETRIEVAL_QUERIES: ${CASE_MAX_RETRIEVAL_QUERIES:-8}
      CASE_RETRIEVAL_CONCURRENCY: ${CASE_RETRIEVAL_CONCURRENCY:-3}
      CASE_CANDIDATE_K_PER_ISSUE: ${CASE_CANDIDATE_K_PER_ISSUE:-12}
      CASE_MAX_CANDIDATES: ${CASE_MAX_CANDIDATES:-48}
      CASE_SELECT_MAX: ${CASE_SELECT_MAX:-16}
      # TOKEN thật của phần chứng cứ (không phải byte)
      CASE_CONTEXT_TOKEN_BUDGET: ${CASE_CONTEXT_TOKEN_BUDGET:-6000}
      CASE_MAX_OUTPUT_TOKENS: ${CASE_MAX_OUTPUT_TOKENS:-3500}
      CASE_TOKEN_BUDGET_TARGET: ${CASE_TOKEN_BUDGET_TARGET:-0}
      # Trần tiền $0.01 toàn câu (gồm embedding) thay cho chốt tổng token 19k
      CASE_TOKEN_BUDGET_MAX: ${CASE_TOKEN_BUDGET_MAX:-0}
      CASE_COST_BUDGET_MICRO_USD: ${CASE_COST_BUDGET_MICRO_USD:-10000}
      CASE_RELEVANCE_DEDUP_ENABLED: ${CASE_RELEVANCE_DEDUP_ENABLED:-true}
      CASE_COMPLEX_MAX_OUTPUT_TOKENS: ${CASE_COMPLEX_MAX_OUTPUT_TOKENS:-3500}
      PLANNER_MAX_OUTPUT_TOKENS: ${PLANNER_MAX_OUTPUT_TOKENS:-896}
      RESPONDER_INPUT_TARGET: ${RESPONDER_INPUT_TARGET:-8000}
      RELEVANCE_TOTAL_INPUT_TOKENS: ${RELEVANCE_TOTAL_INPUT_TOKENS:-3600}
      RELEVANCE_TOTAL_OUTPUT_TOKENS: ${RELEVANCE_TOTAL_OUTPUT_TOKENS:-320}
      EMBEDDING_TOTAL_INPUT_TOKENS: ${EMBEDDING_TOTAL_INPUT_TOKENS:-1024}
      EMBEDDING_PRICE_NANO_PER_TOKEN: ${EMBEDDING_PRICE_NANO_PER_TOKEN:-150}
      CASE_MAX_RETRIEVAL_ROUNDS: ${CASE_MAX_RETRIEVAL_ROUNDS:-2}
      CASE_TOTAL_DEADLINE_SECONDS: ${CASE_TOTAL_DEADLINE_SECONDS:-90}
      # Cache kết quả tìm luật (Redis chính, RAM dự phòng, theo CACHE_BACKEND). BẬT mặc định. Tự mất hiệu lực khi rag-service duyệt/thay
      # luật nhờ số phiên bản kho luật trong khoá; chỉ cần xoá tay khi Redis chết đúng lúc duyệt luật
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-true}
      RAG_BATCH_ENABLED: ${RAG_BATCH_ENABLED:-true}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-86400}
      RAG_CACHE_MAX_ITEMS: ${RAG_CACHE_MAX_ITEMS:-1000}
      # Chặn tài liệu đính kèm quá ít chữ hoặc chữ rác trước khi tìm luật và gọi AI
      DOCUMENT_GATE_ENABLED: ${DOCUMENT_GATE_ENABLED:-false}
      DOCUMENT_MIN_CHARS: ${DOCUMENT_MIN_CHARS:-200}
      DOCUMENT_MIN_VALID_RATIO: ${DOCUMENT_MIN_VALID_RATIO:-0.5}
      # Tự đếm chỗ trống và kiểm tra tài liệu bị cắt, đưa vào prompt rà soát như dữ kiện cho AI nêu lại
      DOCUMENT_FACTS_ENABLED: ${DOCUMENT_FACTS_ENABLED:-false}
      DOCUMENT_PLACEHOLDER_MIN: ${DOCUMENT_PLACEHOLDER_MIN:-5}
      # Không nhận ra loại hợp đồng và câu hỏi chung chung thì hỏi lại người dùng thay vì tìm luật và gọi AI
      DOCUMENT_ASK_TYPE_ENABLED: ${DOCUMENT_ASK_TYPE_ENABLED:-false}
      # Kiểm bằng từ khoá các mục thường gặp của hợp đồng, đưa vào prompt rà soát như dữ kiện (chỉ báo "chưa thấy từ khoá")
      DOCUMENT_CHECKLIST_ENABLED: ${DOCUMENT_CHECKLIST_ENABLED:-false}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-20000}
      DAILY_TOKEN_QUOTA_ENABLED: ${DAILY_TOKEN_QUOTA_ENABLED:-true}
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-10}
      MINUTES_COST_BUDGET_MICRO_USD: ${MINUTES_COST_BUDGET_MICRO_USD:-30000}
      # Danh sách user_id (UUID) miễn hạn mức token ngày; mặc định rỗng (fail-closed), operator khai báo trong .env
      TEST_UNLIMITED_USERS: ${TEST_UNLIMITED_USERS:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1800}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-1}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-10}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      # Không thử lại ngầm: mỗi lần gửi thật phải có khoản giữ chỗ riêng trong sổ cái $0.01
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-0}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
      # Token chừa cho "suy nghĩ" của câu trả lời chính. 0 = gửi reasoning.effort=none.
      # Model suy luận bắt buộc (vd recursive/flint-v1.0:free) cần đặt lại khoảng 1024, để 0 thì câu trả lời có thể bị cắt hoặc rỗng
      OPENROUTER_REASONING_MAX_TOKENS: ${OPENROUTER_REASONING_MAX_TOKENS:-0}
      # Mức suy luận riêng cho lượt gọi phụ (chấm liên quan) chỉ cần trả JSON ngắn: 0 = tắt suy luận
      LLM_AUX_REASONING_MAX_TOKENS: ${LLM_AUX_REASONING_MAX_TOKENS:-0}
      # Model OpenRouter riêng cho lượt gọi phụ (chấm liên quan, viết lại câu hỏi). Rỗng = dùng OPENROUTER_MODEL
      OPENROUTER_AUX_MODEL: ${OPENROUTER_AUX_MODEL:-deepseek/deepseek-v4.1-flash}
      MINUTES_MODEL: ${MINUTES_MODEL:-}
      # Trong mạng Docker gọi rag-service theo tên service (không dùng localhost)
      RAG_SERVICE_URL: http://rag-service:8000
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-30}
      # Redis dùng làm cache (không bắt buộc, không có depends_on). Rỗng = không dùng Redis, chạy bằng cache RAM
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Nơi cất cache tìm luật và cache lịch sử: redis = Redis, tự rơi về RAM khi Redis lỗi hoặc rỗng REDIS_URL; memory = chỉ RAM của process
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      # Chờ Redis tối đa bao nhiêu giây mỗi lần gọi (kết nối, đọc, ghi)
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.2}
      # Số lần lỗi Redis liên tiếp thì ngắt mạch (bỏ qua Redis, dùng cache bộ nhớ process)
      REDIS_BREAKER_FAILURES: ${REDIS_BREAKER_FAILURES:-3}
      # Số giây ngắt mạch trước khi thử Redis lại
      REDIS_BREAKER_SECONDS: ${REDIS_BREAKER_SECONDS:-30}
      # Tên khoá Redis giữ số phiên bản kho luật: PHẢI GIỐNG rag-service (cùng biến, cùng mặc định)
      CORPUS_VERSION_KEY: ${CORPUS_VERSION_KEY:-legal:corpus_version}
      # Số giây nhớ số phiên bản trong process (0 = không nhớ); đổi luật xong mất tối đa chừng này giây mới có hiệu lực
      CORPUS_VERSION_CACHE_SECONDS: ${CORPUS_VERSION_CACHE_SECONDS:-5}
      # Số tin lịch sử AI được nhớ (mỗi lượt hỏi-đáp là 2 tin); dùng chung cho đọc Supabase và cache lịch sử
      HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-12}
      # Cache lịch sử trò chuyện (HISTORY_MAX_MESSAGES tin gần nhất mỗi hội thoại): bật/tắt, thời gian sống (giây), số mục tối đa của bản dự phòng trong RAM
      HISTORY_CACHE_ENABLED: ${HISTORY_CACHE_ENABLED:-true}
      HISTORY_CACHE_TTL_SECONDS: ${HISTORY_CACHE_TTL_SECONDS:-3600}
      HISTORY_CACHE_MAX_ITEMS: ${HISTORY_CACHE_MAX_ITEMS:-500}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  user-service:
    build:
      context: ./services/user-service
      additional_contexts:
        libs: ./libs
    mem_limit: 384m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/users/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      USER_DATABASE_URL: ${USER_DATABASE_URL:-}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      RUN_LOGOUT_AUDIT_IN_API: ${RUN_LOGOUT_AUDIT_IN_API:-true}
      AUTH_BROWSER_ORIGINS: ${AUTH_BROWSER_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLOCK_SKEW_SECONDS: ${FIREBASE_CLOCK_SKEW_SECONDS:-10}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      LAWYER_SERVICE_TOKEN: ${LAWYER_SERVICE_TOKEN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api/users/auth}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  lawyer-service:
    build:
      context: ./services/lawyer-service
      additional_contexts:
        libs: ./libs
    mem_limit: 384m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/lawyers/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      LAWYER_DATABASE_URL: ${LAWYER_DATABASE_URL:-}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      LAWYER_SERVICE_TOKEN: ${LAWYER_SERVICE_TOKEN:-}
      LAWYER_REAPPLY_COOLDOWN_HOURS: ${LAWYER_REAPPLY_COOLDOWN_HOURS:-24}
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  procedure-service:
    build:
      context: ./services/procedure-service
      additional_contexts:
        libs: ./libs
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/procedures/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      PROCEDURE_DATABASE_URL: ${PROCEDURE_DATABASE_URL:-}
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-}
      USER_SERVICE_URL: http://user-service:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8082}
      ONLYOFFICE_CALLBACK_BASE: ${ONLYOFFICE_CALLBACK_BASE:-http://procedure-service:8000/api/v1/procedures}
      ONLYOFFICE_BACKUP_DIR: ${ONLYOFFICE_BACKUP_DIR:-/app/office-backups}
      SUPABASE_URL: ${SUPABASE_URL:-https://qqwuhiymixomwrdunfkz.supabase.co}
      # Khoá anon lấy từ Supabase (mục API), đặt trong .env; không có giá trị mặc định ghi cứng trong file này
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro
      - office_backups:/app/office-backups

  onlyoffice:
    image: onlyoffice/documentserver:9.3
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_HEADER: Authorization
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    ports:
      - '127.0.0.1:8082:80'
    shm_size: '1gb'
    # Locale fallbacks and iframe policy are applied before Document Server starts.
    entrypoint: ['sh', '/opt/legal-assistant/start-onlyoffice.sh']
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro
      - ./scripts/start-onlyoffice.sh:/opt/legal-assistant/start-onlyoffice.sh:ro
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/healthcheck']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  rag-service:
    build:
      context: ./services/rag-service
      additional_contexts:
        libs: ./libs
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/rag/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      RUN_RAG_INDEXING_WORKER_IN_API: "false"
      # Chống treo khi kết nối DB chết ngầm (giây; 0 = bỏ giới hạn)
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-20}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-300}
      RAG_DB_CONCURRENCY_LIMIT: ${RAG_DB_CONCURRENCY_LIMIT:-4}
      RAG_DB_QUEUE_MAX_WAITING: ${RAG_DB_QUEUE_MAX_WAITING:-96}
      RAG_DB_QUEUE_WAIT_SECONDS: ${RAG_DB_QUEUE_WAIT_SECONDS:-25}
      RAG_DB_INTERACTIVE_BURST: ${RAG_DB_INTERACTIVE_BURST:-3}
      RAG_DB_PER_TENANT_BURST: ${RAG_DB_PER_TENANT_BURST:-3}
      # Independent corpus BM25 + vector + exact lookup, fused by RRF; false = vector only
      HYBRID_ENABLED: ${HYBRID_ENABLED:-true}
      HYBRID_ALPHA: ${HYBRID_ALPHA:-0.05}
      HYBRID_POOL: ${HYBRID_POOL:-0}
      # Redis dùng làm cache (không bắt buộc, không có depends_on). Rỗng = không dùng Redis, chạy bằng cache RAM
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Chờ Redis tối đa bao nhiêu giây khi tăng số phiên bản kho luật (sau khi duyệt/thay luật xong)
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.2}
      # Tên khoá Redis giữ số phiên bản kho luật: PHẢI GIỐNG agent-service (cùng biến, cùng mặc định)
      CORPUS_VERSION_KEY: ${CORPUS_VERSION_KEY:-legal:corpus_version}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-001}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      # Online (truy vấn người dùng): không thử lại ngầm, đơn giá nano-USD/token cho sổ cái $0.01
      EMBEDDING_ONLINE_MAX_RETRIES: ${EMBEDDING_ONLINE_MAX_RETRIES:-0}
      EMBEDDING_PRICE_NANO_PER_TOKEN: ${EMBEDDING_PRICE_NANO_PER_TOKEN:-150}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  # Redis chỉ làm cache dùng chung cho agent-service và rag-service; mất dữ liệu khi restart không sao.
  rag-worker:
    build:
      context: ./services/rag-service
      additional_contexts:
        libs: ./libs
    mem_limit: 256m
    mem_reservation: 64m
    command: ["python", "-m", "app.rag_indexing_worker"]
    restart: unless-stopped
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORPUS_VERSION_KEY: ${CORPUS_VERSION_KEY:-legal:corpus_version}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-001}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    depends_on:
      rabbitmq-core-events:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # Cache đặt EX trên mọi khóa; volatile-lru giữ legal:corpus_version vì khóa này không có TTL.
    # REDIS_MAXMEMORY đặt trần RAM; --save "" và --appendonly no tắt snapshot và log ra đĩa.
    # Không mở cổng ra máy host và không có volume: chỉ các service trong mạng Docker gọi được.
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  contract-service:
    build:
      context: ./services/contract-service
      additional_contexts:
        libs: ./libs
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/contracts/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-}
      PROCEDURE_DATABASE_URL: ${PROCEDURE_DATABASE_URL:-}
      CONTRACT_SUPABASE_URL: ${CONTRACT_SUPABASE_URL:-}
      CONTRACT_SUPABASE_SERVICE_ROLE_KEY: ${CONTRACT_SUPABASE_SERVICE_ROLE_KEY:-}
      CONTRACT_STORAGE_BUCKET: ${CONTRACT_STORAGE_BUCKET:-contract-files}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      PROCEDURE_SERVICE_URL: ${PROCEDURE_SERVICE_URL:-http://procedure-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CONTRACT_ALLOWED_ORIGINS: ${CONTRACT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false

  contract-worker:
    profiles: [contract-worker]
    build:
      context: ./services/contract-service
      additional_contexts:
        libs: ./libs
    command: [python, -m, app.services.generation_worker]
    user: "65532:65532"
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    tmpfs: [/tmp:rw,noexec,nosuid,size=256m,mode=1777]
    environment:
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-}
      PROCEDURE_DATABASE_URL: ${PROCEDURE_DATABASE_URL:-}
      CONTRACT_SUPABASE_URL: ${CONTRACT_SUPABASE_URL:-}
      CONTRACT_SUPABASE_SERVICE_ROLE_KEY: ${CONTRACT_SUPABASE_SERVICE_ROLE_KEY:-}
      CONTRACT_STORAGE_BUCKET: ${CONTRACT_STORAGE_BUCKET:-contract-files}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/

  document-service:
    user: "65532:65532"
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    build:
      context: ./services/document-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/documents/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      DOCUMENT_DATABASE_URL: ${DOCUMENT_DATABASE_URL:-}
      DOCUMENT_DATABASE_POOLER_HOST: ${DOCUMENT_DATABASE_POOLER_HOST:-}
      DOCUMENT_SUPABASE_URL: ${DOCUMENT_SUPABASE_URL:-}
      DOCUMENT_SUPABASE_SERVICE_ROLE_KEY: ${DOCUMENT_SUPABASE_SERVICE_ROLE_KEY:-}
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-document-files}
      DOCUMENT_HTTP_TIMEOUT_SECONDS: ${DOCUMENT_HTTP_TIMEOUT_SECONDS:-20}
      DOCUMENT_ALLOWED_ORIGINS: ${DOCUMENT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DOCUMENT_OCR_MODEL_DIR: /usr/share/tesseract-ocr/5/tessdata
      DOCUMENT_OCR_CPU_THREADS: ${DOCUMENT_OCR_CPU_THREADS:-2}
      DOCUMENT_VIETOCR_ENABLED: ${DOCUMENT_VIETOCR_ENABLED:-1}
      DOCUMENT_VIETOCR_MODEL_DIR: /opt/vietocr
      # Đọc CCCD bằng VNPT eKYC trước, lỗi/thiếu thì dùng OCR local (mặc định tắt = chỉ OCR local).
      EKYC_ENABLED: ${EKYC_ENABLED:-0}
      EKYC_ACCESS_TOKEN: ${EKYC_ACCESS_TOKEN:-}
      EKYC_TOKEN_ID: ${EKYC_TOKEN_ID:-}
      EKYC_TOKEN: ${EKYC_TOKEN:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false

  location-service:
    build:
      context: ./services/location-service
      additional_contexts:
        libs: ./libs
    mem_limit: 256m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/locations/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      LOCATION_DATABASE_URL: ${LOCATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      LOCATION_SEARCH_ENABLED: ${LOCATION_SEARCH_ENABLED:-false}
      LOCATION_GOONG_TIMEOUT_SECONDS: ${LOCATION_GOONG_TIMEOUT_SECONDS:-5}
      LOCATION_SEARCH_TIMEOUT_SECONDS: ${LOCATION_SEARCH_TIMEOUT_SECONDS:-20}
      LOCATION_GOONG_MAX_RPS: ${LOCATION_GOONG_MAX_RPS:-4}
      LOCATION_GOONG_DAILY_BUDGET: ${LOCATION_GOONG_DAILY_BUDGET:-1000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      LOCATION_WEB_MODEL: ${LOCATION_WEB_MODEL:-${GEMINI_MODEL:-gemini-2.5-flash}}
      LOCATION_WEB_LOOKUP_ENABLED: ${LOCATION_WEB_LOOKUP_ENABLED:-false}
      LOCATION_WEB_DAILY_BUDGET: ${LOCATION_WEB_DAILY_BUDGET:-20}
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem:/run/keys/jwt_public.pem:ro

  consultation-service:
    build:
      context: ./services/consultation-service
      additional_contexts:
        libs: ./libs
    mem_limit: 384m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/consultations/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      CONSULTATION_DATABASE_URL: ${CONSULTATION_DATABASE_URL:-}
      USER_ACTIVE_CACHE_SECONDS: ${USER_ACTIVE_CACHE_SECONDS:-30}
      LAWYER_SERVICE_URL: ${LAWYER_SERVICE_URL:-http://lawyer-service:8000}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CONSULTATION_TERMS_VERSION: ${CONSULTATION_TERMS_VERSION:-2026-11-01}
      CONSULTATION_ALLOWED_ORIGINS: ${CONSULTATION_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8000}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  notification-service:
    build:
      context: ./services/notification-service
      additional_contexts:
        libs: ./libs
    mem_limit: 384m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/notifications/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # Container notification-worker đã nghe event; tắt consumer trong API để không có 2 tiến trình cùng ghi DB.
      RUN_NOTIFICATION_HUB_IN_API: "false"
      RUN_REPORT_ENRICHMENT_IN_API: "false"
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false
      - notification-data:/app/data

  notification-worker:
    build:
      context: ./services/notification-service
      additional_contexts:
        libs: ./libs
    mem_limit: 256m
    mem_reservation: 64m
    command: ["python", "-m", "app.notification_event_worker"]
    restart: unless-stopped
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro
      - notification-data:/app/data
    depends_on:
      rabbitmq-core-events:
        condition: service_healthy

  # ==========================================================
  # BROKER 1: Điều phối Sự kiện Nghiệp vụ (Business Events Broker)
  # Quản lý Domain Events: auth, user, lawyer, notification, consultation
  # ==========================================================
  rabbitmq-core-events:
    image: rabbitmq:3-management-alpine
    mem_limit: 512m
    mem_reservation: 128m
    # hostname cố định: RabbitMQ lưu dữ liệu theo tên node, đổi hostname là mất queue.
    hostname: rabbitmq-core-events
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      default:
        aliases:
          - rabbitmq
          - rabbitmq-core-events

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  office_backups:
  notification-data:
  rabbitmq-data:
