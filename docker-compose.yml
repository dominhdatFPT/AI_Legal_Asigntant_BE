services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      lawyer-service:
        condition: service_healthy
      procedure-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      consultation-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  agent-service:
    build:
      context: ./services/agent-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/agent/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      PROCEDURE_SERVICE_URL: ${PROCEDURE_SERVICE_URL:-http://procedure-service:8000}
      LOCATION_SERVICE_URL: ${LOCATION_SERVICE_URL:-http://location-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
      # OpenRouter trước; lỗi (hết lượt model free, sai key...) thì tự chuyển sang Gemini
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter,gemini}
      # Chỉ để test: true = bỏ bước LLM, trả thẳng các đoạn luật rag tìm được
      LLM_BYPASS: ${LLM_BYPASS:-false}
      # Chặn câu hỏi ngoài phạm vi kho luật: nhờ LLM chấm độ liên quan của các đoạn luật trước khi trả lời
      RELEVANCE_CHECK: ${RELEVANCE_CHECK:-false}
      RELEVANCE_TIMEOUT_SECONDS: ${RELEVANCE_TIMEOUT_SECONDS:-8}
      # Số ký tự đầu mỗi đoạn luật mà bước chấm liên quan được đọc
      RELEVANCE_CHUNK_CHARS: ${RELEVANCE_CHUNK_CHARS:-600}
      # Viết lại câu hỏi thành câu tìm kiếm dùng thuật ngữ luật trước khi tìm trong rag-service (nhờ LLM, lỗi thì dùng câu gốc)
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-false}
      QUERY_REWRITE_TIMEOUT_SECONDS: ${QUERY_REWRITE_TIMEOUT_SECONDS:-5}
      # Tìm 2 bước (cần RELEVANCE_CHECK=true): lấy RAG_CANDIDATE_K đoạn làm ứng viên rồi AI chấm giữ tối đa RAG_SELECT_MAX đoạn. 0 = tắt
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-0}
      RAG_SELECT_MAX: ${RAG_SELECT_MAX:-5}
      # Cache kết quả tìm luật trong bộ nhớ agent-service. Nạp luật mới xong phải restart agent-service để xoá cache
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-false}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-86400}
      RAG_CACHE_MAX_ITEMS: ${RAG_CACHE_MAX_ITEMS:-1000}
      # Cache câu trả lời cuối trong bộ nhớ agent-service: chỉ câu đầu hội thoại, không kèm tài liệu. Đổi prompt hoặc model thì restart
      ANSWER_CACHE_ENABLED: ${ANSWER_CACHE_ENABLED:-false}
      ANSWER_CACHE_TTL_SECONDS: ${ANSWER_CACHE_TTL_SECONDS:-21600}
      ANSWER_CACHE_MAX_ITEMS: ${ANSWER_CACHE_MAX_ITEMS:-500}
      # Chặn tài liệu đính kèm quá ít chữ hoặc chữ rác trước khi tìm luật và gọi AI
      DOCUMENT_GATE_ENABLED: ${DOCUMENT_GATE_ENABLED:-false}
      DOCUMENT_MIN_CHARS: ${DOCUMENT_MIN_CHARS:-200}
      DOCUMENT_MIN_VALID_RATIO: ${DOCUMENT_MIN_VALID_RATIO:-0.5}
      # Tự đếm chỗ trống và kiểm tra tài liệu bị cắt, đưa vào prompt rà soát như dữ kiện cho AI nêu lại
      DOCUMENT_FACTS_ENABLED: ${DOCUMENT_FACTS_ENABLED:-false}
      DOCUMENT_PLACEHOLDER_MIN: ${DOCUMENT_PLACEHOLDER_MIN:-5}
      # Không nhận ra loại hợp đồng và câu hỏi chung chung thì hỏi lại người dùng thay vì tìm luật và gọi AI
      DOCUMENT_ASK_TYPE_ENABLED: ${DOCUMENT_ASK_TYPE_ENABLED:-false}
      # Kiểm bằng từ khoá các mục thường gặp của hợp đồng, đưa vào prompt rà soát như dữ kiện (chỉ báo "chưa thấy từ khoá")
      DOCUMENT_CHECKLIST_ENABLED: ${DOCUMENT_CHECKLIST_ENABLED:-false}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-3}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-45}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
      # Token chừa cho "suy nghĩ" của câu trả lời chính. 0 = không gửi tham số reasoning (hợp với Gemini, không bắt buộc suy nghĩ).
      # Model suy luận bắt buộc (vd recursive/flint-v1.0:free) cần đặt lại khoảng 1024, để 0 thì câu trả lời có thể bị cắt hoặc rỗng
      OPENROUTER_REASONING_MAX_TOKENS: ${OPENROUTER_REASONING_MAX_TOKENS:-0}
      # Mức suy luận riêng cho lượt gọi phụ (chấm liên quan) chỉ cần trả JSON ngắn: 0 = tắt suy luận
      LLM_AUX_REASONING_MAX_TOKENS: ${LLM_AUX_REASONING_MAX_TOKENS:-0}
      # Model OpenRouter riêng cho lượt gọi phụ (chấm liên quan, viết lại câu hỏi). Rỗng = dùng OPENROUTER_MODEL
      OPENROUTER_AUX_MODEL: ${OPENROUTER_AUX_MODEL:-}
      MINUTES_MODEL: ${MINUTES_MODEL:-}
      # Trong mạng Docker gọi rag-service theo tên service (không dùng localhost)
      RAG_SERVICE_URL: http://rag-service:8000
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-30}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  user-service:
    build:
      context: ./services/user-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/users/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      USER_DATABASE_URL: ${USER_DATABASE_URL:-}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLOCK_SKEW_SECONDS: ${FIREBASE_CLOCK_SKEW_SECONDS:-10}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      LAWYER_SERVICE_TOKEN: ${LAWYER_SERVICE_TOKEN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  lawyer-service:
    build:
      context: ./services/lawyer-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/lawyers/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      LAWYER_DATABASE_URL: ${LAWYER_DATABASE_URL:-}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      LAWYER_SERVICE_TOKEN: ${LAWYER_SERVICE_TOKEN:-}
      LAWYER_REAPPLY_COOLDOWN_HOURS: ${LAWYER_REAPPLY_COOLDOWN_HOURS:-24}
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  procedure-service:
    build:
      context: ./services/procedure-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/procedures/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      PROCEDURE_DATABASE_URL: ${PROCEDURE_DATABASE_URL:-}
      USER_SERVICE_URL: http://user-service:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8082}
      ONLYOFFICE_CALLBACK_BASE: ${ONLYOFFICE_CALLBACK_BASE:-http://procedure-service:8000/api/v1/procedures}
      ONLYOFFICE_BACKUP_DIR: ${ONLYOFFICE_BACKUP_DIR:-/app/office-backups}
      SUPABASE_URL: ${SUPABASE_URL:-https://qqwuhiymixomwrdunfkz.supabase.co}
      # Khoá anon lấy từ Supabase (mục API), đặt trong .env; không có giá trị mặc định ghi cứng trong file này
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro
      - office_backups:/app/office-backups

  onlyoffice:
    image: onlyoffice/documentserver:9.3
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    ports:
      - '127.0.0.1:8082:80'
    shm_size: '1gb'
    # Secret JWT = sha256 của khoá RS256 sẵn có (cùng công thức với procedure-service), không cần biến .env riêng
    entrypoint: ["sh", "-c", "export JWT_SECRET=$${ONLYOFFICE_JWT_SECRET:-$$(sha256sum /run/keys/jwt_private.pem | cut -d' ' -f1)}; exec /app/ds/run-document-server.sh"]
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/healthcheck']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  rag-service:
    build:
      context: ./services/rag-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/rag/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      # Chống treo khi kết nối DB chết ngầm (giây; 0 = bỏ giới hạn)
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-20}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-300}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  contract-service:
    build:
      context: ./services/contract-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/contracts/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-}
      PROCEDURE_DATABASE_URL: ${PROCEDURE_DATABASE_URL:-}
      CONTRACT_SUPABASE_URL: ${CONTRACT_SUPABASE_URL:-}
      CONTRACT_SUPABASE_SERVICE_ROLE_KEY: ${CONTRACT_SUPABASE_SERVICE_ROLE_KEY:-}
      CONTRACT_STORAGE_BUCKET: ${CONTRACT_STORAGE_BUCKET:-contract-files}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      PROCEDURE_SERVICE_URL: ${PROCEDURE_SERVICE_URL:-http://procedure-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CONTRACT_ALLOWED_ORIGINS: ${CONTRACT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false

  contract-worker:
    profiles: [contract-worker]
    build:
      context: ./services/contract-service
      additional_contexts:
        libs: ./libs
    command: [python, -m, app.services.generation_worker]
    user: "65532:65532"
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    tmpfs: [/tmp:rw,noexec,nosuid,size=256m,mode=1777]
    environment:
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-}
      PROCEDURE_DATABASE_URL: ${PROCEDURE_DATABASE_URL:-}
      CONTRACT_SUPABASE_URL: ${CONTRACT_SUPABASE_URL:-}
      CONTRACT_SUPABASE_SERVICE_ROLE_KEY: ${CONTRACT_SUPABASE_SERVICE_ROLE_KEY:-}
      CONTRACT_STORAGE_BUCKET: ${CONTRACT_STORAGE_BUCKET:-contract-files}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/

  document-service:
    user: "65532:65532"
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    build:
      context: ./services/document-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/documents/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      DOCUMENT_DATABASE_URL: ${DOCUMENT_DATABASE_URL:-}
      DOCUMENT_DATABASE_POOLER_HOST: ${DOCUMENT_DATABASE_POOLER_HOST:-}
      DOCUMENT_SUPABASE_URL: ${DOCUMENT_SUPABASE_URL:-}
      DOCUMENT_SUPABASE_SERVICE_ROLE_KEY: ${DOCUMENT_SUPABASE_SERVICE_ROLE_KEY:-}
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-document-files}
      DOCUMENT_HTTP_TIMEOUT_SECONDS: ${DOCUMENT_HTTP_TIMEOUT_SECONDS:-20}
      DOCUMENT_ALLOWED_ORIGINS: ${DOCUMENT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DOCUMENT_OCR_MODEL_DIR: /usr/share/tesseract-ocr/5/tessdata
      DOCUMENT_OCR_CPU_THREADS: ${DOCUMENT_OCR_CPU_THREADS:-2}
      DOCUMENT_VIETOCR_ENABLED: ${DOCUMENT_VIETOCR_ENABLED:-1}
      DOCUMENT_VIETOCR_MODEL_DIR: /opt/vietocr
      # Đọc CCCD bằng VNPT eKYC trước, lỗi/thiếu thì dùng OCR local (mặc định tắt = chỉ OCR local).
      EKYC_ENABLED: ${EKYC_ENABLED:-0}
      EKYC_ACCESS_TOKEN: ${EKYC_ACCESS_TOKEN:-}
      EKYC_TOKEN_ID: ${EKYC_TOKEN_ID:-}
      EKYC_TOKEN: ${EKYC_TOKEN:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false

  location-service:
    build:
      context: ./services/location-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/locations/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      LOCATION_DATABASE_URL: ${LOCATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      LOCATION_SEARCH_ENABLED: ${LOCATION_SEARCH_ENABLED:-false}
      LOCATION_GOONG_TIMEOUT_SECONDS: ${LOCATION_GOONG_TIMEOUT_SECONDS:-5}
      LOCATION_SEARCH_TIMEOUT_SECONDS: ${LOCATION_SEARCH_TIMEOUT_SECONDS:-20}
      LOCATION_GOONG_MAX_RPS: ${LOCATION_GOONG_MAX_RPS:-4}
      LOCATION_GOONG_DAILY_BUDGET: ${LOCATION_GOONG_DAILY_BUDGET:-1000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      LOCATION_WEB_MODEL: ${LOCATION_WEB_MODEL:-${GEMINI_MODEL:-gemini-2.5-flash}}
      LOCATION_WEB_LOOKUP_ENABLED: ${LOCATION_WEB_LOOKUP_ENABLED:-false}
      LOCATION_WEB_DAILY_BUDGET: ${LOCATION_WEB_DAILY_BUDGET:-20}
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem:/run/keys/jwt_public.pem:ro

  consultation-service:
    build:
      context: ./services/consultation-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/consultations/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      CONSULTATION_DATABASE_URL: ${CONSULTATION_DATABASE_URL:-}
      LAWYER_SERVICE_URL: ${LAWYER_SERVICE_URL:-http://lawyer-service:8000}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CONSULTATION_TERMS_VERSION: ${CONSULTATION_TERMS_VERSION:-2026-11-01}
      CONSULTATION_ALLOWED_ORIGINS: ${CONSULTATION_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8000}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  notification-service:
    build:
      context: ./services/notification-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/notifications/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      # Container notification-worker đã nghe event; tắt consumer trong API để không có 2 tiến trình cùng ghi DB.
      RUN_NOTIFICATION_HUB_IN_API: "false"
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false
      - notification-data:/app/data

  notification-worker:
    build:
      context: ./services/notification-service
      additional_contexts:
        libs: ./libs
    command: ["python", "-m", "app.notification_event_worker"]
    restart: unless-stopped
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro
      - notification-data:/app/data
    depends_on:
      rabbitmq-core-events:
        condition: service_healthy

  # ==========================================================
  # BROKER 1: Điều phối Sự kiện Nghiệp vụ (Business Events Broker)
  # Quản lý Domain Events: auth, user, lawyer, notification, consultation
  # ==========================================================
  rabbitmq-core-events:
    image: rabbitmq:3-management-alpine
    # hostname cố định: RabbitMQ lưu dữ liệu theo tên node, đổi hostname là mất queue.
    hostname: rabbitmq-core-events
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      default:
        aliases:
          - rabbitmq
          - rabbitmq-core-events

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  office_backups:
  notification-data:
  rabbitmq-data:
