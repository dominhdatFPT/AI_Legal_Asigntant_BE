services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      lawyer-service:
        condition: service_healthy
      procedure-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      consultation-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  agent-service:
    build:
      context: ./services/agent-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/agent/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      PROCEDURE_SERVICE_URL: ${PROCEDURE_SERVICE_URL:-http://procedure-service:8000}
      LOCATION_SERVICE_URL: ${LOCATION_SERVICE_URL:-http://location-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Trong mạng Docker gọi rag-service theo tên service (không dùng localhost)
      RAG_SERVICE_URL: http://rag-service:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  user-service:
    build:
      context: ./services/user-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/users/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      USER_DATABASE_URL: ${USER_DATABASE_URL:-}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLOCK_SKEW_SECONDS: ${FIREBASE_CLOCK_SKEW_SECONDS:-10}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  lawyer-service:
    build:
      context: ./services/lawyer-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/lawyers/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      LAWYER_DATABASE_URL: ${LAWYER_DATABASE_URL:-}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      LAWYER_REAPPLY_COOLDOWN_HOURS: ${LAWYER_REAPPLY_COOLDOWN_HOURS:-24}
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  procedure-service:
    build:
      context: ./services/procedure-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/procedures/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      PROCEDURE_DATABASE_URL: ${PROCEDURE_DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-https://qqwuhiymixomwrdunfkz.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxd3VoaXltaXhvbXdyZHVuZmt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MzgxNzAsImV4cCI6MjEwNzAxNDE3MH0.SHNvLsI4fVZTbm1gS0pidZWjOLJnQBTgbQ-chLA5aTA}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  rag-service:
    build:
      context: ./services/rag-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/rag/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  contract-service:
    build:
      context: ./services/contract-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/contracts/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-}
      CONTRACT_SUPABASE_URL: ${CONTRACT_SUPABASE_URL:-}
      CONTRACT_SUPABASE_SERVICE_ROLE_KEY: ${CONTRACT_SUPABASE_SERVICE_ROLE_KEY:-}
      CONTRACT_STORAGE_BUCKET: ${CONTRACT_STORAGE_BUCKET:-contract-files}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8000}
      PROCEDURE_SERVICE_URL: ${PROCEDURE_SERVICE_URL:-http://procedure-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CONTRACT_ALLOWED_ORIGINS: ${CONTRACT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false

  contract-worker:
    profiles: [contract-worker]
    build:
      context: ./services/contract-service
      additional_contexts:
        libs: ./libs
    command: [python, -m, app.services.generation_worker]
    user: "65532:65532"
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    tmpfs: [/tmp:rw,noexec,nosuid,size=256m,mode=1777]
    environment:
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-}
      CONTRACT_SUPABASE_URL: ${CONTRACT_SUPABASE_URL:-}
      CONTRACT_SUPABASE_SERVICE_ROLE_KEY: ${CONTRACT_SUPABASE_SERVICE_ROLE_KEY:-}
      CONTRACT_STORAGE_BUCKET: ${CONTRACT_STORAGE_BUCKET:-contract-files}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/

  document-service:
    user: "65532:65532"
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    build:
      context: ./services/document-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/documents/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      DOCUMENT_DATABASE_URL: ${DOCUMENT_DATABASE_URL:-}
      DOCUMENT_DATABASE_POOLER_HOST: ${DOCUMENT_DATABASE_POOLER_HOST:-}
      DOCUMENT_SUPABASE_URL: ${DOCUMENT_SUPABASE_URL:-}
      DOCUMENT_SUPABASE_SERVICE_ROLE_KEY: ${DOCUMENT_SUPABASE_SERVICE_ROLE_KEY:-}
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-document-files}
      DOCUMENT_HTTP_TIMEOUT_SECONDS: ${DOCUMENT_HTTP_TIMEOUT_SECONDS:-20}
      DOCUMENT_ALLOWED_ORIGINS: ${DOCUMENT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DOCUMENT_OCR_MODEL_DIR: /usr/share/tesseract-ocr/5/tessdata
      DOCUMENT_OCR_CPU_THREADS: ${DOCUMENT_OCR_CPU_THREADS:-2}
      DOCUMENT_VIETOCR_ENABLED: ${DOCUMENT_VIETOCR_ENABLED:-1}
      DOCUMENT_VIETOCR_MODEL_DIR: /opt/vietocr
      # Đọc CCCD bằng VNPT eKYC trước, lỗi/thiếu thì dùng OCR local (mặc định tắt = chỉ OCR local).
      EKYC_ENABLED: ${EKYC_ENABLED:-0}
      EKYC_ACCESS_TOKEN: ${EKYC_ACCESS_TOKEN:-}
      EKYC_TOKEN_ID: ${EKYC_TOKEN_ID:-}
      EKYC_TOKEN: ${EKYC_TOKEN:-}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false

  location-service:
    build:
      context: ./services/location-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/locations/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      LOCATION_DATABASE_URL: ${LOCATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      LOCATION_SEARCH_ENABLED: ${LOCATION_SEARCH_ENABLED:-false}
      LOCATION_GOONG_TIMEOUT_SECONDS: ${LOCATION_GOONG_TIMEOUT_SECONDS:-5}
      LOCATION_SEARCH_TIMEOUT_SECONDS: ${LOCATION_SEARCH_TIMEOUT_SECONDS:-20}
      LOCATION_GOONG_MAX_RPS: ${LOCATION_GOONG_MAX_RPS:-4}
      LOCATION_GOONG_DAILY_BUDGET: ${LOCATION_GOONG_DAILY_BUDGET:-1000}
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem:/run/keys/jwt_public.pem:ro

  consultation-service:
    build:
      context: ./services/consultation-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/consultations/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      CONSULTATION_DATABASE_URL: ${CONSULTATION_DATABASE_URL:-}
      LAWYER_SERVICE_URL: ${LAWYER_SERVICE_URL:-http://lawyer-service:8000}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8000}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro

  notification-service:
    build:
      context: ./services/notification-service
      additional_contexts:
        libs: ./libs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/notifications/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
      # Container notification-worker đã nghe event; tắt consumer trong API để không có 2 tiến trình cùng ghi DB.
      RUN_NOTIFICATION_HUB_IN_API: "false"
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.keys}/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false
      - notification-data:/app/data

  notification-worker:
    build:
      context: ./services/notification-service
      additional_contexts:
        libs: ./libs
    command: ["python", "-m", "app.notification_event_worker"]
    restart: unless-stopped
    environment:
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}:${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}@rabbitmq-core-events:5672/
    volumes:
      - ${JWT_KEYS_DIR:-./.keys}:/run/keys:ro
      - notification-data:/app/data
    depends_on:
      rabbitmq-core-events:
        condition: service_healthy

  # ==========================================================
  # BROKER 1: Điều phối Sự kiện Nghiệp vụ (Business Events Broker)
  # Quản lý Domain Events: auth, user, lawyer, notification, consultation
  # ==========================================================
  rabbitmq-core-events:
    image: rabbitmq:3-management-alpine
    # hostname cố định: RabbitMQ lưu dữ liệu theo tên node, đổi hostname là mất queue.
    hostname: rabbitmq-core-events
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Thieu RABBITMQ_USER trong .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Thieu RABBITMQ_PASSWORD trong .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      default:
        aliases:
          - rabbitmq
          - rabbitmq-core-events

volumes:
  notification-data:
  rabbitmq-data:
