# Opt-in only AFTER Notification implements /internal/v1/notifications/events.
# Outbox collection does not require running this dispatcher.
services:
  document-notification-worker:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
      additional_contexts:
        libs: ./libs
    command: ["python", "-m", "app.notification_worker"]
    environment:
      DOCUMENT_DATABASE_URL: ${DOCUMENT_DATABASE_URL:-}
      DOCUMENT_DATABASE_POOLER_HOST: ${DOCUMENT_DATABASE_POOLER_HOST:-}
      DOCUMENT_SUPABASE_URL: ${DOCUMENT_SUPABASE_URL:-}
      DOCUMENT_SUPABASE_SERVICE_ROLE_KEY: ${DOCUMENT_SUPABASE_SERVICE_ROLE_KEY:-}
      DOCUMENT_NOTIFICATIONS_ENABLED: ${DOCUMENT_NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    init: true
    user: "65532:65532"
    pids_limit: 64
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
