# Render Blueprint: tạo gateway + các service một lần (Render Dashboard → New → Blueprint → chọn repo này).
#
# - Biến có `sync: false` Render sẽ hỏi giá trị lúc tạo Blueprint (DB URL, API key...).
# - Secret file JWT KHÔNG khai báo được ở đây, phải thêm tay trên Dashboard sau khi tạo (xem RENDER_DEPLOY.md):
#     + jwt_public.pem  → thêm vào Environment Group "ailegal-shared" (mọi service dùng)
#     + jwt_private.pem → chỉ thêm vào ailegal-user-service
# - URL các service đoán theo tên service. Nếu Render báo tên đã bị dùng và gắn thêm hậu tố,
#   sửa lại URL tương ứng trong Environment Group "ailegal-shared" (chỉ sửa một chỗ).

envVarGroups:
  - name: ailegal-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: JWT_PUBLIC_KEY_PATH
        value: /etc/secrets/jwt_public.pem
      # Không có dấu "/" ở cuối URL.
      - key: AGENT_SERVICE_URL
        value: https://ailegal-agent-service.onrender.com
      - key: USER_SERVICE_URL
        value: https://ailegal-user-service.onrender.com
      - key: LAWYER_SERVICE_URL
        value: https://ailegal-lawyer-service.onrender.com
      - key: PROCEDURE_SERVICE_URL
        value: https://ailegal-procedure-service.onrender.com
      - key: RAG_SERVICE_URL
        value: https://ailegal-rag-service.onrender.com
      - key: CONTRACT_SERVICE_URL
        value: https://ailegal-contract-service.onrender.com
      - key: DOCUMENT_SERVICE_URL
        value: https://ailegal-document-service.onrender.com
      - key: LOCATION_SERVICE_URL
        value: https://ailegal-location-service.onrender.com
      - key: CONSULTATION_SERVICE_URL
        value: https://ailegal-consultation-service.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://ailegal-notification-service.onrender.com

  - name: ailegal-lawyer-auth
    envVars:
      - key: LAWYER_SERVICE_TOKEN
        generateValue: true

  # Thêm secret REDIS_URL vào group này trên Dashboard, rồi xoá REDIS_URL riêng ở agent/rag.
  # Redis bên ngoài phải đặt maxmemory-policy=volatile-lru.
  - name: ailegal-cache
    envVars:
      - key: CORPUS_VERSION_KEY
        value: legal:corpus_version

services:
  # ───────────── Gateway (FE chỉ gọi vào đây) ─────────────
  - type: web
    name: ailegal-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./gateway/Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    envVars:
      - fromGroup: ailegal-shared
      # Origin của FE đã deploy, vd. https://ten-app.vercel.app (không có "/" cuối)
      - key: FRONTEND_ORIGIN
        sync: false
      # Chỉ đổi thành "true" khi domain public đứng sau Cloudflare Proxy; mặc định "false" để chống giả mạo CF-Connecting-IP
      - key: TRUST_CLOUDFLARE_HEADERS
        value: "false"

  # ───────────── user-service ─────────────
  - type: web
    name: ailegal-user-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/user-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/users/health
    envVars:
      - fromGroup: ailegal-shared
      - fromGroup: ailegal-lawyer-auth
      # Bắt buộc đặt trên dashboard = origin FE (như FRONTEND_ORIGIN); thiếu → login/refresh trả 403 CSRF_ORIGIN_DENIED
      - key: AUTH_BROWSER_ORIGINS
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: USER_DATABASE_URL
        sync: false
      - key: OUTBOX_ENABLED
        value: "true"
      - key: RUN_LOGOUT_AUDIT_IN_API
        value: "true"
      - key: JWT_PRIVATE_KEY_PATH
        value: /etc/secrets/jwt_private.pem
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLOCK_SKEW_SECONDS
        value: "10"
      # FE và BE khác domain → cookie phải SameSite=None + Secure
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_REFRESH_COOKIE_PATH
        value: /api/users/auth

  # ───────────── lawyer-service ─────────────
  - type: web
    name: ailegal-lawyer-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/lawyer-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/lawyers/health
    envVars:
      - fromGroup: ailegal-shared
      - fromGroup: ailegal-lawyer-auth
      - key: RABBITMQ_URL
        sync: false
      - key: LAWYER_DATABASE_URL
        sync: false
      - key: OUTBOX_ENABLED
        value: "true"
      - key: LAWYER_REAPPLY_COOLDOWN_HOURS
        value: "24"

  # ───────────── consultation-service ─────────────
  - type: web
    name: ailegal-consultation-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/consultation-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/consultations/health
    envVars:
      - fromGroup: ailegal-shared
      - key: CONSULTATION_DATABASE_URL
        sync: false
      - key: USER_ACTIVE_CACHE_SECONDS
        value: "30"
      - key: CONSULTATION_ALLOWED_ORIGINS
        sync: false
      - key: RABBITMQ_URL
        sync: false

  # ───────────── agent-service ─────────────
  - type: web
    name: ailegal-agent-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/agent-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/agent/health
    envVars:
      - fromGroup: ailegal-shared
      - fromGroup: ailegal-cache
      - key: AGENT_DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      # Chỉ OpenRouter: tuyến duy nhất đã xác minh giá + trần $0.01/câu (đồng bộ docker-compose.yml và config.py)
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_BYPASS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_AUX_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_MAX_RETRIES
        value: "0"
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        sync: false
      # Ngân sách $0.01/câu (gồm embedding) + chất lượng; giá trị khớp config.py và docker-compose.yml
      - key: OPENROUTER_REASONING_MAX_TOKENS
        value: "0"
      - key: LLM_AUX_REASONING_MAX_TOKENS
        value: "0"
      - key: CASE_COST_BUDGET_MICRO_USD
        value: "10000"
      - key: CASE_TOKEN_BUDGET_MAX
        value: "0"
      - key: CASE_TOKEN_BUDGET_TARGET
        value: "0"
      - key: DAILY_TOKEN_QUOTA_ENABLED
        value: "true"
      - key: DAILY_TOKEN_LIMIT
        value: "20000"
      - key: TRUST_CLOUDFLARE_HEADERS
        value: "false"
      - key: SSE_HEARTBEAT_SECONDS
        value: "10"
      - key: MINUTES_COST_BUDGET_MICRO_USD
        value: "30000"
      - key: TEST_UNLIMITED_USERS
        sync: false
      - key: PLANNER_MAX_OUTPUT_TOKENS
        value: "896"
      - key: CASE_COMPLEX_MAX_OUTPUT_TOKENS
        value: "3500"
      - key: CASE_MAX_OUTPUT_TOKENS
        value: "3500"
      - key: CASE_TOTAL_DEADLINE_SECONDS
        value: "90"
      - key: ADAPTIVE_RAG_ENABLED
        value: "true"
      - key: RAG_BATCH_ENABLED
        value: "true"
      - key: RELEVANCE_CHECK
        value: "true"
      - key: CASE_RELEVANCE_DEDUP_ENABLED
        value: "true"
      - key: QUERY_REWRITE_ENABLED
        value: "false"
      - key: CASE_MAX_ISSUES
        value: "8"
      - key: CASE_MAX_RETRIEVAL_QUERIES
        value: "8"
      - key: CASE_MAX_RETRIEVAL_ROUNDS
        value: "2"
      - key: CASE_RETRIEVAL_CONCURRENCY
        value: "3"
      - key: CASE_CANDIDATE_K_PER_ISSUE
        value: "12"
      - key: CASE_MAX_CANDIDATES
        value: "48"
      - key: CASE_SELECT_MAX
        value: "16"
      - key: RESPONDER_INPUT_TARGET
        value: "8000"
      - key: CASE_CONTEXT_TOKEN_BUDGET
        value: "6000"
      - key: RELEVANCE_TOTAL_INPUT_TOKENS
        value: "3600"
      - key: RELEVANCE_TOTAL_OUTPUT_TOKENS
        value: "320"
      - key: EMBEDDING_TOTAL_INPUT_TOKENS
        value: "1024"
      - key: RELEVANCE_CHUNK_CHARS
        value: "800"
      - key: EMBEDDING_PRICE_NANO_PER_TOKEN
        value: "150"

  # ───────────── rag-service ─────────────
  - type: web
    name: ailegal-rag-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/rag-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/rag/health
    envVars:
      - fromGroup: ailegal-shared
      - fromGroup: ailegal-cache
      - key: RABBITMQ_URL
        sync: false
      - key: RAG_DATABASE_URL
        sync: false
      - key: RUN_RAG_INDEXING_WORKER_IN_API
        value: "true"
      - key: RAG_DB_CONCURRENCY_LIMIT
        value: "4"
      - key: RAG_DB_QUEUE_MAX_WAITING
        value: "96"
      - key: RAG_DB_QUEUE_WAIT_SECONDS
        value: "25"
      - key: RAG_DB_INTERACTIVE_BURST
        value: "3"
      - key: RAG_DB_PER_TENANT_BURST
        value: "3"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Một tuyến embedding online trên cả Compose và Render (OpenRouter), đồng bộ với agent-service
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: OPENROUTER_EMBEDDING_MODEL
        value: google/gemini-embedding-001
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: EMBEDDING_ONLINE_MAX_RETRIES
        value: "0"
      - key: EMBEDDING_PRICE_NANO_PER_TOKEN
        value: "150"

  # ───────────── procedure-service ─────────────
  - type: web
    name: ailegal-procedure-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/procedure-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/procedures/health
    envVars:
      - fromGroup: ailegal-shared
      - key: OUTBOX_ENABLED
        value: "true"
      - key: ONLYOFFICE_JWT_SECRET
        generateValue: true
      - key: RABBITMQ_URL
        sync: false
      - key: PROCEDURE_DATABASE_URL
        sync: false

  # ───────────── location-service ─────────────
  - type: web
    name: ailegal-location-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/location-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/locations/health
    envVars:
      - fromGroup: ailegal-shared
      - key: LOCATION_DATABASE_URL
        sync: false

  # ───────────── contract-service ─────────────
  # Có LibreOffice để xuất file; gói free 512 MB có thể thiếu RAM khi convert file lớn.
  - type: web
    name: ailegal-contract-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/contract-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/contracts/health
    envVars:
      - fromGroup: ailegal-shared
      - key: RABBITMQ_URL
        sync: false
      - key: CONTRACT_DATABASE_URL
        sync: false
      - key: CONTRACT_SUPABASE_URL
        sync: false
      - key: CONTRACT_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CONTRACT_STORAGE_BUCKET
        value: contract-files
      # Origin FE đã deploy (giống FRONTEND_ORIGIN của gateway); nhiều origin thì ngăn bằng dấu phẩy
      - key: CONTRACT_ALLOWED_ORIGINS
        sync: false

  # ───────────── notification-service ─────────────
  - type: web
    name: ailegal-notification-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/notification-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/notifications/health
    envVars:
      - fromGroup: ailegal-shared
      - key: RABBITMQ_URL
        sync: false
      - key: NOTIFICATION_DATABASE_URL
        sync: false
      - key: RUN_REPORT_ENRICHMENT_IN_API
        value: "true"

  # ───────────── document-service (TẮT mặc định) ─────────────
  # Image có torch + VietOCR + Tesseract, cần >= 2 GB RAM → gói free không chạy được, phải dùng gói trả phí
  # (Standard trở lên). Muốn bật thì bỏ comment khối dưới.
  # - type: web
  #   name: ailegal-document-service
  #   runtime: docker
  #   plan: standard
  #   region: singapore
  #   dockerfilePath: ./services/document-service/Dockerfile.render
  #   dockerContext: .
  #   healthCheckPath: /api/v1/documents/health
  #   envVars:
  #     - fromGroup: ailegal-shared
  #     - key: DOCUMENT_DATABASE_URL
  #       sync: false
  #     - key: DOCUMENT_DATABASE_POOLER_HOST
  #       sync: false
  #     - key: DOCUMENT_SUPABASE_URL
  #       sync: false
  #     - key: DOCUMENT_SUPABASE_SERVICE_ROLE_KEY
  #       sync: false
  #     - key: DOCUMENT_STORAGE_BUCKET
  #       value: document-files
  #     - key: DOCUMENT_HTTP_TIMEOUT_SECONDS
  #       value: "20"
  #     - key: DOCUMENT_ALLOWED_ORIGINS
  #       sync: false
  #     - key: DOCUMENT_OCR_MODEL_DIR
  #       value: /usr/share/tesseract-ocr/5/tessdata
  #     - key: DOCUMENT_OCR_CPU_THREADS
  #       value: "2"
  #     - key: DOCUMENT_VIETOCR_ENABLED
  #       value: "1"
  #     - key: DOCUMENT_VIETOCR_MODEL_DIR
  #       value: /opt/vietocr
