# =====================================================================
# SonarQube / SonarCloud Configuration — Backend (Python)
# =====================================================================
# Bảo mật: TUYỆT ĐỐI KHÔNG lưu sonar.token hoặc sonar.login trong file này.
# Sử dụng `sonar auth login` (lưu trong OS Keychain) hoặc biến môi trường SONAR_TOKEN.

sonar.projectKey=legal-assistant-ai-be
sonar.projectName=Legal Assistant AI - Backend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Đường dẫn mã nguồn & kiểm thử
sonar.sources=services,libs,gateway,contracts,database
sonar.tests=tests

# Loại trừ các thư mục phụ trợ, cache và khóa bảo mật
sonar.exclusions=\
  **/.pytest_cache/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/venv/**,\
  **/.venv/**,\
  **/.keys/**,\
  **/keys/**,\
  **/.postman/**,\
  **/postman/**,\
  **/.env*,\
  **/*.pem,\
  **/*.key,\
  **/*.sql,\
  **/*.docx,\
  **/*.pdf,\
  **/*.png

# Cấu hình Python & Báo cáo kiểm thử
sonar.python.version=3.12
sonar.python.xunit.reportPath=backend-junit.xml
sonar.python.coverage.reportPaths=coverage.xml
