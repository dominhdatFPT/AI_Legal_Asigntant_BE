openapi: 3.0.3

info:
  title: RAG Service API
  version: 0.1.0
  description: API quản lý văn bản pháp luật và tìm kiếm ngữ nghĩa (Retrieval-Augmented Generation).
  x-owner: "Dũng"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://rag-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Documents
    description: Quản lý văn bản pháp luật (chỉ vai trò `admin`)
  - name: Internal
    description: API cho agent-service gọi trong mạng Docker (không qua Gateway)

paths:
  /rag/health:
    get:
      tags: [Health]
      operationId: getRagHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: rag-service }

  # ---------------------------------------------------------------- Documents
  /rag/documents:
    post:
      tags: [Documents]
      operationId: createDocument
      summary: Thêm văn bản pháp luật mới
      description: |
        Chỉ `admin`. Nhận metadata và nội dung văn bản, tự động cắt chunk và tạo embedding.
        Quá trình embedding có thể mất vài giây đến vài phút tuỳ kích thước văn bản.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentRequest" }
            example:
              title: Luật Đất đai 2024
              doc_type: luat
              doc_number: 31/2024/QH15
              issuing_body: Quốc hội
              issued_date: "2024-01-18"
              effective_date: "2025-01-01"
              status: active
              source_url: https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-31-2024-QH15-600636.aspx
              content: "Chương I. QUY ĐỊNH CHUNG\nĐiều 1. Phạm vi điều chỉnh..."
      responses:
        "201":
          description: Văn bản đã được tạo, đang xử lý embedding
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Văn bản với số hiệu này đã tồn tại
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: DOCUMENT_ALREADY_EXISTS
                  message: Văn bản với số hiệu này đã tồn tại trong hệ thống.
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Danh sách văn bản pháp luật
      description: Chỉ `admin`. Lọc theo loại và trạng thái; có phân trang.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: doc_type
          in: query
          description: Lọc theo loại văn bản. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/DocType" }
        - name: status
          in: query
          description: Lọc theo trạng thái. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/DocStatus" }
        - name: q
          in: query
          description: Tìm theo tiêu đề hoặc số hiệu (không phân biệt hoa thường).
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách văn bản (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /rag/documents/{document_id}:
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Chi tiết một văn bản
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Thông tin văn bản
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [Documents]
      operationId: updateDocument
      summary: Cập nhật metadata văn bản
      description: |
        Chỉ `admin`. Chỉ cập nhật được metadata (tiêu đề, trạng thái, nguồn...).
        Không sửa được `content` qua endpoint này — nếu nội dung thay đổi,
        dùng `POST /rag/documents/{document_id}/reprocess`.
        Trường nào không gửi thì giữ nguyên.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDocumentRequest" }
            example: { status: superseded }
      responses:
        "200":
          description: Văn bản sau khi cập nhật
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Xóa văn bản và toàn bộ chunks
      description: Chỉ `admin`. Xóa vĩnh viễn văn bản và tất cả chunks liên quan (CASCADE).
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Đã xóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResponse" }
              example:
                data: { deleted: true }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /rag/documents/{document_id}/reprocess:
    post:
      tags: [Documents]
      operationId: reprocessDocument
      summary: Tái tạo chunks và embedding
      description: |
        Chỉ `admin`. Dùng khi nội dung văn bản thay đổi hoặc cần dùng model embedding mới.
        Xóa toàn bộ chunks cũ, cắt lại và tạo embedding mới.
        Trong thời gian xử lý, văn bản vẫn tìm kiếm được bằng chunks cũ cho đến khi hoàn tất.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReprocessRequest" }
            example:
              content: "Chương I. QUY ĐỊNH CHUNG (nội dung đã cập nhật)..."
      responses:
        "200":
          description: Đã bắt đầu tái xử lý
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "409":
          description: Đang có tiến trình xử lý embedding cho văn bản này
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: PROCESSING_IN_PROGRESS
                  message: Văn bản này đang được xử lý, vui lòng thử lại sau.
                request_id: req-123
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Internal
  /internal/v1/rag/search:
    post:
      tags: [Internal]
      operationId: semanticSearch
      summary: Tìm kiếm ngữ nghĩa theo câu hỏi
      description: |
        Chỉ agent-service gọi, kèm `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.
        Nhận câu hỏi, tạo embedding (Gemini `gemini-embedding-001`, 768 chiều, `task_type=RETRIEVAL_QUERY`)
        rồi tìm top-k chunks gần nhất theo khoảng cách cosine trong pgvector.
        Chỉ tìm trong văn bản có `status = 'active'` và chunk tạo bằng cùng model embedding.
      x-status: implemented
      servers:
        - url: http://rag-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
            example:
              query: Thủ tục chuyển nhượng quyền sử dụng đất cần những giấy tờ gì?
              top_k: 5
              doc_types: [luat, nghi_dinh]
      responses:
        "200":
          description: Danh sách chunks liên quan nhất (rỗng thì `chunks` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
              example:
                data:
                  chunks:
                    - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      content: "Điều 188. Điều kiện thực hiện các quyền chuyển đổi, chuyển nhượng..."
                      score: 0.92
                      section_info:
                        chuong: null
                        dieu: "188"
                        khoan: "1"
                        diem: null
                      document:
                        id: f1e2d3c4-b5a6-7890-abcd-ef1234567890
                        title: Luật Đất đai 2024
                        doc_number: 31/2024/QH15
                        doc_type: luat
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Gemini embedding quá tải / hết quota, hoặc không kết nối được database
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                embedding:
                  summary: Gemini embedding lỗi
                  value:
                    data: null
                    error:
                      code: EMBEDDING_SERVICE_UNAVAILABLE
                      message: Dịch vụ tạo embedding đang bận, vui lòng thử lại sau.
                    request_id: req-123
                database:
                  summary: Database lỗi
                  value:
                    data: null
                    error:
                      code: RAG_DATABASE_UNAVAILABLE
                      message: Không truy cập được kho văn bản, vui lòng thử lại sau.
                    request_id: req-123

  /internal/v1/rag/articles:
    post:
      tags: [Internal]
      operationId: getArticle
      summary: Tra cứu nguyên văn một Điều / Khoản
      description: |
        Chỉ agent-service gọi, kèm `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.
        Tìm văn bản theo tên hoặc số hiệu (`law`, không phân biệt hoa thường, có dấu hay không dấu, có thể bỏ năm),
        rồi cắt đúng Điều `dieu` (và Khoản `khoan` nếu có) từ toàn văn gốc. Không dùng embedding, không gọi Gemini.
        Tên khớp nhiều văn bản thì ưu tiên văn bản `active`; tên có năm mà kho không có năm đó thì dùng bản đang có và ghi `note`.
      x-status: implemented
      servers:
        - url: http://rag-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleRequest" }
            example:
              law: Luật Đất đai 2024
              dieu: "220"
              khoan: "2"
      responses:
        "200":
          description: Nguyên văn Điều / Khoản
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleResponse" }
              example:
                data:
                  document:
                    id: f1e2d3c4-b5a6-7890-abcd-ef1234567890
                    title: Luật Đất đai 2024
                    doc_number: 31/2024/QH15
                    doc_type: luat
                    status: active
                  chuong: XIII
                  dieu: "220"
                  khoan: "2"
                  content: "Điều 220. Tách thửa đất, hợp thửa đất\n2. Trường hợp tách thửa đất thì ..."
                  note: null
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Không có văn bản, Điều hoặc Khoản được hỏi
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                document:
                  summary: Kho chưa có văn bản
                  value:
                    data: null
                    error:
                      code: DOCUMENT_NOT_FOUND
                      message: "Kho văn bản chưa có \"Luật Hôn nhân và gia đình\". Hiện kho có: Luật Doanh nghiệp 2020, Luật Đất đai 2024."
                    request_id: req-123
                article:
                  summary: Văn bản không có Điều này
                  value:
                    data: null
                    error:
                      code: ARTICLE_NOT_FOUND
                      message: Luật Đất đai 2024 không có Điều 999 (văn bản này có 260 Điều).
                    request_id: req-123
                khoan:
                  summary: Điều không có Khoản này
                  value:
                    data: null
                    error:
                      code: KHOAN_NOT_FOUND
                      message: Điều 220 Luật Đất đai 2024 không có khoản 9 (Điều này chỉ có 4 khoản).
                    request_id: req-123
        "409":
          description: Tên văn bản khớp nhiều văn bản cùng còn hiệu lực
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: DOCUMENT_AMBIGUOUS
                  message: "\"Luật Đầu tư\" khớp nhiều văn bản: Luật Đầu tư 2020, Luật Đầu tư 2025. Vui lòng ghi rõ năm hoặc số hiệu."
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Không kết nối được database
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: RAG_DATABASE_UNAVAILABLE
                  message: Không truy cập được kho văn bản, vui lòng thử lại sau.
                request_id: req-123

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`access_token` lấy từ `POST /users/auth/firebase` hoặc `POST /users/auth/refresh`."
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Giá trị `INTERNAL_TOKEN` trong `.env`, chỉ dùng cho `/internal/v1/...`.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DocumentId:
      name: document_id
      in: path
      required: true
      description: ID văn bản (UUID)
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  responses:
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: doc_type
                  message: "Loại văn bản phải là một trong: luat, nghi_dinh, thong_tu, quyet_dinh, khac."
            request_id: req-123
    Unauthorized:
      description: Thiếu token, token sai hoặc đã hết hạn
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            thieu_token:
              summary: Thiếu hoặc sai token
              value:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: Bạn cần đăng nhập để tiếp tục.
                request_id: req-123
            het_han:
              summary: Token hết hạn
              value:
                data: null
                error:
                  code: TOKEN_EXPIRED
                  message: Phiên đăng nhập đã hết hạn.
                request_id: req-124
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: FORBIDDEN
              message: Bạn không có quyền thực hiện thao tác này.
            request_id: req-123
    DocumentNotFound:
      description: Không có văn bản với ID này
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: DOCUMENT_NOT_FOUND
              message: Không tìm thấy văn bản pháp luật.
            request_id: req-123
    InternalError:
      description: Lỗi backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:        { type: integer, minimum: 1, example: 1 }
        page_size:   { type: integer, minimum: 1, maximum: 100, example: 20 }
        total:       { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, dùng để xử lý phía gọi
          example: DOCUMENT_NOT_FOUND
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field:   { type: string, example: doc_type }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          nullable: true
          enum: [null]
        error:      { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Enum ----------
    DocType:
      type: string
      description: "Loại văn bản: `luat` = Luật, `nghi_dinh` = Nghị định, `thong_tu` = Thông tư, `quyet_dinh` = Quyết định, `khac` = Khác"
      enum: [luat, nghi_dinh, thong_tu, quyet_dinh, khac]

    DocStatus:
      type: string
      description: "Trạng thái: `active` = còn hiệu lực, `superseded` = đã bị thay thế, `draft` = chưa công bố"
      enum: [active, superseded, draft]

    # ---------- Văn bản pháp luật ----------
    LegalDocument:
      type: object
      required: [id, title, doc_type, status, chunk_count, is_processed, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        title:          { type: string, example: "Luật Đất đai 2024" }
        doc_type:       { $ref: "#/components/schemas/DocType" }
        doc_number:     { type: string, nullable: true, example: "31/2024/QH15" }
        issuing_body:   { type: string, nullable: true, example: "Quốc hội" }
        issued_date:    { type: string, format: date, nullable: true }
        effective_date: { type: string, format: date, nullable: true }
        status:         { $ref: "#/components/schemas/DocStatus" }
        source_url:     { type: string, format: uri, nullable: true }
        chunk_count:
          type: integer
          description: Số chunk đã tạo từ văn bản
          example: 142
        is_processed:
          type: boolean
          description: "`true` khi tất cả chunks đã có embedding và sẵn sàng tìm kiếm"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LegalDocumentBrief:
      type: object
      description: Thông tin rút gọn của văn bản, trả về kèm mỗi chunk trong kết quả tìm kiếm
      required: [id, title, doc_type]
      properties:
        id:         { type: string, format: uuid }
        title:      { type: string }
        doc_number: { type: string, nullable: true }
        doc_type:   { $ref: "#/components/schemas/DocType" }

    ChunkSearchResult:
      type: object
      required: [id, content, score, document]
      properties:
        id:
          type: string
          format: uuid
          description: ID của chunk trong bảng `document_chunks`
        content:
          type: string
          description: Nội dung đoạn văn bản — đây là thứ agent-service ghép vào prompt
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Điểm tương đồng cosine (0–1); càng cao càng liên quan đến câu hỏi
          example: 0.92
        section_info:
          type: object
          nullable: true
          description: Vị trí trong văn bản để agent-service tạo câu trích dẫn
          properties:
            chuong: { type: string, nullable: true, example: "I" }
            dieu:   { type: string, nullable: true, example: "188" }
            khoan:  { type: string, nullable: true, example: "1" }
            diem:   { type: string, nullable: true, example: "a" }
        document:
          $ref: "#/components/schemas/LegalDocumentBrief"

    # ---------- Body gửi lên ----------
    CreateDocumentRequest:
      type: object
      required: [title, doc_type, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        doc_type:
          $ref: "#/components/schemas/DocType"
        doc_number:
          type: string
          maxLength: 100
          nullable: true
          description: Số hiệu văn bản, VD 31/2024/QH15
        issuing_body:
          type: string
          maxLength: 255
          nullable: true
        issued_date:
          type: string
          format: date
          nullable: true
        effective_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [active, superseded, draft]
          default: active
        source_url:
          type: string
          format: uri
          nullable: true
        content:
          type: string
          minLength: 1
          description: Toàn bộ nội dung văn bản dạng plain text

    UpdateDocumentRequest:
      type: object
      minProperties: 1
      description: Chỉ cập nhật được metadata — không cập nhật được `content`
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        issuing_body:
          type: string
          maxLength: 255
          nullable: true
        issued_date:
          type: string
          format: date
          nullable: true
        effective_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [active, superseded, draft]
        source_url:
          type: string
          format: uri
          nullable: true

    ReprocessRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          description: |
            Nội dung mới của văn bản nếu có thay đổi.
            Bỏ trống = giữ nguyên nội dung cũ, chỉ tạo lại embedding bằng model hiện tại.

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: Câu hỏi của người dùng (plain text, tiếng Việt)
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Số chunks muốn lấy về
        doc_types:
          type: array
          nullable: true
          description: Lọc theo loại văn bản. Bỏ trống = tìm trong tất cả loại.
          items:
            $ref: "#/components/schemas/DocType"

    ArticleRequest:
      type: object
      required: [law, dieu]
      properties:
        law:
          type: string
          minLength: 1
          maxLength: 200
          description: Tên hoặc số hiệu văn bản, vd `Luật Đất đai 2024`, `luat dat dai`, `31/2024/QH15`
        dieu:
          type: string
          pattern: "^\\d{1,4}[a-zA-Zđ]?$"
          description: Số Điều, vd `45`, `10a`
        khoan:
          type: string
          nullable: true
          pattern: "^\\d{1,3}$"
          description: Số Khoản. Bỏ trống = cả Điều.

    # ---------- Kết quả từng API ----------
    DocumentResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:       { $ref: "#/components/schemas/LegalDocument" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    DocumentListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/LegalDocument" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    SearchResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [chunks]
          properties:
            chunks:
              type: array
              items: { $ref: "#/components/schemas/ChunkSearchResult" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ArticleResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [document, dieu, content]
          properties:
            document:
              type: object
              required: [id, title, doc_type, status]
              properties:
                id:         { type: string, format: uuid }
                title:      { type: string, example: Luật Đất đai 2024 }
                doc_number: { type: string, nullable: true, example: 31/2024/QH15 }
                doc_type:   { $ref: "#/components/schemas/DocType" }
                status:     { $ref: "#/components/schemas/DocStatus" }
            chuong:  { type: string, nullable: true, example: XIII }
            dieu:    { type: string, example: "220" }
            khoan:   { type: string, nullable: true, example: "2" }
            content:
              type: string
              description: Nguyên văn, dòng đầu là "Điều X. Tên điều"; hỏi Khoản thì chỉ gồm dòng tên Điều + Khoản đó
            note:
              type: string
              nullable: true
              description: Ghi chú khi phải dùng văn bản khác năm người hỏi
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    DeleteResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: boolean, example: true }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }