openapi: 3.0.3

info:
  title: User Service API
  version: 0.1.0
  description: API tài khoản, đăng nhập Firebase (Google, email/mật khẩu), JWT, hồ sơ và vai trò người dùng.
  x-owner: "Người 1 · Đạt"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://user-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Auth
    description: Đăng nhập Firebase, làm mới token, đăng xuất
  - name: Profile
    description: Hồ sơ của người đang đăng nhập
  - name: Admin
    description: Quản lý người dùng (chỉ vai trò `admin`)
  - name: Internal
    description: API cho service khác gọi trong mạng Docker (không qua Gateway)

paths:
  /users/health:
    get:
      tags: [Health]
      operationId: getUserHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: user-service }

  # ---------------------------------------------------------------- Auth
  /users/auth/firebase:
    post:
      tags: [Auth]
      operationId: loginWithFirebase
      summary: Đăng nhập bằng Firebase (Google hoặc email/mật khẩu)
      description: |
        Nhận Firebase ID token (`user.getIdToken()` ở FE), kiểm tra chữ ký và `aud`
        (= `FIREBASE_PROJECT_ID`). Lần đầu đăng nhập thì tạo user mới với vai trò `citizen`.
        Mặc định không bắt xác thực email. Chỉ khi đặt `REQUIRE_EMAIL_VERIFICATION=true`
        thì tài khoản email/mật khẩu chưa xác thực email mới bị trả 403 `EMAIL_NOT_VERIFIED`.
        Tài khoản đang bị khóa thì trả 403 `ACCOUNT_LOCKED` (message có thời hạn và lý do khóa).
        Tài khoản Google / email đã bị admin xóa mềm thì trả 403 `ACCOUNT_DELETED` (không tự đăng ký lại được).
        Email trùng tài khoản tự đăng ký (`POST /users/auth/register`) và Firebase báo email đã xác minh
        (`email_verified = true`, ví dụ Google) thì tự liên kết vào tài khoản đó (`is_new_user = false`):
        gắn `firebase_uid`, xóa mật khẩu cũ và thu hồi mọi refresh token cũ (chống chiếm trước tài khoản).
        Các trường hợp email trùng khác trả 409 `EMAIL_IN_USE`.
        Thành công: token trả trong body (dùng với Bearer) và đồng thời được set vào 2 HttpOnly cookie
        `access_token` (path `/`) và `refresh_token` (path `AUTH_REFRESH_COOKIE_PATH`, mặc định `/api`).
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirebaseLoginRequest" }
            example: { id_token: "eyJhbGciOiJSUzI1NiIsImtpZCI6..." }
      responses:
        "200":
          description: Đăng nhập thành công
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiJ9.access...
                  refresh_token: 3f1c9a7e-refresh-token-value
                  token_type: Bearer
                  expires_in: 900
                  is_new_user: false
                  user:
                    id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                    email: nguyenvana@gmail.com
                    full_name: Nguyễn Văn A
                    avatar_url: https://lh3.googleusercontent.com/a/abc
                    phone: null
                    role: citizen
                    status: active
                    locked_reason: null
                    locked_at: null
                    created_at: "2026-10-05T08:00:00Z"
                    updated_at: "2026-10-05T08:00:00Z"
                error: null
                request_id: req-123
        "401":
          description: "`id_token` sai, hết hạn, không phải của dự án hoặc không có email"
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: INVALID_FIREBASE_TOKEN
                  message: Đăng nhập không hợp lệ, vui lòng thử lại.
                request_id: req-123
        "403":
          description: Tài khoản bị khóa, hoặc tài khoản email/mật khẩu chưa xác thực email
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                bi_khoa:
                  summary: Tài khoản bị khóa
                  value:
                    data: null
                    error:
                      code: ACCOUNT_LOCKED
                      message: Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.
                    request_id: req-123
                chua_xac_thuc_email:
                  summary: Chưa xác thực email
                  value:
                    data: null
                    error:
                      code: EMAIL_NOT_VERIFIED
                      message: Vui lòng xác thực email trước khi đăng nhập.
                    request_id: req-123
        "409":
          description: Email đã thuộc một tài khoản khác
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: EMAIL_IN_USE
                  message: Email này đã được dùng cho một tài khoản khác.
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/auth/register:
    post:
      tags: [Auth]
      operationId: registerWithPassword
      summary: Tự đăng ký tài khoản bằng email + số điện thoại + mật khẩu
      description: |
        Tạo tài khoản `local` vai trò `citizen`, `username` = email (lưu chữ thường), mật khẩu lưu dạng bcrypt hash.
        Không xác minh email / SĐT. Đăng ký xong là đăng nhập luôn: response và 2 HttpOnly cookie giống
        `POST /users/auth/login`, `is_new_user = true`. Lần sau đăng nhập bằng `POST /users/auth/login` với email.
        `confirm_password` khác `password` thì trả 422 `VALIDATION_ERROR`.
        Email đã có tài khoản (kể cả tài khoản Google) trả 409 `EMAIL_IN_USE`; SĐT đã có tài khoản trả 409 `PHONE_IN_USE`.
        Email thuộc tài khoản đã bị xóa mềm trả 403 `ACCOUNT_DELETED`.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example: { email: an.nguyen@gmail.com, phone: "0912345678", password: "matkhau123", confirm_password: "matkhau123" }
      responses:
        "201":
          description: Đăng ký và đăng nhập thành công
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "403":
          description: Email thuộc tài khoản đã bị xóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: ACCOUNT_DELETED
                  message: Tài khoản này đã bị xóa. Vui lòng liên hệ quản trị viên để được khôi phục.
                request_id: req-123
        "409":
          description: "`EMAIL_IN_USE` = email đã có tài khoản. `PHONE_IN_USE` = số điện thoại đã có tài khoản."
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                trung_email:
                  summary: Email đã có tài khoản
                  value:
                    data: null
                    error:
                      code: EMAIL_IN_USE
                      message: Email này đã được dùng cho một tài khoản khác.
                    request_id: req-123
                trung_sdt:
                  summary: SĐT đã có tài khoản
                  value:
                    data: null
                    error:
                      code: PHONE_IN_USE
                      message: Số điện thoại này đã được dùng cho một tài khoản khác.
                    request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Đăng nhập bằng tên đăng nhập + mật khẩu (tài khoản lưu trong database)
      description: |
        Dùng cho tài khoản nội bộ có `username` và `password_hash` trong bảng `users`
        (ví dụ tài khoản quản trị). Mật khẩu so khớp với bcrypt hash; username không phân biệt hoa thường.
        Sai username hoặc mật khẩu đều trả 401 `INVALID_CREDENTIALS`. Tài khoản bị khóa trả 403 `ACCOUNT_LOCKED`.
        Response giống `POST /users/auth/firebase` (`is_new_user` luôn là `false`).
        Cũng set 2 HttpOnly cookie như `POST /users/auth/firebase`.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordLoginRequest" }
            example: { username: admin2026, password: "******" }
      responses:
        "200":
          description: Đăng nhập thành công
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Sai tên đăng nhập hoặc mật khẩu
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: INVALID_CREDENTIALS
                  message: Tên đăng nhập hoặc mật khẩu không chính xác.
                request_id: req-123
        "403":
          description: Tài khoản bị khóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Làm mới access token
      description: |
        Đổi `refresh_token` còn hạn lấy cặp token mới. Refresh token cũ bị thu hồi ngay,
        dùng lại sẽ bị 401. Khi vai trò đổi hoặc tài khoản bị khóa, mọi refresh token của
        người đó bị thu hồi nên phải đăng nhập lại.

        `refresh_token` lấy từ body nếu có, không thì từ HttpOnly cookie `refresh_token`
        (trình duyệt không cần gửi body). Thành công: set lại cả 2 cookie. Thất bại: xoá cookie.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
            example: { refresh_token: "3f1c9a7e-refresh-token-value" }
      responses:
        "200":
          description: Cặp token mới
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPairResponse" }
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiJ9.new-access...
                  refresh_token: 8a2d4b6f-new-refresh-token
                  token_type: Bearer
                  expires_in: 900
                error: null
                request_id: req-123
        "401":
          description: |
            Refresh token sai, hết hạn hoặc đã bị thu hồi.
            `ROLE_CHANGED_RELOGIN`: token bị thu hồi vì vai trò vừa đổi (admin đổi vai trò,
            duyệt đơn luật sư). FE hiện `message` rồi chuyển về trang đăng nhập.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                het_han:
                  summary: Token sai / hết hạn / đã thu hồi
                  value:
                    data: null
                    error:
                      code: INVALID_REFRESH_TOKEN
                      message: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.
                    request_id: req-123
                doi_vai_tro:
                  summary: Vai trò vừa thay đổi
                  value:
                    data: null
                    error:
                      code: ROLE_CHANGED_RELOGIN
                      message: Tài khoản của bạn đã được cập nhật quyền, vui lòng đăng nhập lại
                    request_id: req-124
        "403": { $ref: "#/components/responses/AccountLocked" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Đăng xuất
      description: |
        Thu hồi `refresh_token` (lấy từ body, không có thì từ cookie) và xoá 2 HttpOnly cookie.
        Gọi lại với token đã thu hồi vẫn trả 200.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Đã đăng xuất
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }
              example:
                data: { logged_out: true }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Profile
  /users/me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Xem hồ sơ của tôi
      description: |
        Consultation Service gọi API này (chuyển tiếp JWT của luật sư) để kiểm tra luật sư còn
        hoạt động trước thao tác nhạy cảm như nhận yêu cầu, gửi tin (API_GUIDELINES mục 7).
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Hồ sơ người đang đăng nhập
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountLocked" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Sửa hồ sơ của tôi
      description: |
        Chỉ sửa được `full_name`, `phone`, `avatar_url`. Trường nào không gửi thì giữ nguyên.
        Không đổi được `email`, `role`, `status` qua API này.
      x-status: planned
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
            example: { full_name: Nguyễn Văn A, phone: "0901234567" }
      responses:
        "200":
          description: Hồ sơ sau khi sửa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountLocked" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/me/citizen-profile:
    get:
      tags: [Profile]
      operationId: getMyCitizenProfile
      summary: Xem hồ sơ cá nhân (thông tin CCCD) của tôi
      description: |
        FE gọi khi mở trang hồ sơ để điền sẵn form. Người dùng chưa khai hồ sơ thì `data` là `null`.
        `email` lấy từ tài khoản, chỉ để hiển thị.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Hồ sơ hiện tại, hoặc `data = null` nếu chưa khai
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountLocked" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Profile]
      operationId: upsertMyCitizenProfile
      summary: Lưu hồ sơ cá nhân (thông tin CCCD) của tôi
      description: |
        Lưu cả form một lần (chưa có thì tạo, có rồi thì ghi đè). Luồng:
        1. FE gửi 2 ảnh CCCD sang Document Service (eKYC) và nhận lại các trường đã đọc cùng `ekyc_id`.
           Ảnh mờ/eKYC lỗi thì người dùng up lại ảnh hoặc tự nhập tay (`source = manual`, không có `ekyc_id`).
        2. Người dùng xem lại, nhập thêm số điện thoại, dân tộc, mã số thuế…, tick đồng ý rồi bấm Lưu.
        3. FE gọi API này.

        Khi lưu thành công:
        - `users.full_name` được đổi thành `full_name` trên CCCD.
        - `users.phone` được đổi thành `phone`.

        Số CCCD đã thuộc tài khoản khác thì trả 409 `CCCD_ALREADY_USED`, người dùng phải nhập lại.
        Số điện thoại đã thuộc tài khoản khác thì trả 409 `PHONE_IN_USE`.
        Chưa tick đủ 2 ô `declared` và `consented` thì trả 422 `VALIDATION_ERROR`.
        Ràng buộc chi tiết từng trường (định dạng CCCD, ngày tháng…) sẽ bổ sung ở bước validate.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenProfileRequest" }
            example:
              id_number: "001095012345"
              full_name: NGUYỄN VĂN AN
              date_of_birth: "1995-08-15"
              gender: Nam
              nationality: Việt Nam
              place_of_origin: Xã Hải Châu, Huyện Hải Hậu, Tỉnh Nam Định
              place_of_residence: Số 45 ngõ 120 Hoàng Hoa Thám, Phường Thụy Khuê, Quận Tây Hồ, Hà Nội
              issue_date: "2021-09-20"
              issue_place: Cục Cảnh sát QLHC về TTXH
              expiry_date: "2035-08-15"
              permanent_address: { detail: Số 45 ngõ 120 Hoàng Hoa Thám, ward: Phường Ngọc Hà, province: Thành phố Hà Nội }
              current_same_as_permanent: true
              current_address: null
              phone: "0912345678"
              ethnicity: Kinh
              tax_code: null
              source: ekyc
              ekyc_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              declared: true
              consented: true
      responses:
        "200":
          description: Hồ sơ sau khi lưu
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountLocked" }
        "409":
          description: "`CCCD_ALREADY_USED` = số CCCD đã gắn với tài khoản khác. `PHONE_IN_USE` = SĐT đã gắn với tài khoản khác."
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: CCCD_ALREADY_USED
                  message: Số CCCD này đã được dùng cho một tài khoản khác.
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Admin
  /users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: Danh sách người dùng
      description: |
        Chỉ `admin`. Lọc theo vai trò, trạng thái; tìm theo tên, email, tên đăng nhập hoặc số điện thoại;
        có phân trang, mới tạo xếp trước. Mặc định không có tài khoản đã xóa mềm; `deleted=true` để xem
        riêng các tài khoản đã xóa (để khôi phục). Tài khoản hết hạn khóa được tự mở trước khi lọc.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: role
          in: query
          description: Lọc theo vai trò. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/UserRole" }
        - name: status
          in: query
          description: Lọc theo trạng thái. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: q
          in: query
          description: Tìm theo tên, email, tên đăng nhập, số điện thoại (không phân biệt hoa thường).
          schema: { type: string, maxLength: 100 }
        - name: deleted
          in: query
          description: "`true` = chỉ lấy tài khoản đã xóa mềm. Mặc định `false`."
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách người dùng (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [Admin]
      operationId: createUser
      summary: Admin tạo tài khoản
      description: |
        Chỉ `admin`. Tạo tài khoản đăng nhập bằng email + mật khẩu do admin đặt (không gửi email; admin tự
        đưa thông tin cho người dùng, người dùng đổi mật khẩu sau). Email cũng là tên đăng nhập.
        `account_type`: `citizen` | `admin`, lưu đúng vai trò đó.
        Tạo tài khoản luật sư dùng Lawyer Service `POST /lawyers/accounts` (tạo kèm hồ sơ luật sư);
        `account_type = lawyer` đã bỏ (gửi lên → 422).
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
            example: { email: nguyenvana@gmail.com, password: "matkhau123", full_name: Nguyễn Văn A, account_type: citizen }
      responses:
        "201":
          description: Tài khoản vừa tạo
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            `EMAIL_IN_USE` = email đã có tài khoản. `EMAIL_DELETED` = email thuộc tài khoản đã xóa mềm,
            dùng `POST /users/{user_id}/restore` thay vì tạo mới. `PHONE_IN_USE` = số điện thoại đã có tài khoản.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/summary:
    get:
      tags: [Admin]
      operationId: getUserSummary
      summary: Số đếm cho các tab quản lý người dùng
      description: |
        Chỉ `admin`. `total`, `by_role`, `by_status` không tính tài khoản đã xóa mềm; `deleted` là số
        tài khoản đã xóa mềm.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Số đếm
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummaryResponse" }
              example:
                data:
                  total: 8
                  by_role: { citizen: 5, lawyer: 2, admin: 1 }
                  by_status: { active: 7, locked: 1 }
                  deleted: 0
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{user_id}:
    get:
      tags: [Admin]
      operationId: getUser
      summary: Chi tiết một người dùng
      description: |
        `admin` xem được mọi người, kể cả tài khoản đã xóa mềm (trả `AdminUser`); người khác chỉ xem được
        chính mình (trả `User`). Route dùng convertor `{user_id:uuid}` nên không đè các route tĩnh
        `/users/me`, `/users/health`, `/users/summary`.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Thông tin người dùng
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Xóa mềm tài khoản
      description: |
        Chỉ `admin`. Đánh dấu `deleted_at`, giữ nguyên dữ liệu. Thu hồi mọi refresh token; người đó bị
        chặn ngay ở User Service. Email không đăng ký lại được; admin khôi phục bằng `/restore`.
        Luật sư bị xóa thì các cuộc tư vấn đang mở bị kết thúc (Consultation Service).
        Không được tự xóa chính mình (409 `CANNOT_DELETE_SELF`); tài khoản đã xóa rồi → 409 `USER_DELETED`.

        Xóa tài khoản vai trò `lawyer` thì **trước khi lưu** gọi Lawyer Service
        `POST /internal/v1/lawyers/{user_id}/hide` (`reason = deleted`) để ẩn hồ sơ luật sư. Lawyer Service lỗi
        → 502/503/504 `LAWYER_*`, tài khoản chưa bị xóa; admin thử lại sau.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Đã xóa mềm, không có body
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: Tự xóa chính mình hoặc tài khoản đã bị xóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/LawyerBadResponse" }
        "503": { $ref: "#/components/responses/LawyerUnavailable" }
        "504": { $ref: "#/components/responses/LawyerTimeout" }

  /users/{user_id}/restore:
    post:
      tags: [Admin]
      operationId: restoreUser
      summary: Khôi phục tài khoản đã xóa mềm
      description: Chỉ `admin`. Tài khoản chưa bị xóa → 409 `USER_NOT_DELETED`.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Thông tin người dùng sau khi khôi phục
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: Tài khoản chưa bị xóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{user_id}/citizen-profile:
    get:
      tags: [Admin]
      operationId: getUserCitizenProfile
      summary: Admin xem hồ sơ CCCD của một người dùng
      description: |
        Chỉ `admin`. Dùng cho màn hình chi tiết người dùng. Người dùng chưa khai hồ sơ thì `data` là `null`.
        Xem được cả tài khoản đã xóa mềm.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Hồ sơ CCCD (hoặc `null`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{user_id}/role:
    put:
      tags: [Admin]
      operationId: changeUserRole
      summary: Đổi vai trò người dùng
      description: |
        Chỉ `admin`. Đổi vai trò sẽ thu hồi mọi refresh token của người đó, nên họ phải đăng nhập lại để
        nhận token có vai trò mới (API_GUIDELINES mục 7). Gửi đúng vai trò hiện tại thì không đổi gì (200).
        Hạ vai trò luật sư thì các cuộc tư vấn đang mở bị kết thúc (Consultation Service).
        Không tự đổi vai trò của mình (409 `CANNOT_CHANGE_OWN_ROLE`); tài khoản đã xóa → 409 `USER_DELETED`.

        Chức năng Luật sư:
        - Không đổi **lên** `lawyer` bằng API này → 409 `LAWYER_ROLE_VIA_LAWYER_SERVICE`. Luật sư chỉ có qua
          Lawyer Service (admin tạo tài khoản luật sư hoặc duyệt đơn), để luôn có hồ sơ luật sư đi kèm.
          Lawyer Service duyệt đơn gọi `PUT /internal/v1/users/{user_id}/role`, không gọi API này.
        - Hạ `lawyer` → vai trò khác: **trước khi lưu** gọi Lawyer Service `POST /internal/v1/lawyers/{user_id}/hide`
          (`reason = role_changed`). Lawyer Service lỗi → 502/503/504 `LAWYER_*`, vai trò chưa đổi.
        - Refresh token bị thu hồi được đánh dấu lý do `role_changed`, lần refresh sau trả 401 `ROLE_CHANGED_RELOGIN`.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
            example: { role: citizen }
      responses:
        "200":
          description: Thông tin người dùng sau khi đổi vai trò
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: Tự đổi vai trò của mình, tài khoản đã xóa, hoặc đổi lên `lawyer`
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                len_luat_su:
                  summary: Đổi lên lawyer
                  value:
                    data: null
                    error:
                      code: LAWYER_ROLE_VIA_LAWYER_SERVICE
                      message: Không đổi trực tiếp sang luật sư. Hãy tạo tài khoản luật sư hoặc duyệt đơn xin làm luật sư.
                    request_id: req-123
                tu_doi:
                  summary: Tự đổi vai trò của mình
                  value:
                    data: null
                    error:
                      code: CANNOT_CHANGE_OWN_ROLE
                      message: Bạn không thể tự đổi vai trò của mình.
                    request_id: req-124
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/LawyerBadResponse" }
        "503": { $ref: "#/components/responses/LawyerUnavailable" }
        "504": { $ref: "#/components/responses/LawyerTimeout" }

  /users/{user_id}/lock:
    post:
      tags: [Admin]
      operationId: lockUser
      summary: Khóa tài khoản
      description: |
        Chỉ `admin`. Bắt buộc lý do; `duration_days` bỏ trống = khóa vĩnh viễn, có giá trị thì hết hạn tự mở.
        Thu hồi toàn bộ refresh token của người đó, nên họ không làm mới token được nữa; mọi API của
        User Service chặn ngay (403 `ACCOUNT_LOCKED`, message có thời hạn và lý do).
        Khóa luật sư thì các cuộc tư vấn đang mở bị kết thúc (Consultation Service).
        Không được tự khóa chính mình; tài khoản đã xóa → 409 `USER_DELETED`.
      x-status: implemented
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockUserRequest" }
            example: { reason: Đăng nội dung vi phạm nhiều lần, duration_days: 7 }
      responses:
        "200":
          description: Thông tin người dùng sau khi khóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: Tài khoản đã bị khóa từ trước, hoặc admin tự khóa chính mình
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                da_khoa:
                  summary: Đã khóa từ trước
                  value:
                    data: null
                    error:
                      code: USER_ALREADY_LOCKED
                      message: Tài khoản này đã bị khóa.
                    request_id: req-123
                tu_khoa:
                  summary: Tự khóa chính mình
                  value:
                    data: null
                    error:
                      code: CANNOT_LOCK_SELF
                      message: Bạn không thể tự khóa tài khoản của mình.
                    request_id: req-124
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{user_id}/unlock:
    post:
      tags: [Admin]
      operationId: unlockUser
