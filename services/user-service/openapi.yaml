  /internal/v1/users:
    post:
      tags: [Internal]
      operationId: createLawyerAccountInternal
      summary: Tạo tài khoản luật sư (Lawyer Service gọi)
      description: |
        Chỉ Lawyer Service gọi khi admin tạo tài khoản luật sư (`POST /lawyers/accounts`), kèm `X-Internal-Token`.
        Tạo tài khoản `local` đăng nhập bằng email + mật khẩu (email cũng là tên đăng nhập), vai trò `lawyer` ngay.
        `role` chỉ nhận `lawyer`. `created_by` = `sub` của admin trong JWT mà Lawyer Service đã kiểm tra.
        Lỗi trùng giống `POST /users`: 409 `EMAIL_IN_USE` / `EMAIL_DELETED` / `PHONE_IN_USE`.
        Không log mật khẩu.
      x-status: implemented
      servers:
        - url: http://user-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalCreateUserRequest" }
            example:
              email: luatsu.c@gmail.com
              password: matkhau123
              full_name: Lê Văn C
              role: lawyer
              created_by: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
      responses:
        "201":
          description: Tài khoản vừa tạo
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Email / số điện thoại đã được dùng
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: EMAIL_IN_USE
                  message: Email này đã được dùng cho một tài khoản khác.
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/v1/users/{user_id}:
    delete:
      tags: [Internal]
      operationId: hardDeleteUserInternal
      summary: Xóa cứng tài khoản vừa tạo (bù trừ khi Lawyer Service lưu hồ sơ lỗi)
      description: |
        Chỉ Lawyer Service gọi, kèm `X-Internal-Token`. Xóa hẳn dòng `users` (không xóa mềm, để email đăng ký
        lại được). Chỉ cho xóa tài khoản an toàn để xóa: do admin tạo (`created_by` khác null), chưa đăng nhập
        lần nào (không có refresh token) và chưa khai CCCD; không thì 409 `HARD_DELETE_NOT_ALLOWED`.
        Không tồn tại → 404 (Lawyer Service coi như đã xóa xong). Gọi lại an toàn.
      x-status: implemented
      servers:
        - url: http://user-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Đã xóa cứng, không có body
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: Tài khoản đã được dùng, không được xóa cứng
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: HARD_DELETE_NOT_ALLOWED
                  message: Tài khoản này đã được sử dụng nên không thể xóa hẳn.
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/v1/users/{user_id}/role:
    put:
      tags: [Internal]
      operationId: changeUserRoleInternal
      summary: Đổi vai trò sang luật sư khi duyệt đơn (Lawyer Service gọi)
      description: |
        Chỉ Lawyer Service gọi khi admin duyệt đơn xin làm luật sư, kèm `X-Internal-Token`.
        `role` chỉ nhận `lawyer`. Chỉ đổi từ `citizen`: tài khoản `admin` → 409 `ROLE_CHANGE_NOT_ALLOWED`;
        đã xóa mềm → 409 `USER_DELETED`; không tồn tại → 404. Đã là `lawyer` thì trả 200, không đổi gì
        (gọi lại an toàn khi Lawyer Service duyệt lại sau lỗi).
        Đổi thật thì thu hồi mọi refresh token với lý do `role_changed` → lần refresh sau trả
        401 `ROLE_CHANGED_RELOGIN`.
      x-status: implemented
      servers:
        - url: http://user-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalChangeRoleRequest" }
            example: { role: lawyer }
      responses:
        "200":
          description: Thông tin người dùng sau khi đổi vai trò
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: Tài khoản đã xóa hoặc là admin
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                da_xoa:
                  summary: Tài khoản đã xóa mềm
                  value:
                    data: null
                    error:
                      code: USER_DELETED
                      message: Tài khoản này đã bị xóa, hãy khôi phục trước khi thao tác.
                    request_id: req-123
                la_admin:
                  summary: Tài khoản admin
                  value:
                    data: null
                    error:
                      code: ROLE_CHANGE_NOT_ALLOWED
                      message: Không thể đổi vai trò của tài khoản này sang luật sư.
                    request_id: req-124
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/v1/users/{user_id}/citizen-profile:
    get:
      tags: [Internal]
      operationId: getCitizenProfileInternal
      summary: Lấy hồ sơ cá nhân của một người dùng (cho service khác)
      description: |
        Chỉ service khác gọi, kèm `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.
        Contract Service dùng để điền sẵn thông tin người dùng vào mẫu đơn, hợp đồng.
        Người dùng chưa khai hồ sơ thì `data` là `null`.
      x-status: implemented
      servers:
        - url: http://user-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Hồ sơ của người dùng, hoặc `data = null` nếu chưa khai
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/v1/users/{user_id}/status:
    get:
      tags: [Internal]
      operationId: getUserStatusInternal
      summary: Trạng thái tài khoản, có được tạo bộ hồ sơ không (cho service khác)
      description: |
        Chỉ service khác gọi, kèm `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.
        Contract Service gọi trước khi tạo bộ hồ sơ: lấy `user_id` từ `sub` trong JWT rồi gọi API này.
        `can_create_dossier = false` thì trả 403 cho FE, dùng `block_reason` làm mã lỗi và
        `block_message` làm câu thông báo.

        Luật hiện tại (gom ở User Service, Contract Service không phải tự kiểm tra lại):
        - Tài khoản đang bị khóa → `ACCOUNT_LOCKED` (ưu tiên báo trước). Khóa đã hết hạn thì tự mở.
        - Chưa khai hồ sơ CCCD → `PROFILE_NOT_SUBMITTED`.

        Chưa có chức năng admin duyệt hồ sơ, nên khai xong hồ sơ thì `profile_status` tạm là `approved`.
        Khi có chức năng duyệt sẽ thêm `pending` / `rejected`; các field khác giữ nguyên.
        Tài khoản đã xóa mềm trả 404 như không tồn tại.
      x-status: implemented
      servers:
        - url: http://user-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Trạng thái tài khoản
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
              examples:
                duoc_tao:
                  summary: Được tạo bộ hồ sơ
                  value:
                    data:
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      role: citizen
                      status: active
                      is_locked: false
                      locked_until: null
                      has_citizen_profile: true
                      profile_status: approved
                      can_create_dossier: true
                      block_reason: null
                      block_message: null
                    error: null
                    request_id: req-123
                chua_khai_ho_so:
                  summary: Chưa khai hồ sơ CCCD
                  value:
                    data:
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      role: citizen
                      status: active
                      is_locked: false
                      locked_until: null
                      has_citizen_profile: false
                      profile_status: not_submitted
                      can_create_dossier: false
                      block_reason: PROFILE_NOT_SUBMITTED
                      block_message: Bạn cần khai hồ sơ cá nhân (CCCD) trước khi tạo bộ hồ sơ.
                    error: null
                    request_id: req-123
                bi_khoa:
                  summary: Tài khoản đang bị khóa
                  value:
                    data:
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      role: citizen
                      status: locked
                      is_locked: true
                      locked_until: "2026-10-12T03:00:00Z"
                      has_citizen_profile: true
                      profile_status: approved
                      can_create_dossier: false
                      block_reason: ACCOUNT_LOCKED
                      block_message: "Tài khoản của bạn đã bị khóa đến 10:00 12/10/2026. Lý do: Spam. Vui lòng liên hệ quản trị viên nếu cần hỗ trợ."
                    error: null
                    request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`access_token` lấy từ `POST /users/auth/firebase`, `POST /users/auth/login` hoặc `POST /users/auth/refresh`."
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        HttpOnly cookie do BE set khi đăng nhập / refresh (dùng cho trình duyệt, FE gọi API với
        `credentials: "include"`). Chạy song song với BearerAuth: có header `Authorization` thì
        header được ưu tiên, không có mới đọc cookie.
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Giá trị `INTERNAL_TOKEN` trong `.env`, chỉ dùng cho `/internal/v1/...`.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: user_id
      in: path
      required: true
      description: ID người dùng (UUID)
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  responses:
    LawyerBadResponse:
      description: Lawyer Service trả lỗi 5xx hoặc dữ liệu sai cấu trúc khi ẩn hồ sơ luật sư
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_BAD_RESPONSE
              message: Hệ thống luật sư đang gặp lỗi, chưa thay đổi gì. Vui lòng thử lại sau.
            request_id: req-123
    LawyerUnavailable:
      description: Không kết nối được Lawyer Service khi ẩn hồ sơ luật sư
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_UNAVAILABLE
              message: Hệ thống luật sư tạm thời không phản hồi, chưa thay đổi gì. Vui lòng thử lại sau.
            request_id: req-123
    LawyerTimeout:
      description: Lawyer Service quá 5 giây khi ẩn hồ sơ luật sư
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_TIMEOUT
              message: Hệ thống luật sư phản hồi quá chậm, chưa thay đổi gì. Vui lòng thử lại sau.
            request_id: req-123
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: phone
                  message: Số điện thoại phải có 10 chữ số, bắt đầu bằng 0.
            request_id: req-123
    Unauthorized:
      description: Thiếu token, token sai hoặc đã hết hạn
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            thieu_token:
              summary: Thiếu hoặc sai token
              value:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: Bạn cần đăng nhập để tiếp tục.
                request_id: req-123
            het_han:
              summary: Token hết hạn (FE gọi /users/auth/refresh rồi thử lại)
              value:
                data: null
                error:
                  code: TOKEN_EXPIRED
                  message: Phiên đăng nhập đã hết hạn.
                request_id: req-124
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: FORBIDDEN
              message: Bạn không có quyền thực hiện thao tác này.
            request_id: req-123
    AccountLocked:
      description: Tài khoản đang bị khóa
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: ACCOUNT_LOCKED
              message: Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.
            request_id: req-123
    UserNotFound:
      description: Không có người dùng với ID này
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: USER_NOT_FOUND
              message: Không tìm thấy người dùng.
            request_id: req-123
    InternalError:
      description: Lỗi Backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, FE dùng để xử lý (xem API_GUIDELINES mục 5)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: phone }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          description: Luôn `null` khi lỗi
          nullable: true
          enum: [null]
        error: { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Người dùng ----------
    UserRole:
      type: string
      description: "Vai trò: `citizen` = người dân, `lawyer` = luật sư, `admin` = quản trị viên"
      enum: [citizen, lawyer, admin]

    UserStatus:
      type: string
      description: "Trạng thái: `active` = đang hoạt động, `locked` = bị khóa"
      enum: [active, locked]

    User:
      type: object
      required: [id, email, role, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, example: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e }
        email: { type: string, format: email, example: nguyenvana@gmail.com }
        username:
          type: string
          nullable: true
          description: Tên đăng nhập (chỉ có với tài khoản đăng nhập bằng mật khẩu)
          example: admin2026
        full_name: { type: string, nullable: true, example: Nguyễn Văn A }
        avatar_url: { type: string, format: uri, nullable: true }
        phone: { type: string, nullable: true, example: "0901234567" }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        locked_reason:
          type: string
          nullable: true
          description: Lý do khóa. Chỉ có khi `status` = `locked`.
        locked_at: { type: string, format: date-time, nullable: true }
        locked_until:
          type: string
          format: date-time
          nullable: true
          description: Hết thời điểm này thì tự mở khóa. `null` khi `status` = `locked` nghĩa là khóa vĩnh viễn.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminUser:
      description: Thông tin người dùng cho admin (thêm các trường quản trị)
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [has_citizen_profile]
          description: |
            Đã bỏ trường `created_as_lawyer` (cột bị xóa ở `007_lawyer_role.sql`; tài khoản admin tạo cho
            luật sư có vai trò `lawyer` ngay).
          properties:
            auth_provider: { type: string, nullable: true, example: local }
            locked_by: { type: string, format: uuid, nullable: true, description: Admin đã khóa }
            created_by: { type: string, format: uuid, nullable: true, description: Admin đã tạo (null = tự đăng ký) }
            deleted_at: { type: string, format: date-time, nullable: true, description: Khác null = đã xóa mềm }
            deleted_by: { type: string, format: uuid, nullable: true }
            has_citizen_profile: { type: boolean, description: Đã khai hồ sơ cá nhân (CCCD) chưa }

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: JWT dùng trong header `Authorization` }
        refresh_token: { type: string, description: Chuỗi ngẫu nhiên; server chỉ lưu bản hash }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Số giây còn lại của `access_token`
          example: 900

    AuthResult:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user, is_new_user]
          properties:
            user: { $ref: "#/components/schemas/User" }
            is_new_user:
              type: boolean
              description: "`true` nếu đây là lần đăng nhập đầu tiên (FE có thể mở màn hình bổ sung hồ sơ)"

    # ---------- Body gửi lên ----------
    PasswordLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 255, example: admin2026 }
        password: { type: string, minLength: 1, maxLength: 128, format: password }

    RegisterRequest:
      type: object
      required: [email, phone, password, confirm_password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 255, description: Cũng là tên đăng nhập (lưu chữ thường) }
        phone:
          type: string
          pattern: '^0\d{9}$'
          description: 10 chữ số bắt đầu bằng 0, không trùng tài khoản khác; dấu chấm, khoảng trắng, gạch ngang được bỏ đi trước khi kiểm tra
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        confirm_password: { type: string, maxLength: 128, format: password, description: Phải giống `password` }

    FirebaseLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
          description: Firebase ID token, FE lấy bằng `await user.getIdToken()` sau khi đăng nhập Firebase

    RefreshTokenRequest:
      type: object
      description: Không bắt buộc khi trình duyệt đã có HttpOnly cookie `refresh_token`.
      properties:
        refresh_token: { type: string, minLength: 1 }

    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        full_name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        phone:
          type: string
          nullable: true
          pattern: '^0\d{9}$'
          description: 10 chữ số, bắt đầu bằng 0. Gửi `null` để xóa.
        avatar_url: { type: string, format: uri, nullable: true, maxLength: 2000 }

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/UserRole" }

    LockUserRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: Lý do khóa, người bị khóa sẽ thấy câu này
        duration_days:
          type: integer
          minimum: 1
          maximum: 3650
          nullable: true
          description: Số ngày khóa. Bỏ trống hoặc `null` = khóa vĩnh viễn (đến khi admin mở).

    CreateUserRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 255, description: Cũng là tên đăng nhập (lưu chữ thường) }
        password: { type: string, minLength: 8, maxLength: 128, description: Mật khẩu do admin đặt }
        full_name: { type: string, maxLength: 255, nullable: true }
        phone:
          type: string
          nullable: true
          pattern: '^0\d{9}$'
          description: 10 chữ số bắt đầu bằng 0; dấu chấm, khoảng trắng, gạch ngang được bỏ đi trước khi kiểm tra
        account_type:
          type: string
          enum: [citizen, admin]
          default: citizen
          description: Tài khoản luật sư tạo qua Lawyer Service `POST /lawyers/accounts`

    InternalCreateUserRequest:
      type: object
      required: [email, password, full_name, role, created_by]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 255, description: Cũng là tên đăng nhập (lưu chữ thường) }
        password: { type: string, minLength: 8, maxLength: 128, description: Mật khẩu do admin đặt }
        full_name: { type: string, minLength: 1, maxLength: 255 }
        phone:
          type: string
          nullable: true
          pattern: '^0\d{9}$'
        role: { type: string, enum: [lawyer] }
        created_by: { type: string, format: uuid, description: Admin đã tạo (lấy từ JWT ở Lawyer Service) }

    InternalChangeRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [lawyer] }

    UserSummaryResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [total, by_role, by_status, deleted]
          properties:
            total: { type: integer, minimum: 0 }
            by_role:
              type: object
              properties:
                citizen: { type: integer }
                lawyer: { type: integer }
                admin: { type: integer }
            by_status:
              type: object
              properties:
                active: { type: integer }
                locked: { type: integer }
            deleted: { type: integer, minimum: 0 }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Kết quả từng API ----------
    AuthResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/AuthResult" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    TokenPairResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/TokenPair" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LogoutResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [logged_out]
          properties:
            logged_out: { type: boolean, example: true }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    UserResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/User" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    AdminUserResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/AdminUser" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    AdminUserListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminUser" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    UserListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/User" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    UserSearchRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }

    UserBrief:
      type: object
      required: [id, role, status]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }

    UserBriefListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/UserBrief" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    Address:
      type: object
      description: Địa chỉ theo mẫu đơn mới (2 cấp hành chính)
      required: [detail, ward, province]
      properties:
        detail: { type: string, description: "Số nhà, đường, thôn/xóm", example: Số 45 ngõ 120 Hoàng Hoa Thám }
        ward: { type: string, description: Xã/Phường/Đặc khu, example: Phường Ngọc Hà }
        province: { type: string, description: Tỉnh/Thành phố, example: Thành phố Hà Nội }

    CitizenProfileRequest:
      type: object
      description: |
        Các trường thông tin CCCD trùng tên với kết quả eKYC của Document Service
        (`id` của eKYC đổi thành `id_number`).
      required:
        - id_number
        - full_name
        - date_of_birth
        - gender
        - nationality
        - issue_date
        - issue_place
        - permanent_address
        - current_same_as_permanent
        - phone
        - source
        - declared
        - consented
      properties:
        id_number: { type: string, description: Số định danh cá nhân (12 số) }
        full_name: { type: string, description: "Họ và tên theo CCCD, ghi đè tên tài khoản" }
        date_of_birth: { type: string, format: date }
        gender: { type: string, description: Nam hoặc Nữ }
        nationality: { type: string, example: Việt Nam }
        place_of_origin: { type: string, nullable: true, description: Quê quán / nơi đăng ký khai sinh }
        place_of_residence: { type: string, nullable: true, description: Nơi thường trú đúng như in trên thẻ (tham khảo) }
        issue_date: { type: string, format: date }
        issue_place: { type: string }
        expiry_date: { type: string, format: date, nullable: true }
        permanent_address: { $ref: "#/components/schemas/Address" }
        current_same_as_permanent: { type: boolean, description: "true thì bỏ qua current_address" }
        current_address:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          nullable: true
        phone: { type: string, description: Lưu vào tài khoản (users.phone) }
        ethnicity: { type: string, nullable: true, description: "Dân tộc (CCCD không in, nhập tay)" }
        tax_code: { type: string, nullable: true, description: Mã số thuế cá nhân (nếu có) }
        source: { type: string, enum: [ekyc, manual] }
        ekyc_id:
          type: string
          format: uuid
          nullable: true
          description: Mã bản đọc eKYC do Document Service trả về (chỉ có khi source = ekyc)
        declared: { type: boolean, description: Người dùng cam đoan thông tin đúng sự thật (phải là true) }
        consented: { type: boolean, description: Người dùng đồng ý lưu và dùng thông tin cá nhân (phải là true) }

    CitizenProfile:
      type: object
      required:
        - user_id
        - id_number
        - full_name
        - date_of_birth
        - gender
        - nationality
        - issue_date
        - issue_place
        - permanent_address
        - current_same_as_permanent
        - email
        - source
        - declared_at
        - consented_at
        - updated_at
      properties:
        user_id: { type: string, format: uuid }
        id_number: { type: string }
        full_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string }
        nationality: { type: string }
        place_of_origin: { type: string, nullable: true }
        place_of_residence: { type: string, nullable: true }
        issue_date: { type: string, format: date }
        issue_place: { type: string }
        expiry_date: { type: string, format: date, nullable: true }
        permanent_address: { $ref: "#/components/schemas/Address" }
        current_same_as_permanent: { type: boolean }
        current_address:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          nullable: true
        phone: { type: string, nullable: true }
        email: { type: string, format: email, description: "Email đăng nhập, chỉ hiển thị" }
        ethnicity: { type: string, nullable: true }
        tax_code: { type: string, nullable: true }
        source: { type: string, enum: [ekyc, manual] }
        ekyc_id: { type: string, format: uuid, nullable: true }
        declared_at: { type: string, format: date-time }
        consented_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserStatusResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [user_id, role, status, is_locked, locked_until, has_citizen_profile, profile_status,
                     can_create_dossier, block_reason, block_message]
          properties:
            user_id: { type: string, format: uuid }
            role: { $ref: "#/components/schemas/UserRole" }
            status: { $ref: "#/components/schemas/UserStatus" }
            is_locked: { type: boolean, description: Đang bị khóa thật (khóa hết hạn thì đã tự mở) }
            locked_until:
              type: string
              format: date-time
              nullable: true
              description: Thời điểm hết khóa; `null` khi không khóa hoặc khóa vĩnh viễn
            has_citizen_profile: { type: boolean, description: Đã khai hồ sơ CCCD chưa }
            profile_status:
              type: string
              enum: [not_submitted, approved]
              description: Chưa có chức năng duyệt nên khai xong là `approved`; sau này thêm `pending`, `rejected`
            can_create_dossier: { type: boolean, description: Được tạo bộ hồ sơ (đơn từ) hay không }
            block_reason:
              type: string
              enum: [ACCOUNT_LOCKED, PROFILE_NOT_SUBMITTED]
              nullable: true
              description: Lý do không được tạo; `null` khi được phép
            block_message:
              type: string
              nullable: true
              description: Câu thông báo tiếng Việt để FE hiện cho người dùng
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    CitizenProfileResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          allOf: [{ $ref: "#/components/schemas/CitizenProfile" }]
          nullable: true
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }
