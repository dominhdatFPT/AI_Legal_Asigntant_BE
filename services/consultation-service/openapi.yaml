      responses:
        "200":
          description: Đã đồng ý
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermsResponse" }
              example:
                data: { version: "2026-11-01", accepted: true }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Dữ liệu sai hoặc không phải phiên bản hiện hành
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: Dữ liệu gửi lên không hợp lệ.
                  details:
                    - field: terms_version
                      message: Không phải phiên bản điều khoản hiện hành. Vui lòng tải lại trang.
                request_id: req-123
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Stats
  /consultations/stats:
    get:
      tags: [Stats]
      operationId: getMyConsultationStats
      summary: Thống kê tư vấn của tôi
      description: |
        Chỉ `lawyer`, số liệu của chính người gọi (lấy từ `sub` trong token).
        Lawyer Service gọi API này (chuyển tiếp JWT) để trả `GET /lawyers/me/stats`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Số liệu thống kê
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsResponse" }
              example:
                data:
                  accepted_count: 12
                  in_progress_count: 2
                  closed_count: 10
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Internal
  /internal/v1/consultations/close-by-user/{user_id}:
    post:
      tags: [Internal]
      operationId: closeConsultationsByUserInternal
      summary: Đóng cuộc tư vấn của một user (User Service gọi khi khóa, hạ quyền, xóa tài khoản)
      description: |
        Header `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.
        - `role_changed`: chỉ đóng các cuộc `in_progress` người đó là luật sư.
        - `locked`, `deleted`: đóng các cuộc `in_progress` ở cả hai vai trò (người tạo và luật sư), và xóa các yêu cầu
          `waiting` của người đó khỏi hàng chờ.

        Cuộc bị đóng có `close_reason` = `reason`, `closed_by = null`; không quay lại hàng chờ.
        Đẩy `consultation.closed` (bên còn lại nhận qua kênh `me`) và `consultation.removed` cho yêu cầu bị xóa.
        Gọi lại nhiều lần an toàn (idempotent): không còn gì để đóng thì `closed_count = 0`.
      x-status: planned
      servers:
        - url: http://consultation-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: user_id
          in: path
          required: true
          description: User ID (UUID) của người bị khóa, hạ quyền hoặc xóa
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseByUserRequest" }
            example: { reason: locked }
      responses:
        "200":
          description: Đã đóng (hoặc không có gì để đóng)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloseByUserResponse" }
              example:
                data: { closed_count: 2 }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`access_token` lấy từ User Service (`POST /users/auth/firebase` hoặc `POST /users/auth/refresh`)."
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Giá trị `INTERNAL_TOKEN` trong `.env` (so bằng `hmac.compare_digest`), chỉ dùng cho `/internal/v1/...`.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ConsultationId:
      name: consultation_id
      in: path
      required: true
      description: ID cuộc tư vấn (UUID)
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  examples:
    Forbidden:
      summary: Sai vai trò
      value:
        data: null
        error:
          code: FORBIDDEN
          message: Bạn không có quyền thực hiện thao tác này.
        request_id: req-123
    TermsNotAccepted:
      summary: Chưa đồng ý điều khoản hiện hành
      value:
        data: null
        error:
          code: TERMS_NOT_ACCEPTED
          message: Bạn cần đồng ý điều khoản tư vấn trước khi tiếp tục.
        request_id: req-124
    LawyerNotApproved:
      summary: Không phải luật sư được hành nghề
      value:
        data: null
        error:
          code: LAWYER_NOT_APPROVED
          message: Hồ sơ luật sư của bạn chưa được duyệt.
        request_id: req-123
    AccountLocked:
      summary: Tài khoản bị khóa
      value:
        data: null
        error:
          code: ACCOUNT_LOCKED
          message: Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.
        request_id: req-125
    LawyerCapacityReached:
      summary: Luật sư đã có 3 cuộc đang mở
      value:
        data: null
        error:
          code: LAWYER_CAPACITY_REACHED
          message: Luật sư đang tư vấn tối đa 3 cuộc cùng lúc. Vui lòng thử lại sau.
        request_id: req-126
    ConsultationAlreadyOpen:
      summary: Hai bên đang có cuộc tư vấn mở
      value:
        data: null
        error:
          code: CONSULTATION_ALREADY_OPEN
          message: Hai bên đang có một cuộc tư vấn chưa đóng.
        request_id: req-127
    ConsultationNotFound:
      summary: Không tìm thấy cuộc tư vấn
      value:
        data: null
        error:
          code: CONSULTATION_NOT_FOUND
          message: Không tìm thấy cuộc tư vấn.
        request_id: req-123

  responses:
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: question
                  message: Phải có 1–2000 ký tự, không chỉ chứa khoảng trắng.
            request_id: req-123
    Unauthorized:
      description: Thiếu token, token sai hoặc đã hết hạn (API nội bộ - sai `X-Internal-Token`)
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: UNAUTHORIZED
              message: Bạn cần đăng nhập để tiếp tục.
            request_id: req-123
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: FORBIDDEN
              message: Bạn không có quyền thực hiện thao tác này.
            request_id: req-123
    AccountLocked:
      description: Tài khoản đang bị khóa
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: ACCOUNT_LOCKED
              message: Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.
            request_id: req-123
    NotApprovedLawyer:
      description: Chỉ vai trò `lawyer` có `can_practice = true` ở Lawyer Service và không bị khóa mới dùng được
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            chua_duyet: { $ref: "#/components/examples/LawyerNotApproved" }
            bi_khoa: { $ref: "#/components/examples/AccountLocked" }
    ConsultationNotFound:
      description: Không có cuộc tư vấn với ID này, hoặc bạn không có quyền xem
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: CONSULTATION_NOT_FOUND
              message: Không tìm thấy cuộc tư vấn.
            request_id: req-123
    InvalidStatus:
      description: Trạng thái cuộc tư vấn không cho phép thao tác này
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: CONSULTATION_INVALID_STATUS
              message: Cuộc tư vấn đang ở trạng thái không thực hiện được thao tác này.
            request_id: req-123
    ServiceBadResponse:
      description: Service phụ trả lỗi 5xx hoặc dữ liệu sai cấu trúc
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            user:
              summary: User Service trả lỗi
              value:
                data: null
                error:
                  code: USER_BAD_RESPONSE
                  message: Hệ thống tài khoản đang gặp lỗi, vui lòng thử lại sau.
                request_id: req-123
            lawyer:
              summary: Lawyer Service trả lỗi
              value:
                data: null
                error:
                  code: LAWYER_BAD_RESPONSE
                  message: Không kiểm tra được thông tin luật sư, vui lòng thử lại sau.
                request_id: req-124
            agent:
              summary: Agent Service trả lỗi (chỉ API tóm tắt)
              value:
                data: null
                error:
                  code: AGENT_BAD_RESPONSE
                  message: Không tạo được bản tóm tắt, vui lòng thử lại sau.
                request_id: req-125
    ServiceUnavailable:
      description: Không kết nối được service phụ (User, Lawyer, hoặc Agent với API tóm tắt)
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_UNAVAILABLE
              message: Hệ thống luật sư tạm thời không phản hồi, vui lòng thử lại sau.
            request_id: req-123
    ServiceTimeout:
      description: Service phụ quá thời gian chờ (5 giây; Agent tạo tóm tắt 60 giây)
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_TIMEOUT
              message: Hệ thống luật sư phản hồi quá chậm, vui lòng thử lại sau.
            request_id: req-123
    InternalError:
      description: Lỗi Backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, FE dùng để xử lý (xem API_GUIDELINES mục 5)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: question }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          description: Luôn `null` khi lỗi
          nullable: true
          enum: [null]
        error: { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Cuộc tư vấn ----------
    ConsultationSource:
      type: string
      description: "`lobby` = gửi vào hàng chờ, `direct` = nhắn lại luật sư cũ (mở ngay, không qua hàng chờ)"
      enum: [lobby, direct]

    ConsultationStatus:
      type: string
      description: "`waiting` = chờ luật sư nhận, `in_progress` = đang tư vấn, `closed` = đã đóng (lý do ở `close_reason`)"
      enum: [waiting, in_progress, closed]

    CloseReason:
      type: string
      description: |
        `completed` = đóng khi tư vấn xong, `cancelled` = luật sư hủy, `locked` = tài khoản bị khóa,
        `role_changed` = luật sư bị hạ quyền, `deleted` = tài khoản bị xóa, `expired` = quá 10 ngày không có tin nhắn
      enum: [completed, cancelled, locked, role_changed, deleted, expired]

    Consultation:
      type: object
      required: [id, citizen_id, question, source, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        citizen_id:
          type: string
          format: uuid
          description: User ID người tạo (vai trò `citizen` hoặc `lawyer`)
        lawyer_id:
          type: string
          format: uuid
          nullable: true
          description: User ID của luật sư đã nhận; `null` khi còn `waiting`
        question: { type: string }
        source: { $ref: "#/components/schemas/ConsultationSource" }
        agent_session_id:
          type: string
          format: uuid
          nullable: true
          description: "`conversations.id` của Agent Service khi đi từ chatbox AI"
        status: { $ref: "#/components/schemas/ConsultationStatus" }
        close_reason:
          allOf:
            - $ref: "#/components/schemas/CloseReason"
          nullable: true
          description: Chỉ có khi `status` = `closed`
        accepted_at: { type: string, format: date-time, nullable: true }
        closed_by:
          type: string
          format: uuid
          nullable: true
          description: Người đóng; `null` khi hệ thống tự đóng
        closed_at: { type: string, format: date-time, nullable: true }
        last_message:
          allOf:
            - $ref: "#/components/schemas/Message"
          nullable: true
          description: Tin gần nhất, để hiện ở danh sách
        unread_count:
          type: integer
          minimum: 0
          description: Số tin người đang xem chưa đọc
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PreviousLawyer:
      type: object
      required: [lawyer_id, last_consultation_id, last_closed_at]
      properties:
        lawyer_id: { type: string, format: uuid, description: User ID của luật sư }
        last_consultation_id: { type: string, format: uuid }
        last_closed_at: { type: string, format: date-time }

    Message:
      type: object
      required: [id, consultation_id, sender_id, content, is_read, created_at]
      properties:
        id: { type: string, format: uuid }
        consultation_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        content: { type: string }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }

    # ---------- Báo cáo ----------
    ReportStatus:
      type: string
      description: "`pending` = chờ xử lý, `resolved` = báo cáo đúng, `dismissed` = bỏ qua"
      enum: [pending, resolved, dismissed]

    Report:
      type: object
      required: [id, consultation_id, reporter_id, reported_id, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        consultation_id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        reported_id:
          type: string
          format: uuid
          description: Người bị báo cáo, server suy ra là bên còn lại của cuộc tư vấn
        reason: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        handled_by: { type: string, format: uuid, nullable: true }
        handled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Stats:
      type: object
      required: [accepted_count, in_progress_count, closed_count]
      properties:
        accepted_count: { type: integer, minimum: 0, description: Tổng số yêu cầu đã nhận }
        in_progress_count: { type: integer, minimum: 0, description: Số cuộc đang tư vấn }
        closed_count: { type: integer, minimum: 0, description: Số cuộc đã đóng }

    # ---------- Body gửi lên ----------
    CreateConsultationRequest:
      type: object
      required: [question, source]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
        source: { $ref: "#/components/schemas/ConsultationSource" }
        agent_session_id:
          type: string
          format: uuid
          description: Tùy chọn. `conversations.id` của Agent Service, dùng để tạo bản tóm tắt cho luật sư.
        lawyer_id:
          type: string
          format: uuid
          description: User ID của luật sư cũ. Bắt buộc khi `source` = `direct`, bỏ qua khi `lobby`.

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          pattern: '\S'

    CreateReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: Lý do báo cáo

    ResolveReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, dismissed]

    AcceptTermsRequest:
      type: object
      required: [terms_version]
      properties:
        terms_version:
          type: string
          minLength: 1
          maxLength: 20
          description: Phải đúng `version` trả về từ `GET /consultations/terms`

    CloseByUserRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [locked, role_changed, deleted]

    # ---------- Kết quả từng API ----------
    ConsultationResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/Consultation" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ConsultationListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Consultation" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    PreviousLawyerListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PreviousLawyer" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    SummaryResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [consultation_id, ai_summary]
          properties:
