openapi: 3.0.3

info:
  title: Consultation Service API
  version: 0.2.0
  description: |
    API hàng chờ tư vấn, chat 1-1 giữa người dùng với luật sư, report và đồng ý điều khoản.
    Thiết kế, sơ đồ trạng thái và job dọn dữ liệu: `docs/api/CONSULTATION_DESIGN.md`.
  x-owner: "Người 1 · Đạt"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://consultation-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

# OpenAPI 3.0 không mô tả được WebSocket; phần này ghi lại quy ước ở API_GUIDELINES mục 10.
x-websocket:
  x-status: planned
  url: ws://localhost:8080/ws/consultations/{channel}
  channels:
    lobby: Hàng chờ, chỉ luật sư được hành nghề (`can_practice`). Nhận yêu cầu mới, yêu cầu vừa có người nhận và yêu cầu bị xóa.
    me: Mọi user đã đăng nhập. Nhận sự kiện của các cuộc tư vấn của mình để hiện chấm đỏ.
    "{consultation_id}": Box chat riêng, chỉ người tạo và luật sư của cuộc tư vấn.
  auth: 'Tin đầu tiên sau khi kết nối: {"type": "auth", "data": {"token": "<JWT>"}}. Quá 5 giây không gửi thì server đóng kết nối.'
  receive_only: WebSocket chỉ để nhận. Gửi tin nhắn bằng REST `POST /consultations/{consultation_id}/messages`.
  events:
    consultation.created: "Kênh lobby. data: Consultation"
    consultation.accepted: "Kênh lobby (chỉ khi `source` = `lobby`), kênh của cuộc tư vấn và kênh me của hai bên. data: {consultation_id, lawyer_id}"
    consultation.removed: "Kênh lobby. Yêu cầu waiting bị xóa (hết hạn, yêu cầu khác của user được nhận, tài khoản bị khóa/xóa). data: {consultation_ids}"
    consultation.closed: "Kênh của cuộc tư vấn và kênh me của hai bên. data: Consultation (có `close_reason`)"
    message.created: "Kênh của cuộc tư vấn và kênh me của người nhận. data: Message"
    error: "data: {code, message}"
  close_codes:
    "4401": Chưa xác thực hoặc token sai
    "4403": Không có quyền vào kênh
    "4404": Không tìm thấy cuộc tư vấn
  reconnect: FE tự kết nối lại (chờ 1, 2, 4… tối đa 30 giây), rồi gọi `GET /consultations/{consultation_id}/messages?after=<id tin cuối>` lấy tin bị lỡ.

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Consultations
    description: Tạo, xem, đóng, hủy cuộc tư vấn; nhắn lại luật sư cũ; tóm tắt AI
  - name: Lobby
    description: Hàng chờ của luật sư, nhận yêu cầu
  - name: Messages
    description: Tin nhắn trong cuộc tư vấn
  - name: Reports
    description: Báo cáo vi phạm và xử lý của admin
  - name: Terms
    description: Điều khoản sử dụng tính năng chat với luật sư
  - name: Stats
    description: Thống kê cho luật sư
  - name: Internal
    description: |
      Chỉ service khác gọi trong mạng Docker, header `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.

# Khi code: các đường dẫn cố định (/consultations/lobby, /reports, /stats, /terms, /terms/accept, /previous-lawyers)
# phải đăng ký trước /consultations/{consultation_id}. Riêng POST /consultations/terms/accept phải đăng ký trước
# POST /consultations/{consultation_id}/accept vì cùng số đoạn đường dẫn.
paths:
  /consultations/health:
    get:
      tags: [Health]
      operationId: getConsultationHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: consultation-service }

  # ---------------------------------------------------------------- Consultations
  /consultations:
    post:
      tags: [Consultations]
      operationId: createConsultation
      summary: Tạo yêu cầu tư vấn hoặc nhắn lại luật sư cũ
      description: |
        Vai trò `citizen` và `lawyer` (luật sư được dùng tính năng của người dân). `admin` nhận 403.
        Phải đã đồng ý điều khoản phiên bản hiện hành (`GET /consultations/terms`), nếu chưa thì 403 `TERMS_NOT_ACCEPTED`.
        `agent_session_id` là `conversations.id` của Agent Service, tùy chọn.

        - `lobby`: tạo cuộc `waiting` trong hàng chờ, mọi luật sư được hành nghề đều thấy.
          Mỗi user tối đa 10 yêu cầu `waiting` chưa hết hạn; đủ 10 thì 409 `WAITING_LIMIT_REACHED`.
          Đang có cuộc chat riêng vẫn tạo được. Tạo xong đẩy `consultation.created` lên kênh lobby.
        - `direct`: nhắn lại luật sư cũ, bắt buộc `lawyer_id`. Tạo cuộc `in_progress` ngay, không qua hàng chờ,
          tính vào giới hạn 3 cuộc của luật sư. Điều kiện:
          - đã có cuộc trước giữa user và luật sư đó kết thúc bằng `close_reason` = `completed`;
          - luật sư còn hoạt động: User Service `GET /internal/v1/users/{user_id}/status` (vai trò `lawyer`, không bị khóa,
            404 = đã xóa) và Lawyer Service `GET /internal/v1/lawyers/{user_id}/status` (`can_practice`), kèm `X-Internal-Token`.

          Không thỏa thì 422 `DIRECT_NOT_ALLOWED`. Hai bên đang có cuộc mở thì 409 `CONSULTATION_ALREADY_OPEN`;
          luật sư đủ 3 cuộc thì 409 `LAWYER_CAPACITY_REACHED`. Tạo xong đẩy `consultation.accepted`.

        Kiểm tra giới hạn và tạo dòng trong một transaction, khóa theo cách ở `docs/api/CONSULTATION_DESIGN.md` mục 5.
        Có `agent_session_id` thì sau khi commit chạy nền việc tạo tóm tắt AI (xem `GET /consultations/{consultation_id}/summary`);
        user không phải chờ, tạo tóm tắt lỗi cũng không làm hỏng yêu cầu.
        Không tự retry API này (API_GUIDELINES mục 8).
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsultationRequest" }
            examples:
              hang_cho:
                summary: Gửi câu hỏi vào hàng chờ (đi từ chatbox AI)
                value:
                  question: Tôi mua đất bằng giấy viết tay năm 2010, giờ làm sổ được không?
                  source: lobby
                  agent_session_id: 6f1d2c3b-4a5e-4f60-9b7c-8d9e0f1a2b3c
              nhan_lai:
                summary: Nhắn lại luật sư cũ
                value:
                  question: Tôi muốn hỏi thêm về việc làm sổ hôm trước.
                  source: direct
                  lawyer_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
      responses:
        "201":
          description: Đã tạo. `lobby` ở `waiting`, `direct` ở `in_progress`.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationResponse" }
              examples:
                hang_cho:
                  summary: Yêu cầu đang chờ
                  value:
                    data:
                      id: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                      citizen_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      lawyer_id: null
                      question: Tôi mua đất bằng giấy viết tay năm 2010, giờ làm sổ được không?
                      source: lobby
                      agent_session_id: 6f1d2c3b-4a5e-4f60-9b7c-8d9e0f1a2b3c
                      status: waiting
                      close_reason: null
                      accepted_at: null
                      closed_by: null
                      closed_at: null
                      last_message: null
                      unread_count: 0
                      created_at: "2026-10-05T09:00:00Z"
                      updated_at: "2026-10-05T09:00:00Z"
                    error: null
                    request_id: req-123
                nhan_lai:
                  summary: Nhắn lại luật sư cũ, mở ngay
                  value:
                    data:
                      id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                      citizen_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      lawyer_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      question: Tôi muốn hỏi thêm về việc làm sổ hôm trước.
                      source: direct
                      agent_session_id: null
                      status: in_progress
                      close_reason: null
                      accepted_at: "2026-10-20T09:00:00Z"
                      closed_by: null
                      closed_at: null
                      last_message: null
                      unread_count: 0
                      created_at: "2026-10-20T09:00:00Z"
                      updated_at: "2026-10-20T09:00:00Z"
                    error: null
                    request_id: req-124
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Sai vai trò hoặc chưa đồng ý điều khoản hiện hành
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                sai_vai_tro: { $ref: "#/components/examples/Forbidden" }
                chua_dong_y: { $ref: "#/components/examples/TermsNotAccepted" }
        "409":
          description: Vượt giới hạn hoặc hai bên đang có cuộc mở
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                du_10_yeu_cau:
                  summary: Đã có 10 yêu cầu đang chờ
                  value:
                    data: null
                    error:
                      code: WAITING_LIMIT_REACHED
                      message: Bạn đã có 10 yêu cầu đang chờ luật sư nhận. Vui lòng chờ trước khi gửi thêm.
                    request_id: req-123
                luat_su_du_3_cuoc: { $ref: "#/components/examples/LawyerCapacityReached" }
                dang_co_cuoc_mo: { $ref: "#/components/examples/ConsultationAlreadyOpen" }
        "422":
          description: Dữ liệu sai, hoặc không được nhắn lại luật sư này
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                du_lieu_sai:
                  summary: Thiếu `lawyer_id` khi `source` = `direct`
                  value:
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: Dữ liệu gửi lên không hợp lệ.
                      details:
                        - field: lawyer_id
                          message: Bắt buộc khi source là direct.
                    request_id: req-123
                khong_duoc_nhan_lai:
                  summary: Chưa có cuộc hoàn thành với luật sư này, hoặc luật sư không còn hoạt động
                  value:
                    data: null
                    error:
                      code: DIRECT_NOT_ALLOWED
                      message: Bạn chỉ nhắn lại được luật sư đã tư vấn xong cho bạn và vẫn còn hoạt động.
                    request_id: req-124
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }
    get:
      tags: [Consultations]
      operationId: listMyConsultations
      summary: Danh sách cuộc tư vấn của tôi
      description: |
        `citizen` thấy cuộc mình tạo. `lawyer` thấy cuộc mình nhận và cả cuộc mình tạo (luật sư cũng dùng được tính
        năng của người dân). `admin` nhận 403.
        Không trả cuộc đã xóa nội dung (`purged_at` có giá trị). Sắp xếp theo `updated_at` giảm dần (mới hoạt động nhất lên trước).
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: status
          in: query
          description: Lọc theo trạng thái. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/ConsultationStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /consultations/previous-lawyers:
    get:
      tags: [Consultations]
      operationId: listPreviousLawyers
      summary: Luật sư cũ có thể nhắn lại
      description: |
        Vai trò `citizen` và `lawyer`; `admin` nhận 403. Trả các luật sư người gọi được nhắn lại bằng
        `POST /consultations` với `source` = `direct`:
        - đã có cuộc với người gọi kết thúc bằng `close_reason` = `completed` (tính cả cuộc đã xóa nội dung);
        - luật sư còn hoạt động (kiểm tra như `POST /consultations`);
        - hai bên chưa có cuộc `in_progress`.

        Mỗi luật sư một dòng, `last_consultation_id` và `last_closed_at` là cuộc `completed` gần nhất.
        Sắp xếp theo `last_closed_at` giảm dần. Không phân trang vì mỗi user chỉ có ít luật sư cũ.
        Tên, ảnh luật sư FE lấy từ Lawyer Service.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Danh sách (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviousLawyerListResponse" }
              example:
                data:
                  items:
                    - lawyer_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      last_consultation_id: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                      last_closed_at: "2026-10-06T10:00:00Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /consultations/{consultation_id}:
    get:
      tags: [Consultations]
      operationId: getConsultation
      summary: Chi tiết cuộc tư vấn
      description: |
        Chỉ người tạo và luật sư của cuộc tư vấn xem được. Riêng cuộc `waiting` thì luật sư được hành nghề
        (`can_practice`, kiểm tra như `GET /consultations/lobby`) cũng xem được.
        `admin`, người khác và cuộc đã xóa nội dung (`purged_at` có giá trị) nhận 404.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      responses:
        "200":
          description: Thông tin cuộc tư vấn
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /consultations/{consultation_id}/cancel:
    post:
      tags: [Consultations]
      operationId: cancelConsultation
      summary: Luật sư hủy cuộc chat
      description: |
        Chỉ luật sư của cuộc tư vấn, chỉ khi `in_progress`. Chuyển sang `closed` với `close_reason` = `cancelled`,
        `closed_by` = người gọi. Người tạo gọi API này nhận 403; người ngoài cuộc nhận 404.
        Cập nhật có điều kiện `WHERE status = 'in_progress'`. Đẩy `consultation.closed`.
        User không hủy được yêu cầu đang chờ; yêu cầu `waiting` tự hết hạn sau 10 ngày.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      responses:
        "200":
          description: Cuộc tư vấn sau khi hủy
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /consultations/{consultation_id}/close:
    post:
      tags: [Consultations]
      operationId: closeConsultation
      summary: Đóng cuộc tư vấn
      description: |
        Người tạo hoặc luật sư của cuộc tư vấn đóng khi tư vấn xong; chỉ đóng được khi `in_progress`.
        Chuyển sang `closed` với `close_reason` = `completed`, `closed_by` = người gọi.
        Đóng rồi vẫn xem được lịch sử (đến khi bị xóa nội dung) nhưng không nhắn thêm được. Đẩy `consultation.closed`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      responses:
        "200":
          description: Cuộc tư vấn sau khi đóng
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /consultations/{consultation_id}/summary:
    get:
      tags: [Consultations]
      operationId: getConsultationSummary
      summary: Tóm tắt AI của cuộc chat với chatbox
      description: |
        Chỉ luật sư của cuộc tư vấn, hoặc luật sư được hành nghề khi cuộc còn `waiting`. Người khác và cuộc đã xóa
        nội dung nhận 404. Luật sư không xem được lịch sử chat với AI, chỉ xem bản tóm tắt; không cần user cho phép
        (điều khoản đã nói rõ).

        Tóm tắt được tạo nền ngay sau khi gửi yêu cầu, chỉ gồm các tin chat AI trước `until` = `created_at` của yêu cầu.
        Đã lưu thì trả bản đã lưu. Chưa có (đang tạo hoặc lần tạo nền bị lỗi) thì gọi Agent tạo lại với cùng `until`,
        lưu bằng `UPDATE ... WHERE ai_summary IS NULL AND purged_at IS NULL` rồi trả bản đang có trong database.
        User xóa hội thoại AI sau khi gửi không thu hồi bản đã lưu; bản này chỉ bị xóa khi job dọn sau 10 ngày.
        `agent_session_id` rỗng, hoặc chưa có bản lưu mà Agent báo không còn hội thoại, thì 404 `SUMMARY_NOT_AVAILABLE`.

        **Phụ thuộc:** Agent Service chưa có API tóm tắt. API này nhận `user_id` (người tạo yêu cầu) để Agent kiểm tra
        hội thoại đúng của người đó, và `until` để chỉ tóm tắt tin trước mốc này; không đúng chủ thì Agent trả 404.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      responses:
        "200":
          description: Bản tóm tắt
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryResponse" }
              example:
                data:
                  consultation_id: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                  ai_summary: Người dùng mua đất bằng giấy viết tay năm 2010, hỏi điều kiện cấp sổ lần đầu.
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Không tìm thấy cuộc tư vấn, hoặc cuộc không đi từ chatbox AI
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                khong_thay: { $ref: "#/components/examples/ConsultationNotFound" }
                khong_co_tom_tat:
                  summary: Không có `agent_session_id`
                  value:
                    data: null
                    error:
                      code: SUMMARY_NOT_AVAILABLE
                      message: Yêu cầu này không có cuộc trò chuyện với AI để tóm tắt.
                    request_id: req-124
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  # ---------------------------------------------------------------- Lobby
  /consultations/lobby:
    get:
      tags: [Lobby]
      operationId: getLobby
      summary: Hàng chờ của luật sư
      description: |
        Chỉ vai trò `lawyer` được hành nghề. Consultation Service gọi Lawyer Service
        `GET /internal/v1/lawyers/{user_id}/status` kèm `X-Internal-Token`, cần `can_practice = true`.
        Không lọc theo lĩnh vực, không kiểm tra Online.

        Trả mọi cuộc `waiting` chưa hết hạn (`created_at` trong 10 ngày), trừ yêu cầu của chính luật sư.
        Sắp xếp theo `created_at` tăng dần (cũ nhất lên trước). Thay đổi đến qua WebSocket kênh `lobby`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách đang chờ (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotApprovedLawyer" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /consultations/{consultation_id}/accept:
    post:
      tags: [Lobby]
      operationId: acceptConsultation
      summary: Luật sư nhận yêu cầu
      description: |
        Chỉ vai trò `lawyer` được hành nghề (kiểm tra như `GET /consultations/lobby`), tài khoản còn hoạt động
        (User Service `GET /users/me`, chuyển tiếp JWT) và đã đồng ý điều khoản hiện hành.
        Không nhận được yêu cầu của chính mình (409 `CANNOT_ACCEPT_OWN_CONSULTATION`).
        Yêu cầu không tồn tại, đã bị xóa hoặc đã hết hạn trả 404.

        Các bước trong một transaction:
        1. `pg_advisory_xact_lock` theo citizen, rồi theo luật sư, luôn đúng thứ tự này.
        2. Kiểm tra luật sư có dưới 3 cuộc `in_progress` (409 `LAWYER_CAPACITY_REACHED`) và hai bên chưa có cuộc
           `in_progress` (409 `CONSULTATION_ALREADY_OPEN`).
        3. `UPDATE ... SET status = 'in_progress', lawyer_user_id = ?, accepted_at = now(), last_activity_at = now()
           WHERE id = ? AND status = 'waiting'`. Không có dòng nào đổi thì 409 `CONSULTATION_ALREADY_ACCEPTED`.
        4. Xóa các yêu cầu `waiting` khác của citizen.
        5. Sau khi commit, đẩy `consultation.accepted` và `consultation.removed`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      responses:
        "200":
          description: Đã nhận, cuộc tư vấn chuyển sang `in_progress`
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Không phải luật sư được hành nghề, tài khoản bị khóa, hoặc chưa đồng ý điều khoản
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                chua_duyet: { $ref: "#/components/examples/LawyerNotApproved" }
                bi_khoa: { $ref: "#/components/examples/AccountLocked" }
                chua_dong_y: { $ref: "#/components/examples/TermsNotAccepted" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "409":
          description: Không nhận được yêu cầu này
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                da_co_nguoi_nhan:
                  summary: Luật sư khác đã nhận
                  value:
                    data: null
                    error:
                      code: CONSULTATION_ALREADY_ACCEPTED
                      message: Yêu cầu này đã có luật sư khác nhận.
                    request_id: req-123
                du_3_cuoc: { $ref: "#/components/examples/LawyerCapacityReached" }
                yeu_cau_cua_minh:
                  summary: Yêu cầu do chính luật sư tạo
                  value:
                    data: null
                    error:
                      code: CANNOT_ACCEPT_OWN_CONSULTATION
                      message: Bạn không thể nhận yêu cầu của chính mình.
                    request_id: req-125
                dang_co_cuoc_mo: { $ref: "#/components/examples/ConsultationAlreadyOpen" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  # ---------------------------------------------------------------- Messages
  /consultations/{consultation_id}/messages:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Lịch sử tin nhắn
      description: |
        Chỉ người tạo và luật sư của cuộc tư vấn; cuộc đã xóa nội dung trả 404. Sắp xếp theo `created_at` tăng dần.
        - Mở box chat: không truyền `after`/`before`, nhận `limit` tin mới nhất.
        - Cuộn lên xem tin cũ: `before=<id tin cũ nhất đang có>`.
        - Kết nối lại WebSocket: `after=<id tin cuối>` để lấy tin bị lỡ.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
        - name: after
          in: query
          description: Chỉ lấy tin gửi sau tin có ID này.
          schema: { type: string, format: uuid }
        - name: before
          in: query
          description: Chỉ lấy tin gửi trước tin có ID này. Không dùng chung với `after`.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          description: Số tin tối đa mỗi lần.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Danh sách tin nhắn
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageListResponse" }
              example:
                data:
                  items:
                    - id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
                      consultation_id: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                      sender_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      content: Chào luật sư, tôi cần hỏi về giấy viết tay.
                      is_read: false
                      created_at: "2026-10-05T09:05:00Z"
                  has_more: false
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Gửi tin nhắn
      description: |
        Chỉ người tạo và luật sư của cuộc tư vấn, chỉ gửi được khi `in_progress`.
        Luật sư gửi tin thì kiểm tra thêm qua User Service `GET /users/me` (chuyển tiếp JWT) để
        luật sư bị khóa mất quyền ngay. Lưu tin và cập nhật `last_activity_at` của cuộc tư vấn trong cùng transaction.
        Lưu xong đẩy `message.created` lên kênh của cuộc tư vấn và kênh `me` của người nhận.
        Không tự retry API này (API_GUIDELINES mục 8).
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
            example: { content: "Chào luật sư, tôi cần hỏi về giấy viết tay." }
      responses:
        "201":
          description: Tin nhắn đã lưu
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountLocked" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /consultations/{consultation_id}/read:
    post:
      tags: [Messages]
      operationId: markConsultationRead
      summary: Đánh dấu đã đọc
      description: |
        Người tạo hoặc luật sư của cuộc tư vấn đánh dấu đã đọc mọi tin của bên kia (`is_read = true` cho tin có
        `sender_id` khác người gọi). Dùng được khi `in_progress` hoặc `closed` chưa xóa nội dung; người khác và cuộc
        đã xóa nội dung nhận 404. Gọi lại nhiều lần vẫn trả 200.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      responses:
        "200":
          description: Đã đánh dấu
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadResponse" }
              example:
                data: { consultation_id: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e, unread_count: 0 }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Reports
  /consultations/{consultation_id}/reports:
    post:
      tags: [Reports]
      operationId: reportConsultation
      summary: Báo cáo vi phạm
      description: |
        Người report là người tạo hoặc luật sư của cuộc tư vấn; `reported_id` do server suy ra là người còn lại.
        Chấp nhận cuộc `in_progress` hoặc `closed` chưa xóa nội dung. Cuộc `waiting` trả 409; người ngoài cuộc và
        cuộc đã xóa nội dung trả 404. Admin xử lý ở `GET /consultations/reports`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConsultationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
            example: { reason: Luật sư dùng lời lẽ xúc phạm. }
      responses:
        "201":
          description: Đã gửi báo cáo
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ConsultationNotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /consultations/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: Danh sách báo cáo vi phạm
      description: |
        Chỉ `admin`. Chỉ trả thông tin của `Report` (ai report ai, lý do, trạng thái), không trả câu hỏi hay tin nhắn.
        Sắp xếp theo `created_at` tăng dần (cũ nhất lên trước).
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: status
          in: query
          description: Lọc theo trạng thái báo cáo. Mặc định `pending`.
          schema:
            allOf:
              - $ref: "#/components/schemas/ReportStatus"
            default: pending
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách báo cáo (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /consultations/reports/{report_id}/resolve:
    post:
      tags: [Reports]
      operationId: resolveReport
      summary: Xử lý báo cáo
      description: |
        Chỉ `admin`, chỉ xử lý được báo cáo `pending`.
        `resolved` = báo cáo đúng (admin tự khóa tài khoản ở User Service nếu cần);
        `dismissed` = bỏ qua báo cáo.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: report_id
          in: path
          required: true
          description: ID báo cáo (UUID)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveReportRequest" }
            example: { status: resolved }
      responses:
        "200":
          description: Báo cáo sau khi xử lý
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không có báo cáo với ID này
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: REPORT_NOT_FOUND
                  message: Không tìm thấy báo cáo.
                request_id: req-123
        "409":
          description: Báo cáo đã được xử lý trước đó
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: REPORT_ALREADY_HANDLED
                  message: Báo cáo này đã được xử lý.
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Terms
  /consultations/terms:
    get:
      tags: [Terms]
      operationId: getConsultationTerms
      summary: Phiên bản điều khoản và tôi đã đồng ý chưa
      description: |
        Mọi user đã đăng nhập. `version` lấy từ biến môi trường `CONSULTATION_TERMS_VERSION`.
        `accepted` = người gọi đã đồng ý đúng phiên bản này. Đổi phiên bản thì mọi người phải đồng ý lại.
        Điều khoản phải nói rõ: tư vấn miễn phí, hệ thống không quản lý nội dung tư vấn, luật sư xem được bản tóm tắt AI
        của đoạn chat trước lúc gửi yêu cầu (không xem được lịch sử chat với AI), xóa hội thoại AI không thu hồi bản tóm tắt
        đã gửi, nội dung chat bị xóa sau 10 ngày từ tin nhắn cuối.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Phiên bản hiện hành
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermsResponse" }
              example:
                data: { version: "2026-11-01", accepted: false }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /consultations/terms/accept:
    post:
      tags: [Terms]
      operationId: acceptConsultationTerms
      summary: Đồng ý điều khoản
      description: |
        Mọi user đã đăng nhập. `terms_version` phải đúng phiên bản hiện hành, sai thì 422.
        Gọi lại nhiều lần vẫn trả 200 (giữ `accepted_at` lần đầu).
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptTermsRequest" }
