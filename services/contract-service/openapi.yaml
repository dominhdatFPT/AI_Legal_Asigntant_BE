"openapi": "3.0.3"
"info":
  "title": "contract-service API"
  "version": "0.8.1"
  "description": "C1–C8 cập nhật11/10/2026: catalog/nháp/identity/generation và import/mapping personal đã triển khai. C8 snapshot private qua Document, marker DOCX hoặc vùng trắng PDF, user-confirm/CAS; không LLM, PDF-to-DOCX hay JWT lưu lâu dài. User/status và Procedure detail cần nhóm triển khai/test thật. Final gắn procedure chưa có checklist trả422. /templates vẫn demo; checklist và Notification delivery C9 còn planned. Dữ liệu ví dụ giả."
  "x-owner": "Hiền"
"servers":
  - "url": "http://localhost:8080/api"
    "description": "FE/Postman qua Gateway."
  - "url": "http://127.0.0.1:8006/api/v1"
    "description": "Test riêng Contract bằng docker-compose.jwt-local.yml; chỉ localhost."
  - "url": "http://contract-service:8000/api/v1"
    "description": "Service khác gọi trong Docker."
"security":
  - "BearerAuth": []
  - "CookieAuth": []
"paths":
  "/contracts/ready":
    get:
      operationId: getContractReadiness
      tags: [contracts]
      summary: Kiểm tra database và schema Contract
      description: 'C3 implemented. Cần access token. Chỉ đọc database/schema version/RLS, không migration tự động. Không xác nhận Storage hoặc service nhóm; health vẫn là liveness.'
      x-status: implemented
      parameters:
        - "$ref": "#/components/parameters/RequestId"
      responses:
        "200":
          description: Database và schema version 1 sẵn sàng.
          content:
            application/json:
              schema:
                type: object
                required: [data, error, request_id]
                properties:
                  data:
                    type: object
                    required: [database, schema_version]
                    properties:
                      database: {type: string, enum: [ready]}
                      schema_version: {type: integer, enum: [1]}
                  error: {type: object, nullable: true}
                  request_id: {type: string}
        "401":
          description: Access token thiếu hoặc không hợp lệ.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "503":
          description: Cấu hình, database hoặc schema chưa sẵn sàng; không trả DSN/SQL.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/contracts/me":
    "get":
      "operationId": "getContractAuthContext"
      "tags": ["contracts"]
      "summary": "Kiểm tra access token của người đang gọi"
      "description": "Trả user_id từ JWT sub và role. Không phải API hồ sơ, không truy vấn DB và không xác nhận trạng thái khóa tài khoản tức thời."
      "x-status": "implemented"
      "parameters":
        - "$ref": "#/components/parameters/RequestId"
      "responses":
        "200":
          "description": "Access token hợp lệ."
          "headers":
            "X-Request-ID": {schema: {type: string}}
            "Cache-Control": {schema: {type: string, example: no-store}}
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AuthContextResponse"
              "example":
                "data":
                  "user_id": "11111111-1111-4111-8111-111111111111"
                  "role": "citizen"
                "error": null
                "request_id": "req-demo-001"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
  "/contracts/health":
    "get":
      "operationId": "getContractHealth"
      "tags":
        - "contracts"
      "summary": "Kiểm tra service"
      "description": "Không cần đăng nhập. Health chỉ kiểm tra tiến trình, không đảm bảo DB/OCR đã kết nối."
      "x-status": "implemented"
      "parameters":
        - "$ref": "#/components/parameters/RequestId"
      "responses":
        "200":
          "description": "Service đang chạy."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Health"
              "example":
                "status": "ok"
                "service": "contract-service"
      "security": []
  "/contracts/templates":
    "get":
      "operationId": "listTemplatesDemo"
      "tags":
        - "contracts"
      "summary": "Danh sách mẫu demo hiện có"
      "description": "Cần JWT hợp lệ. Trả dữ liệu demo ID CONTRACT-001, chưa phân trang/DB. Nhóm chuyển FE sang /contracts/template-catalog khi API mới được triển khai."
      "x-status": "partial"
      "parameters":
        - "$ref": "#/components/parameters/RequestId"
      "responses":
        "200":
          "description": "Thành công."
          "headers":
            "X-Request-ID": {schema: {type: string}}
            "Cache-Control": {schema: {type: string, example: no-store}}
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/DemoTemplateResponse"
              "example":
                "data":
                  "items":
                    - "id": "CONTRACT-001"
                      "name": "Hợp đồng thuê nhà"
                      "version": 1
                      "fields":
                        - "name": "landlord_name"
                          "label": "Tên bên cho thuê"
                          "type": "text"
                          "required": true
                "error": null
                "request_id": "req-demo-001"
        "401":
          "$ref": "#/components/responses/Error401"
  "/contracts/template-catalog":
    "get":
      "operationId": "listTemplateCatalog"
      "tags":
        - "contracts"
      "summary": "Danh sách mẫu dùng thật"
      "description": "Chỉ catalog scope=system, không trả mẫu personal kể cả admin. Mọi user đăng nhập. Chỉ admin dùng include_hidden=true; user thường chỉ thấy mẫu is_visible=true có phiên bản published. Mặc định created_at giảm dần. Admin được kiểm tra lại tài khoản/role qua User /api/v1/users/me; User lỗi trả503."
      "x-status": "implemented"
      "parameters":
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/PageSize"
        - "name": "include_hidden"
          "in": "query"
          "required": false
          "schema":
            "type": "boolean"
            "default": false
      "responses":
        "503":
          "$ref": "#/components/responses/Error503"
        "200":
          "description": "Thành công."
          "headers":
            "X-Request-ID":
              "schema":
                "type": "string"
              "description": "Mã lần gọi."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TemplateListResponse"
              "example":
                "data":
                  "items":
                    - "id": "33333333-3333-4333-8333-333333333333"
                      "name": "Hợp đồng thuê nhà"
                      "description": "Mẫu minh họa"
                      "is_visible": true
                      "created_at": "2026-10-06T02:00:00Z"
                  "pagination":
                    "page": 1
                    "page_size": 20
                    "total": 1
                    "total_pages": 1
                "error": null
                "request_id": "req-demo-001"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "422":
          "$ref": "#/components/responses/Error422"
        "500":
          "$ref": "#/components/responses/Error500"
    "post":
      "operationId": "createTemplate"
      "tags":
        - "contracts"
      "summary": "Admin tạo mẫu"
      "description": "Chỉ admin. Tạo metadata, chưa tự xuất bản nội dung. Khởi đầu is_visible=false. Kiểm tra admin đang hoạt động qua User /api/v1/users/me bằng Bearer của người gọi; User lỗi/thiếu cấu hình trả503 và không ghi DB."
      "x-status": "implemented"
      "parameters":
        - "$ref": "#/components/parameters/RequestId"
      "responses":
        "503":
          "$ref": "#/components/responses/Error503"
        "201":
          "description": "Thành công."
          "headers":
            "X-Request-ID":
              "schema":
                "type": "string"
              "description": "Mã lần gọi."
          "content":
