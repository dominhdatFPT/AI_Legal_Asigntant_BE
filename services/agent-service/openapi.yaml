openapi: 3.0.3

info:
  title: Agent Service API
  version: 0.1.0
  description: API hội thoại AI pháp lý — nhận câu hỏi, gọi RAG-service, gọi LLM (Groq, lỗi thì Gemini) và trả lời người dùng.
  x-owner: "Dũng"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://agent-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Conversations
    description: Quản lý hội thoại của người dùng đang đăng nhập

paths:
  /agent/health:
    get:
      tags: [Health]
      operationId: getAgentHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:  { type: string, example: ok }
                  service: { type: string, example: agent-service }

  # ---------------------------------------------------------------- Conversations
  /agent/conversations:
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Tạo hội thoại mới
      description: |
        Tạo một phiên trò chuyện mới cho người dùng đang đăng nhập.
        `title` không bắt buộc — nếu bỏ trống, service tự sinh từ tin nhắn đầu tiên.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
            example:
              title: Thủ tục sang tên đất
      responses:
        "201":
          description: Hội thoại đã được tạo
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
              example:
                data:
                  id: 9a8b7c6d-5e4f-3a2b-1c0d-e9f8a7b6c5d4
                  title: null
                  created_at: "2026-10-07T08:00:00Z"
                  updated_at: "2026-10-07T08:00:00Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [Conversations]
      operationId: listConversations
      summary: Danh sách hội thoại của tôi
      description: Chỉ trả về hội thoại của người đang đăng nhập, sắp xếp mới nhất trước.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách hội thoại (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationListResponse" }
              example:
                data:
                  items:
                    - id: 9a8b7c6d-5e4f-3a2b-1c0d-e9f8a7b6c5d4
                      title: Thủ tục sang tên đất
                      created_at: "2026-10-07T08:00:00Z"
                      updated_at: "2026-10-07T08:15:00Z"
                  pagination:
                    page: 1
                    page_size: 20
                    total: 1
                    total_pages: 1
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/conversations/{conversation_id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Chi tiết hội thoại kèm toàn bộ tin nhắn
      description: |
        Chỉ lấy được hội thoại của chính mình.
        Trả về metadata của hội thoại và toàn bộ tin nhắn theo thứ tự thời gian.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Chi tiết hội thoại
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetailResponse" }
              example:
                data:
                  id: 9a8b7c6d-5e4f-3a2b-1c0d-e9f8a7b6c5d4
                  title: Thủ tục sang tên đất
                  created_at: "2026-10-07T08:00:00Z"
                  updated_at: "2026-10-07T08:15:00Z"
                  messages:
                    - id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                      role: user
                      content: Thủ tục sang tên đất cần những giấy tờ gì?
                      metadata: null
                      created_at: "2026-10-07T08:01:00Z"
                    - id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
                      role: assistant
                      content: "Theo Điều 188 Luật Đất đai 2024, hồ sơ chuyển nhượng gồm..."
                      metadata:
                        rag_chunk_ids: [a1b2c3d4-e5f6-7890-abcd-ef1234567890]
                        model: qwen/qwen3.8-27b
                        tokens_used: 512
                      created_at: "2026-10-07T08:01:03Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Xóa hội thoại
      description: |
        Chỉ xóa được hội thoại của chính mình.
        Xóa vĩnh viễn hội thoại và toàn bộ tin nhắn liên quan (CASCADE).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Đã xóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResponse" }
              example:
                data: { deleted: true }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/conversations/{conversation_id}/messages:
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Gửi tin nhắn và nhận phản hồi từ AI
      description: |
        Luồng xử lý nội bộ:
        1. Lưu tin nhắn của người dùng vào bảng `messages`
        2. Gọi RAG-service lấy top-5 chunks pháp luật liên quan
        3. Gọi LLM (Groq, lỗi thì Gemini) với lịch sử hội thoại + chunks + tin nhắn mới
        4. Lưu phản hồi của AI vào bảng `messages`
        5. Trả về cả hai tin nhắn

        Nếu `title` của hội thoại đang `null`, service tự sinh từ nội dung câu hỏi đầu tiên.

        **Đính kèm tài liệu (tùy chọn):** gửi `document_ids` (tối đa 3, không trùng) là các tài liệu đã upload
        ở document-service và đã trích chữ xong. Service lấy chữ từ document-service bằng chính access token của
        người dùng (document-service tự kiểm tra chủ file), đưa vào prompt cho AI phân tích và đối chiếu với luật.
        Nội dung tài liệu **không được lưu**, chỉ lưu `document_ids` vào `metadata` của tin nhắn trả lời.
        Lượt hỏi sau muốn dùng lại tài liệu thì gửi lại `document_ids`. Tài liệu, RAG hoặc AI lỗi thì không lưu tin nhắn nào.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
            examples:
              hoi_thuong:
                summary: Câu hỏi thường
                value:
                  content: Thủ tục sang tên đất cần những giấy tờ gì?
              kem_tai_lieu:
                summary: Hỏi kèm tài liệu đã upload
                value:
                  content: Hợp đồng này có điểm nào chưa phù hợp với luật không?
                  document_ids: [88888888-8888-4888-8888-888888888888]
      responses:
        "200":
          description: Phản hồi từ AI kèm tin nhắn của người dùng đã được lưu
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendMessageResponse" }
              example:
                data:
                  user_message:
                    id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    role: user
                    content: Thủ tục sang tên đất cần những giấy tờ gì?
                    metadata: null
                    created_at: "2026-10-07T08:01:00Z"
                  assistant_message:
                    id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
                    role: assistant
                    content: "Theo Khoản 1 Điều 188 Luật Đất đai 2024 (Luật số 31/2024/QH15), hồ sơ chuyển nhượng quyền sử dụng đất gồm: (1) Hợp đồng chuyển nhượng..."
                    metadata:
                      rag_chunk_ids: [a1b2c3d4-e5f6-7890-abcd-ef1234567890]
                      model: qwen/qwen3.8-27b
                      tokens_used: 512
                    created_at: "2026-10-07T08:01:03Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404":
          description: Không có hội thoại, hoặc (khi gửi `document_ids`) không có tài liệu / tài liệu không phải của người dùng
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                hoi_thoai:
                  summary: Không có hội thoại
                  value:
                    data: null
                    error:
                      code: CONVERSATION_NOT_FOUND
                      message: Không tìm thấy hội thoại.
                    request_id: req-123
                tai_lieu:
                  summary: Không có tài liệu (cũng là kết quả khi tài liệu của người khác, để không lộ file tồn tại)
                  value:
                    data: null
                    error:
                      code: DOCUMENT_NOT_FOUND
                      message: Không tìm thấy tài liệu.
                    request_id: req-123
        "409":
          description: Tài liệu chưa trích chữ xong, hoặc không đọc được / không đạt kiểm tra an toàn (`document_ids`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                dang_xu_ly:
                  summary: Đang xử lý, thử lại sau vài giây
                  value:
                    data: null
                    error:
                      code: DOCUMENT_NOT_READY
                      message: Tài liệu đang xử lý, vui lòng thử lại sau.
                    request_id: req-123
                khong_doc_duoc:
                  summary: Thử lại cũng không được, cần tải tài liệu khác
                  value:
                    data: null
                    error:
                      code: DOCUMENT_NOT_READY
                      message: Không đọc được nội dung tài liệu hoặc tài liệu không đạt kiểm tra an toàn, vui lòng tải tài liệu khác.
                    request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: RAG-service, LLM hoặc document-service không phản hồi
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                rag_loi:
                  summary: RAG-service lỗi
                  value:
                    data: null
                    error:
                      code: RAG_SERVICE_ERROR
                      message: Không thể truy xuất dữ liệu pháp luật lúc này, vui lòng thử lại.
                    request_id: req-123
                gemini_loi:
                  summary: LLM lỗi
                  value:
                    data: null
                    error:
                      code: AI_SERVICE_ERROR
                      message: Dịch vụ AI đang gặp sự cố, vui lòng thử lại sau.
                    request_id: req-124
                tai_lieu_loi:
                  summary: document-service lỗi (chỉ khi gửi document_ids)
                  value:
                    data: null
                    error:
                      code: DOCUMENT_SERVICE_ERROR
                      message: Không đọc được tài liệu lúc này, vui lòng thử lại sau.
                    request_id: req-125
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/conversations/{conversation_id}/messages/stream:
    post:
      tags: [Conversations]
      operationId: sendMessageStream
      summary: Gửi tin nhắn, nhận câu trả lời dạng stream (Server-Sent Events)
      description: |
        Như `sendMessage` (cùng body, cùng quyền, cùng cách lưu) nhưng câu trả lời của AI được gửi dần từng mẩu chữ
        thay vì chờ đủ câu. Endpoint `sendMessage` giữ nguyên.

        **Lỗi trước khi mở stream:** kiểm tra quyền, lấy lịch sử, đọc tài liệu đính kèm và tìm đoạn luật (cùng bước chấm
        độ liên quan nếu bật) đều xong TRƯỚC khi mở stream. Lỗi ở các bước này trả JSON lỗi bình thường
        (`application/json`, 401/403/404/409/422/503) giống `sendMessage`, và không lưu gì.

        **Sau khi mở stream** (HTTP 200, `text/event-stream`), mỗi sự kiện có dạng
        `event: <tên>` rồi `data: <JSON một dòng>` rồi một dòng trống:
        - `delta` `{"text": "..."}`: một mẩu chữ, nối các `text` theo thứ tự để có câu trả lời.
        - `done`: kết thúc thành công; `data` là `SendMessageResponse` (cùng dữ liệu `data` của `sendMessage`, gồm
          `user_message` và `assistant_message` đã lưu DB, có `id`, `metadata`).
        - `error` `{"code", "message"}`: lỗi giữa chừng (`AI_SERVICE_ERROR` khi LLM lỗi, `INTERNAL_ERROR` khi lỗi khác).
          Stream kết thúc, **không lưu tin nhắn nào**; client bỏ phần chữ đã nhận và cho người dùng gửi lại.
        Luôn kết thúc bằng đúng một `done` hoặc một `error`. Chỉ lưu cặp tin nhắn sau khi stream xong đầy đủ; client ngắt
        kết nối giữa chừng thì không lưu gì.

        Câu trả lời "xong luôn" (câu vô nghĩa, ngoài phạm vi `out_of_scope`, `LLM_BYPASS`) và nhánh có `document_ids`
        (rà soát tài liệu) không stream: phát cả câu trong một `delta` rồi `done`.

        **Gọi từ trình duyệt:** `EventSource` không gửi được POST kèm token, nên đọc stream bằng `fetch` và `ReadableStream`
        (`response.body.getReader()`), tách sự kiện theo dòng trống. Header `X-Accel-Buffering: no` để nginx không gom lại.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
            example:
              content: Thủ tục sang tên đất cần những giấy tờ gì?
      responses:
        "200":
          description: Stream sự kiện (xem mô tả). Lỗi sau khi mở stream đi qua sự kiện `error`, mã HTTP vẫn là 200
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { schema: { type: string, example: no-cache } }
            X-Accel-Buffering: { schema: { type: string, example: "no" } }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: delta
                data: {"text": "Theo Khoản 1 Điều 188 "}

                event: delta
                data: {"text": "Luật Đất đai 2024, ..."}

                event: done
                data: {"user_message": {"id": "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d", "role": "user", "content": "Thủ tục sang tên đất cần những giấy tờ gì?", "metadata": null, "created_at": "2026-10-07T08:01:00Z"}, "assistant_message": {"id": "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e", "role": "assistant", "content": "Theo Khoản 1 Điều 188 Luật Đất đai 2024, ...", "metadata": {"rag_chunk_ids": ["a1b2c3d4-e5f6-7890-abcd-ef1234567890"], "model": "google/gemini-2.5-flash", "tokens_used": 512}, "created_at": "2026-10-07T08:01:03Z"}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404":
          description: Không có hội thoại, hoặc (khi gửi `document_ids`) không có tài liệu / tài liệu không phải của người dùng. Như `sendMessage`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Tài liệu chưa trích chữ xong, hoặc không đọc được / không đạt kiểm tra an toàn. Như `sendMessage`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: RAG-service, LLM hoặc document-service không phản hồi TRƯỚC khi mở stream. Như `sendMessage`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`access_token` lấy từ `POST /users/auth/firebase` hoặc `POST /users/auth/refresh`."

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: ID hội thoại (UUID)
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  responses:
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: content
                  message: Nội dung tin nhắn không được để trống.
            request_id: req-123
    Unauthorized:
      description: Thiếu token, token sai hoặc đã hết hạn
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            thieu_token:
              summary: Thiếu hoặc sai token
              value:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: Bạn cần đăng nhập để tiếp tục.
                request_id: req-123
            het_han:
              summary: Token hết hạn
              value:
                data: null
                error:
                  code: TOKEN_EXPIRED
                  message: Phiên đăng nhập đã hết hạn.
                request_id: req-124
    ConversationForbidden:
      description: Hội thoại này không thuộc về người dùng đang đăng nhập
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: CONVERSATION_FORBIDDEN
              message: Bạn không có quyền truy cập hội thoại này.
            request_id: req-123
    ConversationNotFound:
      description: Không có hội thoại với ID này
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: CONVERSATION_NOT_FOUND
              message: Không tìm thấy hội thoại.
            request_id: req-123
    InternalError:
      description: Lỗi backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:        { type: integer, minimum: 1, example: 1 }
        page_size:   { type: integer, minimum: 1, maximum: 100, example: 20 }
        total:       { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, dùng để xử lý phía gọi
          example: CONVERSATION_NOT_FOUND
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field:   { type: string, example: content }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          nullable: true
          enum: [null]
        error:      { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Hội thoại ----------
    Conversation:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: Tiêu đề tự sinh từ câu hỏi đầu tiên; `null` khi hội thoại mới chưa có tin nhắn nào
          example: Thủ tục sang tên đất
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Thời điểm có tin nhắn mới nhất — dùng để sort danh sách hội thoại

    MessageMetadata:
      type: object
      nullable: true
      description: Chỉ có trong tin nhắn của `assistant`
      properties:
        rag_chunk_ids:
          type: array
          description: Danh sách ID chunks từ RAG-service được dùng để tạo câu trả lời
          items: { type: string, format: uuid }
        model:
          type: string
          nullable: true
          description: "Model LLM đã dùng (Groq, Gemini hoặc OpenRouter, theo `LLM_PROVIDER`); `null` khi không gọi AI (câu vô nghĩa); câu ngoài phạm vi (`type` = `out_of_scope`) là model đã chấm độ liên quan"
          example: qwen/qwen3.8-27b
        tokens_used:
          type: integer
          nullable: true
          description: Tổng số token tiêu thụ trong lần gọi LLM này; `null` khi không gọi AI
          example: 512
        type:
          type: string
          enum: [out_of_scope]
          description: |
            Chỉ có khi server bật `RELEVANCE_CHECK` và không đoạn luật nào tìm được dùng trả lời câu hỏi: `content` là câu
            cố định "chưa tìm thấy quy định liên quan trong kho văn bản", `rag_chunk_ids` rỗng, `model` là model đã dùng để chấm
        llm_bypass:
          type: boolean
          description: Chỉ có khi server bật `LLM_BYPASS` (chế độ test, không qua LLM); khi đó `model` là `no-llm`, `content` là các đoạn luật rag tìm được
        queries:
          type: array
          items: { type: string }
          description: Chỉ có khi `llm_bypass`; các câu thực sự gửi đi tìm trong rag-service
        system_prompt:
          type: string
          description: Chỉ có khi `llm_bypass`; prompt hệ thống lẽ ra được gửi cho LLM
        mode:
          type: string
          enum: [contract_review]
          description: Chỉ có khi lượt hỏi đính kèm tài liệu (chế độ rà soát)
        contract_type:
          type: string
          description: Loại hợp đồng agent nhận diện được từ nội dung tài liệu; đi kèm `mode`
          enum:
            - chuyen_nhuong_dat
            - tang_cho_dat
            - thue_dat_nha
            - the_chap
            - mua_ban_nha
            - mua_ban_hang_hoa
            - dich_vu
            - gop_von_doanh_nghiep
            - khac
        document_ids:
          type: array
          description: Tài liệu đính kèm của lượt hỏi này (nội dung tài liệu không được lưu)
          items: { type: string, format: uuid }

    Message:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:         { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
          description: Ai gửi tin nhắn này
        content:
          type: string
          description: Nội dung tin nhắn
        metadata:
          $ref: "#/components/schemas/MessageMetadata"
        created_at: { type: string, format: date-time }

    ConversationWithMessages:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              description: Toàn bộ tin nhắn theo thứ tự thời gian (cũ → mới)
              items: { $ref: "#/components/schemas/Message" }

    # ---------- Body gửi lên ----------
    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
          description: Tiêu đề tuỳ chọn; để trống thì service tự sinh từ tin nhắn đầu tiên

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nội dung câu hỏi của người dùng
        document_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, format: uuid }
          description: |
            Tài liệu đã upload (document-service) để AI đọc và đối chiếu với luật. Tối đa 3, không trùng.
            Không gửi thì chạy như cũ. Chỉ chủ tài liệu dùng được; tài liệu phải trích chữ xong.

    # ---------- Kết quả từng API ----------
    ConversationResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:       { $ref: "#/components/schemas/Conversation" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ConversationListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Conversation" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ConversationDetailResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:       { $ref: "#/components/schemas/ConversationWithMessages" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    SendMessageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [user_message, assistant_message]
          properties:
            user_message:
              $ref: "#/components/schemas/Message"
              description: Tin nhắn của người dùng đã được lưu vào DB
            assistant_message:
              $ref: "#/components/schemas/Message"
              description: Phản hồi từ AI đã được lưu vào DB
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    DeleteResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: boolean, example: true }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }