openapi: 3.0.3

info:
  title: Agent Service API
  version: 0.1.0
  description: API hội thoại AI pháp lý — nhận câu hỏi, gọi RAG-service, gọi LLM (Groq, lỗi thì Gemini) và trả lời người dùng.
  x-owner: "Dũng"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://agent-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Conversations
    description: Quản lý hội thoại của người dùng đang đăng nhập
  - name: Internal
    description: API nội bộ giữa các service, kèm `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`

paths:
  /agent/health:
    get:
      tags: [Health]
      operationId: getAgentHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:  { type: string, example: ok }
                  service: { type: string, example: agent-service }

  # ---------------------------------------------------------------- Conversations
  /agent/conversations:
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Tạo hội thoại mới
      description: |
        Tạo một phiên trò chuyện mới cho người dùng đang đăng nhập.
        `title` không bắt buộc — nếu bỏ trống, service tự sinh từ tin nhắn đầu tiên.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
            example:
              title: Thủ tục sang tên đất
      responses:
        "201":
          description: Hội thoại đã được tạo
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
              example:
                data:
                  id: 9a8b7c6d-5e4f-3a2b-1c0d-e9f8a7b6c5d4
                  title: null
                  created_at: "2026-10-07T08:00:00Z"
                  updated_at: "2026-10-07T08:00:00Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [Conversations]
      operationId: listConversations
      summary: Danh sách hội thoại của tôi
      description: Chỉ trả về hội thoại của người đang đăng nhập, sắp xếp mới nhất trước.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách hội thoại (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationListResponse" }
              example:
                data:
                  items:
                    - id: 9a8b7c6d-5e4f-3a2b-1c0d-e9f8a7b6c5d4
                      title: Thủ tục sang tên đất
                      created_at: "2026-10-07T08:00:00Z"
                      updated_at: "2026-10-07T08:15:00Z"
                  pagination:
                    page: 1
                    page_size: 20
                    total: 1
                    total_pages: 1
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/conversations/{conversation_id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Chi tiết hội thoại kèm toàn bộ tin nhắn
      description: |
        Chỉ lấy được hội thoại của chính mình.
        Trả về metadata của hội thoại và toàn bộ tin nhắn theo thứ tự thời gian.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Chi tiết hội thoại
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetailResponse" }
              example:
                data:
                  id: 9a8b7c6d-5e4f-3a2b-1c0d-e9f8a7b6c5d4
                  title: Thủ tục sang tên đất
                  created_at: "2026-10-07T08:00:00Z"
                  updated_at: "2026-10-07T08:15:00Z"
                  messages:
                    - id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                      role: user
                      content: Thủ tục sang tên đất cần những giấy tờ gì?
                      metadata: null
                      created_at: "2026-10-07T08:01:00Z"
                    - id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
                      role: assistant
                      content: "Theo Điều 188 Luật Đất đai 2024, hồ sơ chuyển nhượng gồm..."
                      metadata:
                        rag_chunk_ids: [a1b2c3d4-e5f6-7890-abcd-ef1234567890]
                        model: qwen/qwen3.8-27b
                        tokens_used: 512
                      created_at: "2026-10-07T08:01:03Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Xóa hội thoại
      description: |
        Chỉ xóa được hội thoại của chính mình.
        Xóa vĩnh viễn hội thoại và toàn bộ tin nhắn liên quan (CASCADE).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Đã xóa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResponse" }
              example:
                data: { deleted: true }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/conversations/{conversation_id}/transcript:
    get:
      tags: [Conversations]
      operationId: getConversationTranscript
      summary: Xem cả hội thoại như một bản kịch bản (chỉ đọc)
      description: |
        Chỉ xem được hội thoại của chính mình. Lấy TẤT CẢ tin nhắn (không áp giới hạn lịch sử gửi cho AI),
        gom thành các lượt: một lượt là tin người dùng rồi tin trợ lý liền sau. Tin người dùng cuối chưa có
        câu trả lời vẫn thành một lượt với `assistant: null`. Tối đa 500 tin đầu theo thứ tự thời gian
        (bằng nhau thì theo id); dài hơn thì `truncated: true`.

        `format=text` trả văn bản thuần (`text/plain; charset=utf-8`, KHÔNG có phong bì `data/error/request_id`):
        dòng `Hội thoại: <tiêu đề>`, dòng `Bắt đầu: <dd/mm/yyyy HH:MM giờ Việt Nam>`, rồi mỗi lượt gồm dòng
        `Lượt N`, `  Người dùng: ...`, `  Trợ lý: ...`, cách nhau một dòng trống; xuống dòng bên trong nội dung tin
        được giữ nguyên. `download=true` (chỉ có tác dụng với `format=text`) thêm header `Content-Disposition`
        để tải về với tên `kich-ban-<8 ký tự đầu của id>.txt`.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
        - name: format
          in: query
          required: false
          description: "`json` (mặc định) hoặc `text` (văn bản thuần)"
          schema: { type: string, enum: [json, text], default: json }
        - name: download
          in: query
          required: false
          description: "`true` + `format=text` thì thêm header `Content-Disposition: attachment`"
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Kịch bản hội thoại
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
            Content-Disposition:
              description: Chỉ có khi `format=text` và `download=true`
              schema: { type: string, example: 'attachment; filename="kich-ban-9a8b7c6d.txt"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptResponse" }
              example:
                data:
                  conversation_id: 9a8b7c6d-5e4f-3a2b-1c0d-e9f8a7b6c5d4
                  title: Thủ tục sang tên đất
                  created_at: "2026-10-07T08:00:00Z"
                  updated_at: "2026-10-07T08:15:00Z"
                  total_messages: 3
                  truncated: false
                  turns:
                    - turn: 1
                      user:
                        content: Thủ tục sang tên đất cần những giấy tờ gì?
                        created_at: "2026-10-07T08:01:00Z"
                      assistant:
                        content: "Theo Điều 188 Luật Đất đai 2024, hồ sơ chuyển nhượng gồm..."
                        created_at: "2026-10-07T08:01:03Z"
                    - turn: 2
                      user:
                        content: Còn thời hạn giải quyết?
                        created_at: "2026-10-07T08:15:00Z"
                      assistant: null
                error: null
                request_id: req-123
            text/plain:
              schema: { type: string }
              example: |
                Hội thoại: Thủ tục sang tên đất
                Bắt đầu: 07/10/2026 15:00

                Lượt 1
                  Người dùng: Thủ tục sang tên đất cần những giấy tờ gì?
                  Trợ lý: Theo Điều 188 Luật Đất đai 2024, hồ sơ chuyển nhượng gồm...

                Lượt 2
                  Người dùng: Còn thời hạn giải quyết?
                  Trợ lý:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/conversations/{conversation_id}/messages:
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Gửi tin nhắn và nhận phản hồi từ AI
      description: |
        Luồng xử lý nội bộ:
        1. Lưu tin nhắn của người dùng vào bảng `messages`
        2. Gọi RAG-service lấy top-5 chunks pháp luật liên quan
        3. Gọi LLM (Groq, lỗi thì Gemini) với lịch sử hội thoại + chunks + tin nhắn mới
        4. Lưu phản hồi của AI vào bảng `messages`
        5. Trả về cả hai tin nhắn

        Nếu `title` của hội thoại đang `null`, service tự sinh từ nội dung câu hỏi đầu tiên.

        **Đính kèm tài liệu (tùy chọn):** gửi `document_ids` (tối đa 3, không trùng) là các tài liệu đã upload
        ở document-service và đã trích chữ xong. Service lấy chữ từ document-service bằng chính access token của
        người dùng (document-service tự kiểm tra chủ file), đưa vào prompt cho AI phân tích và đối chiếu với luật.
        Nội dung tài liệu **không được lưu**, chỉ lưu `document_ids` vào `metadata` của tin nhắn trả lời.
        Lượt hỏi sau muốn dùng lại tài liệu thì gửi lại `document_ids`. Tài liệu, RAG hoặc AI lỗi thì không lưu tin nhắn nào.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
            examples:
              hoi_thuong:
                summary: Câu hỏi thường
                value:
                  content: Thủ tục sang tên đất cần những giấy tờ gì?
              kem_tai_lieu:
                summary: Hỏi kèm tài liệu đã upload
                value:
                  content: Hợp đồng này có điểm nào chưa phù hợp với luật không?
                  document_ids: [88888888-8888-4888-8888-888888888888]
      responses:
        "200":
          description: Phản hồi từ AI kèm tin nhắn của người dùng đã được lưu
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendMessageResponse" }
              example:
                data:
                  user_message:
                    id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    role: user
                    content: Thủ tục sang tên đất cần những giấy tờ gì?
                    metadata: null
                    created_at: "2026-10-07T08:01:00Z"
                  assistant_message:
                    id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
                    role: assistant
                    content: "Theo Khoản 1 Điều 188 Luật Đất đai 2024 (Luật số 31/2024/QH15), hồ sơ chuyển nhượng quyền sử dụng đất gồm: (1) Hợp đồng chuyển nhượng..."
                    metadata:
                      rag_chunk_ids: [a1b2c3d4-e5f6-7890-abcd-ef1234567890]
                      model: qwen/qwen3.8-27b
                      tokens_used: 512
                    created_at: "2026-10-07T08:01:03Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404":
          description: Không có hội thoại, hoặc (khi gửi `document_ids`) không có tài liệu / tài liệu không phải của người dùng
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                hoi_thoai:
                  summary: Không có hội thoại
                  value:
                    data: null
                    error:
                      code: CONVERSATION_NOT_FOUND
                      message: Không tìm thấy hội thoại.
                    request_id: req-123
                tai_lieu:
                  summary: Không có tài liệu (cũng là kết quả khi tài liệu của người khác, để không lộ file tồn tại)
                  value:
                    data: null
                    error:
                      code: DOCUMENT_NOT_FOUND
                      message: Không tìm thấy tài liệu.
                    request_id: req-123
        "409":
          description: Tài liệu chưa trích chữ xong, hoặc không đọc được / không đạt kiểm tra an toàn (`document_ids`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                dang_xu_ly:
                  summary: Đang xử lý, thử lại sau vài giây
                  value:
                    data: null
                    error:
                      code: DOCUMENT_NOT_READY
                      message: Tài liệu đang xử lý, vui lòng thử lại sau.
                    request_id: req-123
                khong_doc_duoc:
                  summary: Thử lại cũng không được, cần tải tài liệu khác
                  value:
                    data: null
                    error:
                      code: DOCUMENT_NOT_READY
                      message: Không đọc được nội dung tài liệu hoặc tài liệu không đạt kiểm tra an toàn, vui lòng tải tài liệu khác.
                    request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: RAG-service, LLM hoặc document-service không phản hồi
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                rag_loi:
                  summary: RAG-service lỗi
                  value:
                    data: null
                    error:
                      code: RAG_SERVICE_ERROR
                      message: Không thể truy xuất dữ liệu pháp luật lúc này, vui lòng thử lại.
                    request_id: req-123
                gemini_loi:
                  summary: LLM lỗi
                  value:
                    data: null
                    error:
                      code: AI_SERVICE_ERROR
                      message: Dịch vụ AI đang gặp sự cố, vui lòng thử lại sau.
                    request_id: req-124
                tai_lieu_loi:
                  summary: document-service lỗi (chỉ khi gửi document_ids)
                  value:
                    data: null
                    error:
                      code: DOCUMENT_SERVICE_ERROR
                      message: Không đọc được tài liệu lúc này, vui lòng thử lại sau.
                    request_id: req-125
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/conversations/{conversation_id}/messages/stream:
    post:
      tags: [Conversations]
      operationId: sendMessageStream
      summary: Gửi tin nhắn, nhận câu trả lời dạng stream (Server-Sent Events)
      description: |
        Như `sendMessage` (cùng body, cùng quyền, cùng cách lưu) nhưng câu trả lời của AI được gửi dần từng mẩu chữ
        thay vì chờ đủ câu. Endpoint `sendMessage` giữ nguyên.

        **Lỗi trước khi mở stream:** kiểm tra quyền, lấy lịch sử, đọc tài liệu đính kèm và tìm đoạn luật (cùng bước chấm
        độ liên quan nếu bật) đều xong TRƯỚC khi mở stream. Lỗi ở các bước này trả JSON lỗi bình thường
        (`application/json`, 401/403/404/409/422/503) giống `sendMessage`, và không lưu gì.

        **Sau khi mở stream** (HTTP 200, `text/event-stream`), mỗi sự kiện có dạng
        `event: <tên>` rồi `data: <JSON một dòng>` rồi một dòng trống:
        - `delta` `{"text": "..."}`: một mẩu chữ, nối các `text` theo thứ tự để có câu trả lời.
        - `done`: kết thúc thành công; `data` là `SendMessageResponse` (cùng dữ liệu `data` của `sendMessage`, gồm
          `user_message` và `assistant_message` đã lưu DB, có `id`, `metadata`).
        - `error` `{"code", "message"}`: lỗi giữa chừng (`AI_SERVICE_ERROR` khi LLM lỗi, `INTERNAL_ERROR` khi lỗi khác).
          Stream kết thúc, **không lưu tin nhắn nào**; client bỏ phần chữ đã nhận và cho người dùng gửi lại.
        Luôn kết thúc bằng đúng một `done` hoặc một `error`. Chỉ lưu cặp tin nhắn sau khi stream xong đầy đủ; client ngắt
        kết nối giữa chừng thì không lưu gì.

        Câu trả lời "xong luôn" (câu vô nghĩa, ngoài phạm vi `out_of_scope`, `LLM_BYPASS`) và nhánh có `document_ids`
        (rà soát tài liệu) không stream: phát cả câu trong một `delta` rồi `done`.

        **Gọi từ trình duyệt:** `EventSource` không gửi được POST kèm token, nên đọc stream bằng `fetch` và `ReadableStream`
        (`response.body.getReader()`), tách sự kiện theo dòng trống. Header `X-Accel-Buffering: no` để nginx không gom lại.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
            example:
              content: Thủ tục sang tên đất cần những giấy tờ gì?
      responses:
        "200":
          description: Stream sự kiện (xem mô tả). Lỗi sau khi mở stream đi qua sự kiện `error`, mã HTTP vẫn là 200
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { schema: { type: string, example: no-cache } }
            X-Accel-Buffering: { schema: { type: string, example: "no" } }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: delta
                data: {"text": "Theo Khoản 1 Điều 188 "}

                event: delta
                data: {"text": "Luật Đất đai 2024, ..."}

                event: done
                data: {"user_message": {"id": "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d", "role": "user", "content": "Thủ tục sang tên đất cần những giấy tờ gì?", "metadata": null, "created_at": "2026-10-07T08:01:00Z"}, "assistant_message": {"id": "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e", "role": "assistant", "content": "Theo Khoản 1 Điều 188 Luật Đất đai 2024, ...", "metadata": {"rag_chunk_ids": ["a1b2c3d4-e5f6-7890-abcd-ef1234567890"], "model": "google/gemini-2.5-flash", "tokens_used": 512}, "created_at": "2026-10-07T08:01:03Z"}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ConversationForbidden" }
        "404":
          description: Không có hội thoại, hoặc (khi gửi `document_ids`) không có tài liệu / tài liệu không phải của người dùng. Như `sendMessage`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Tài liệu chưa trích chữ xong, hoặc không đọc được / không đạt kiểm tra an toàn. Như `sendMessage`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: RAG-service, LLM hoặc document-service không phản hồi TRƯỚC khi mở stream. Như `sendMessage`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Internal
  /internal/v1/agent/conversations/{conversation_id}/summary:
    post:
      tags: [Internal]
      operationId: summarizeConversation
      summary: Tóm tắt hội thoại AI cho luật sư (consultation-service gọi)
      description: |
        Chỉ consultation-service gọi, kèm `X-Internal-Token` (không dùng JWT). Gateway không chuyển tiếp `/internal/...`.
        Luật sư không xem lịch sử chat AI, chỉ đọc bản tóm tắt này trước khi tư vấn.

        **Phạm vi:** chỉ dùng tin của hội thoại có `created_at < until`, sắp xếp theo `created_at`. Tin gửi từ `until` trở đi
        không được dùng. `until` là lúc người dùng gửi yêu cầu tư vấn và phải có múi giờ (ví dụ `...Z`, `...+07:00`).

        **Chủ sở hữu:** hội thoại phải có `user_id` khớp body. Không tồn tại, đã xóa hoặc của người khác đều trả cùng một lỗi
        404 `CONVERSATION_NOT_FOUND` (không có `CONVERSATION_FORBIDDEN` ở API này) để không lộ hội thoại có tồn tại hay không.

        **Nội dung:** tiếng Việt, ngôi thứ ba, văn bản thuần, tối đa khoảng 2000 ký tự (do prompt dặn, service không cắt cứng).
        Nêu vấn đề pháp lý, các tình tiết người dùng đã kể, câu hỏi còn chưa được giải đáp; gợi ý của AI được ghi ngắn và đánh
        dấu là gợi ý của AI. Dặn AI không ghi số CCCD, số điện thoại, email, địa chỉ chi tiết (đây là lời dặn, không phải bộ lọc).

        **Không lưu:** agent-service không lưu bản tóm tắt. Gọi lại cùng tham số là an toàn (mỗi lần gọi LLM một lần,
        nội dung có thể khác chút).

        **Giới hạn đầu vào:** lấy tối đa 60 tin gần `until` nhất, mỗi tin cắt còn 3000 ký tự, tổng tối đa 24000 ký tự;
        dài hơn thì bỏ tin cũ nhất, giữ phần gần `until`.

        **Thời gian:** tối đa 50 giây cho cả lượt gọi LLM (mỗi provider 20 giây, không thử lại cùng provider), để
        consultation-service chờ 60 giây không bị quá giờ. LLM lỗi hoặc quá giờ đều trả 503 `AI_SERVICE_ERROR`; phía gọi
        có thể map sang `AGENT_BAD_RESPONSE` (LLM trả lỗi) hoặc `AGENT_TIMEOUT` (không có phản hồi trong 60 giây).

        Log chỉ ghi `conversation_id`, số tin, thời gian, `request_id`; không ghi nội dung tin nhắn hay bản tóm tắt.
      x-status: implemented
      servers:
        - url: http://agent-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryRequest" }
            example:
              user_id: 11111111-1111-4111-8111-111111111111
              until: "2026-11-02T09:00:00Z"
      responses:
        "200":
          description: Bản tóm tắt
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryResponse" }
              example:
                data:
                  conversation_id: 3f2b8c1e-5d4a-4e6f-9a7b-1c2d3e4f5a6b
                  summary: "Người dùng hỏi về thủ tục tách thửa đất để cho con. Người dùng cho biết đất đã có sổ đỏ đứng tên mình từ năm 2019, diện tích khoảng 300 m2, chưa thế chấp. Gợi ý của trợ lý AI (chưa được xác minh): cần xem diện tích tối thiểu được tách thửa theo quy định của địa phương. Câu hỏi còn chưa được giải đáp: tách thửa rồi tặng cho con thì cần những giấy tờ gì và đóng những khoản phí nào."
                error: null
                request_id: req-123
        "401":
          description: Thiếu hoặc sai `X-Internal-Token`, hoặc service chưa cấu hình `INTERNAL_TOKEN`
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: Thiếu hoặc sai mã xác thực nội bộ.
                request_id: req-123
        "404":
          description: Không có hội thoại, đã xóa, hoặc không thuộc `user_id` (không phân biệt các trường hợp này)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: CONVERSATION_NOT_FOUND
                  message: Không tìm thấy hội thoại.
                request_id: req-123
        "422":
          description: Body sai (`VALIDATION_ERROR`) hoặc hội thoại chưa có tin nào trước `until` (`CONVERSATION_EMPTY`, không gọi LLM)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                body_sai:
                  summary: Thiếu `user_id` hoặc `until`, sai UUID, sai định dạng hoặc thiếu múi giờ
                  value:
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: Dữ liệu gửi lên không hợp lệ.
                      details:
                        - field: until
                          message: Input should be a valid datetime
                    request_id: req-123
                hoi_thoai_rong:
                  summary: Không có tin nào trước `until`
                  value:
                    data: null
                    error:
                      code: CONVERSATION_EMPTY
                      message: Hội thoại chưa có tin nhắn nào trước thời điểm yêu cầu.
                    request_id: req-123
        "503":
          description: LLM lỗi hoặc quá thời gian (cùng mã và status với lỗi LLM ở `sendMessage`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                data: null
                error:
                  code: AI_SERVICE_ERROR
                  message: Dịch vụ AI đang gặp sự cố, vui lòng thử lại sau.
                request_id: req-123
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/v1/agent/transcripts/summary:
    post:
      tags: [Internal]
      operationId: summarizeTranscript
      summary: Trích biên bản JSON từ một đoạn chat user - luật sư (consultation-service gọi)
      description: |
        Chỉ consultation-service gọi, kèm `X-Internal-Token`. Nội dung tin nhắn do phía gọi gửi lên (đã che PII bằng
        `[CCCD]`, `[SĐT]`, `[EMAIL]`, `[STK]`); agent-service không đọc database và không lưu gì.

        **Kết quả:** `data.summary` là một object JSON theo schema biên bản (`has_substance`, `legal_domains`, `overview`,
        `citizen_issues`, `facts`, `lawyer_advice`, `legal_references`, `deadlines`, `next_steps`, `conflicts`,
        `open_questions`; schema nằm trong prompt, `app/services/minutes.py`). `data.prompt_version` là phiên bản prompt.
        Agent chỉ bảo đảm đó là object JSON; **consultation-service** kiểm đúng schema, `source_ids` có thật và đánh dấu
        `verified` cho số liệu nguyên văn.

        **An toàn:** nội dung tin được escape `& < >` trước khi đưa vào thẻ `<msg>`, prompt dặn coi tin nhắn là dữ liệu.

        **Thời gian:** tối đa 145 giây cho cả lượt gọi LLM (mỗi provider 140 giây; đo ~40 giây cho 4 tin), phía gọi chờ 150 giây. LLM lỗi hoặc quá giờ
        trả 503 `AI_SERVICE_ERROR`; LLM trả về không phải object JSON thì 502 `AI_OUTPUT_INVALID`.

        Log chỉ ghi `consultation_id`, số tin, thời gian, `request_id`; không ghi nội dung.
      x-status: implemented
      servers:
        - url: http://agent-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultation_id, window_end, messages]
              properties:
                consultation_id: { type: string, format: uuid }
                window_start: { type: [string, "null"], format: date-time }
                window_end: { type: string, format: date-time, description: Có múi giờ }
                previous_summary:
                  type: [object, "null"]
                  description: "Chỉ để hiểu ngữ cảnh, không được chép lại"
                  properties:
                    overview: { type: [string, "null"] }
                    legal_domains: { type: array, items: { type: string } }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required: [id, role, time, content]
                    properties:
                      id: { type: string, description: Duy nhất trong request }
                      role: { enum: [CITIZEN, LAWYER] }
                      time: { type: string, format: date-time }
                      content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "200":
          description: Biên bản
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary: { type: object }
                      prompt_version: { type: string, example: v1 }
                  error: { type: "null" }
                  request_id: { type: string }
        "401": { description: "Thiếu hoặc sai `X-Internal-Token`" }
        "422": { description: "Body sai (`VALIDATION_ERROR`): thiếu trường, thiếu múi giờ, id tin trùng, quá 60 tin" }
        "502": { description: "LLM trả về không phải object JSON (`AI_OUTPUT_INVALID`)" }
        "503": { description: "LLM lỗi hoặc quá thời gian (`AI_SERVICE_ERROR`)" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`access_token` lấy từ `POST /users/auth/firebase` hoặc `POST /users/auth/refresh`."
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Giá trị `INTERNAL_TOKEN` trong `.env`, chỉ dùng cho `/internal/v1/...`.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: ID hội thoại (UUID)
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  responses:
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: content
                  message: Nội dung tin nhắn không được để trống.
            request_id: req-123
    Unauthorized:
      description: Thiếu token, token sai hoặc đã hết hạn
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            thieu_token:
              summary: Thiếu hoặc sai token
              value:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: Bạn cần đăng nhập để tiếp tục.
                request_id: req-123
            het_han:
              summary: Token hết hạn
              value:
                data: null
                error:
                  code: TOKEN_EXPIRED
                  message: Phiên đăng nhập đã hết hạn.
                request_id: req-124
    ConversationForbidden:
      description: Hội thoại này không thuộc về người dùng đang đăng nhập
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: CONVERSATION_FORBIDDEN
              message: Bạn không có quyền truy cập hội thoại này.
            request_id: req-123
    ConversationNotFound:
      description: Không có hội thoại với ID này
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: CONVERSATION_NOT_FOUND
              message: Không tìm thấy hội thoại.
            request_id: req-123
    InternalError:
      description: Lỗi backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:        { type: integer, minimum: 1, example: 1 }
        page_size:   { type: integer, minimum: 1, maximum: 100, example: 20 }
        total:       { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, dùng để xử lý phía gọi
          example: CONVERSATION_NOT_FOUND
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field:   { type: string, example: content }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          nullable: true
          enum: [null]
        error:      { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Tóm tắt hội thoại (nội bộ) ----------
    SummaryRequest:
      type: object
      required: [user_id, until]
      properties:
        user_id:
          type: string
          format: uuid
          description: Người tạo yêu cầu tư vấn; phải là chủ hội thoại, nếu không trả 404 `CONVERSATION_NOT_FOUND`
        until:
          type: string
          format: date-time
          description: Chỉ dùng tin có `created_at` nhỏ hơn mốc này (lúc người dùng gửi yêu cầu tư vấn). Bắt buộc có múi giờ
          example: "2026-11-02T09:00:00Z"

    SummaryResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [conversation_id, summary]
          properties:
            conversation_id: { type: string, format: uuid }
            summary:
              type: string
              description: Văn bản thuần tiếng Việt, ngôi thứ ba, khoảng 2000 ký tự trở xuống
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Hội thoại ----------
    Conversation:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: Tiêu đề tự sinh từ câu hỏi đầu tiên; `null` khi hội thoại mới chưa có tin nhắn nào
          example: Thủ tục sang tên đất
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Thời điểm có tin nhắn mới nhất — dùng để sort danh sách hội thoại

    MessageMetadata:
      type: object
      nullable: true
      description: Chỉ có trong tin nhắn của `assistant`
      properties:
        rag_chunk_ids:
          type: array
          description: Danh sách ID chunks từ RAG-service được dùng để tạo câu trả lời
          items: { type: string, format: uuid }
        model:
          type: string
          nullable: true
          description: "Model LLM đã dùng (Groq, Gemini hoặc OpenRouter, theo `LLM_PROVIDER`); `null` khi không gọi AI (câu vô nghĩa); câu ngoài phạm vi (`type` = `out_of_scope`) là model đã chấm độ liên quan"
          example: qwen/qwen3.8-27b
        tokens_used:
          type: integer
          nullable: true
          description: Tổng số token tiêu thụ trong lần gọi LLM này; `null` khi không gọi AI
          example: 512
        type:
          type: string
          enum: [out_of_scope, document_unreadable, document_need_type]
          description: |
            `out_of_scope`: chỉ có khi server bật `RELEVANCE_CHECK` và không đoạn luật nào tìm được dùng trả lời câu hỏi: `content` là câu
            cố định "chưa tìm thấy quy định liên quan trong kho văn bản", `rag_chunk_ids` rỗng, `model` là model đã dùng để chấm

            `document_unreadable`: chỉ có khi server bật `DOCUMENT_GATE_ENABLED`, lượt hỏi có `document_ids` và có tài liệu quá ít chữ
            hoặc chữ rác (nghi scan mờ, OCR lỗi): `content` là câu cố định nêu số thứ tự tài liệu, lý do và gợi ý tải bản rõ hơn
            hoặc dán nội dung vào khung chat; không tìm luật, không gọi AI nên `rag_chunk_ids` rỗng, `model` và `tokens_used` là `null`

            `document_need_type`: chỉ có khi server bật `DOCUMENT_ASK_TYPE_ENABLED`, lượt hỏi có `document_ids`, agent không nhận ra
            loại hợp đồng (`contract_type` = `khac`) và câu hỏi chung chung (vd "kiểm tra giúp tôi"): `content` là câu hỏi lại
            loại hợp đồng (kèm các loại hỗ trợ) hoặc điều cần kiểm tra; không tìm luật, không gọi AI nên `rag_chunk_ids` rỗng, `model`
            và `tokens_used` là `null`, có thêm `mode` = `contract_review`. Người dùng trả lời bằng câu cụ thể (kèm lại `document_ids`)
            thì lượt đó rà soát bình thường
        cache_hit:
          type: boolean
          description: Chỉ có (luôn `true`) khi server bật `ANSWER_CACHE_ENABLED` và câu trả lời lấy từ cache câu trả lời (câu đầu hội thoại, không kèm tài liệu, đã có người hỏi giống hệt); khi đó `tokens_used` là `0` (lượt này không gọi AI), `model` và `rag_chunk_ids` giữ như lúc lưu cache
        llm_bypass:
          type: boolean
          description: Chỉ có khi server bật `LLM_BYPASS` (chế độ test, không qua LLM); khi đó `model` là `no-llm`, `content` là các đoạn luật rag tìm được
        queries:
          type: array
          items: { type: string }
          description: Chỉ có khi `llm_bypass`; các câu thực sự gửi đi tìm trong rag-service
        system_prompt:
          type: string
          description: Chỉ có khi `llm_bypass`; prompt hệ thống lẽ ra được gửi cho LLM
        mode:
          type: string
          enum: [contract_review]
          description: Chỉ có khi lượt hỏi đính kèm tài liệu (chế độ rà soát)
        contract_type:
          type: string
          description: Loại hợp đồng agent nhận diện được từ nội dung tài liệu; đi kèm `mode`
          enum:
            - chuyen_nhuong_dat
            - tang_cho_dat
            - thue_dat_nha
            - the_chap
            - mua_ban_nha
            - mua_ban_hang_hoa
            - dich_vu
            - gop_von_doanh_nghiep
            - khac
        document_ids:
          type: array
          description: Tài liệu đính kèm của lượt hỏi này (nội dung tài liệu không được lưu)
          items: { type: string, format: uuid }

    Message:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:         { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
          description: Ai gửi tin nhắn này
        content:
          type: string
          description: Nội dung tin nhắn
        metadata:
          $ref: "#/components/schemas/MessageMetadata"
        created_at: { type: string, format: date-time }

    ConversationWithMessages:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              description: Toàn bộ tin nhắn theo thứ tự thời gian (cũ → mới)
              items: { $ref: "#/components/schemas/Message" }

    # ---------- Body gửi lên ----------
    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
          description: Tiêu đề tuỳ chọn; để trống thì service tự sinh từ tin nhắn đầu tiên

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nội dung câu hỏi của người dùng
        document_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, format: uuid }
          description: |
            Tài liệu đã upload (document-service) để AI đọc và đối chiếu với luật. Tối đa 3, không trùng.
            Không gửi thì chạy như cũ. Chỉ chủ tài liệu dùng được; tài liệu phải trích chữ xong.

    # ---------- Kết quả từng API ----------
    ConversationResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:       { $ref: "#/components/schemas/Conversation" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ConversationListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Conversation" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ConversationDetailResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:       { $ref: "#/components/schemas/ConversationWithMessages" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    TranscriptMessage:
      type: object
      required: [content, created_at]
      properties:
        content:    { type: string, description: Nội dung tin, giữ nguyên xuống dòng }
        created_at: { type: string, format: date-time }

    TranscriptTurn:
      type: object
      required: [turn, user, assistant]
      properties:
        turn: { type: integer, minimum: 1, description: Số thứ tự lượt, từ 1 }
        user:
          allOf:
            - $ref: "#/components/schemas/TranscriptMessage"
          nullable: true
          description: "`null` chỉ khi dữ liệu lệch cặp (tin trợ lý không có tin người dùng đứng trước); luồng lưu thông thường không tạo ra"
        assistant:
          allOf:
            - $ref: "#/components/schemas/TranscriptMessage"
          nullable: true
          description: "`null` khi tin người dùng cuối chưa có câu trả lời"

    Transcript:
      type: object
      required: [conversation_id, title, created_at, updated_at, total_messages, truncated, turns]
      properties:
        conversation_id: { type: string, format: uuid }
        title:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        total_messages:
          type: integer
          minimum: 0
          description: Tổng số tin của hội thoại; lớn hơn số tin nằm trong `turns` khi `truncated` là true
        truncated:
          type: boolean
          description: "`true` khi hội thoại dài hơn 500 tin và `turns` chỉ gồm 500 tin đầu"
        turns:
          type: array
          items: { $ref: "#/components/schemas/TranscriptTurn" }

    TranscriptResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:       { $ref: "#/components/schemas/Transcript" }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    SendMessageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [user_message, assistant_message]
          properties:
            user_message:
              $ref: "#/components/schemas/Message"
              description: Tin nhắn của người dùng đã được lưu vào DB
            assistant_message:
              $ref: "#/components/schemas/Message"
              description: Phản hồi từ AI đã được lưu vào DB
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    DeleteResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: boolean, example: true }
        error:      { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }