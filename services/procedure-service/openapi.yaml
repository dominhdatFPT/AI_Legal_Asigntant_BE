openapi: 3.0.3

info:
  title: Procedure Service API
  version: 0.1.0
  description: |
    API contract của **Procedure Service**: tra cứu thủ tục hành chính (đất đai, hộ kinh doanh)
    và danh sách giấy tờ cần chuẩn bị.

    - Tuân theo `docs/API_GUIDELINES.md` (v2): kết quả dạng `{data, error, request_id}`,
      `snake_case`, UUID, thời gian ISO 8601 UTC, tiền là số nguyên đồng.
    - `x-status` ở mỗi API cho biết tình trạng code:
      `implemented` = đã chạy đúng contract; `partial` = đã có nhưng chưa đủ như contract;
      `planned` = mới thiết kế, chưa code.
    - Dữ liệu trong `example` chỉ để minh họa, **không phải dữ liệu pháp lý**.
    - Không cần đăng nhập: thông tin thủ tục là công khai. API hồ sơ (`/procedures/applications...`) cần access token;
      mỗi user chỉ thấy hồ sơ của mình, `admin` thấy tất cả.
  x-owner: "(điền tên người phụ trách Procedure Service)"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://procedure-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Procedures
    description: Tra cứu thủ tục và giấy tờ cần chuẩn bị
  - name: Applications
    description: Hồ sơ người dùng đã nộp/lưu nháp (cần đăng nhập)
  - name: Form templates
    description: Kho mẫu đơn tham khảo (công khai, xem hoặc tải file mẫu)
  - name: Dynamic form templates
    description: Mẫu đơn dùng chung dựng bằng bộ thẻ (admin dựng, công dân điền và in PDF trên trình duyệt)

paths:
  /procedures/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: procedure-service }

  /procedures:
    get:
      tags: [Procedures]
      operationId: listProcedures
      summary: Danh sách thủ tục
      description: |
        Lấy danh sách thủ tục, lọc theo lĩnh vực, có phân trang và hỗ trợ tìm kiếm.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: domain
          in: query
          description: Lọc theo lĩnh vực. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/Domain" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách thủ tục (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcedureListResponse" }
              example:
                data:
                  items:
                    - id: 7c0e5b0e-2f4b-4c3e-9a51-1f0a6e2b9d10
                      code: HKD-001
                      name: Đăng ký thành lập hộ kinh doanh
                      domain: business
                  pagination: { page: 1, page_size: 20, total: 1, total_pages: 1 }
                error: null
                request_id: req-123
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/search:
    post:
      tags: [Procedures]
      operationId: searchProcedures
      summary: Tìm thủ tục theo câu hỏi
      description: |
        Tìm thủ tục phù hợp với câu người dùng nhập. Agent Service gọi API này khi trả lời chat.
        Không có kết quả thì trả `items: []` (status 200), không trả 404.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcedureSearchRequest" }
            examples:
              tim_thay:
                summary: Có kết quả
                value: { query: "đăng ký hộ kinh doanh" }
              khong_thay:
                summary: Không có kết quả
                value: { query: "xin chào" }
      responses:
        "200":
          description: Kết quả tìm kiếm
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcedureSearchResponse" }
              examples:
                tim_thay:
                  summary: Có kết quả
                  value:
                    data:
                      items:
                        - id: HKD-001
                          code: HKD-001
                          name: Đăng ký thành lập hộ kinh doanh
                    error: null
                    request_id: req-123
                khong_thay:
                  summary: Không có kết quả
                  value:
                    data: { items: [] }
                    error: null
                    request_id: req-124
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/domains/{domain}/procedures:
    get:
      tags: [Procedures]
      operationId: listProceduresByDomain
      summary: Thủ tục theo lĩnh vực
      description: |
        Danh sách thủ tục của một lĩnh vực (`land`, `business`, hoặc `all`), sắp theo mã.
        `include_details=false` để bỏ giấy tờ/điều kiện/căn cứ pháp lý (nhẹ hơn, FE dùng cho danh mục).
        Alias cũ: `GET /procedures/domains/{domain}`.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - { name: domain, in: path, required: true, schema: { type: string, enum: [land, business, all] } }
        - { name: include_details, in: query, schema: { type: boolean, default: true } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Danh sách thủ tục (rỗng thì `items` = `[]`)
          content:
            application/json:
              schema:
                type: object
                required: [data, error, request_id]
                properties:
                  data:
                    type: object
                    required: [domain, total, items]
                    properties:
                      domain: { type: string }
                      total: { type: integer, minimum: 0 }
                      items: { type: array, items: { $ref: "#/components/schemas/ProcedureSummary" } }
                  error: { $ref: "#/components/schemas/NoError" }
                  request_id: { $ref: "#/components/schemas/RequestIdValue" }
              example:
                data:
                  domain: business
                  total: 1
                  items:
                    - id: 7c0e5b0e-2f4b-4c3e-9a51-1f0a6e2b9d10
                      code: HKD-001
                      name: Đăng ký thành lập hộ kinh doanh
                      domain: business
                      description: Cấp giấy chứng nhận đăng ký hộ kinh doanh
                      processing_days: 3
                      fee: 100000
                      fee_formatted: "100.000 ₫"
                error: null
                request_id: req-123
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/templates:
    get:
      tags: [Form templates]
      operationId: listFormTemplates
      summary: Danh sách mẫu đơn tham khảo
      description: |
        Mẫu đơn, tờ khai, hợp đồng mẫu trong bảng `form_templates` của database Procedure
        (nạp bằng `scripts/seed_form_templates.py`). Công khai, không cần đăng nhập.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - { name: domain, in: query, schema: { type: string, enum: [land, business] } }
        - { name: q, in: query, description: Tìm theo tên mẫu hoặc tên thủ tục, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Danh sách mẫu đơn
          content:
            application/json:
              schema:
                type: object
                required: [data, error, request_id]
                properties:
                  data:
                    type: object
                    required: [items, total]
                    properties:
                      total: { type: integer, minimum: 0 }
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, name, procedure, domain, domain_label, format, size, media_type, filename, viewable]
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string, example: Đăng ký giải thể doanh nghiệp }
                            procedure: { type: string, example: Đăng ký giải thể doanh nghiệp }
                            domain: { type: string, enum: [land, business] }
                            domain_label: { type: string, example: Doanh nghiệp & Hộ kinh doanh }
                            format: { type: string, enum: [PDF, DOC, DOCX, PNG, JPG, JPEG] }
                            size: { type: integer, description: Dung lượng file (byte) }
                            media_type: { type: string, example: application/msword }
                            filename: { type: string, example: Thủ tục đăng ký giải thể doanh nghiệp.doc }
                            viewable:
                              type: boolean
                              description: true nếu trình duyệt xem được (PDF/ảnh, hoặc mẫu Word đã có bản PDF xem trước)
                  error: { $ref: "#/components/schemas/NoError" }
                  request_id: { $ref: "#/components/schemas/RequestIdValue" }

  /procedures/templates/{template_id}/file:
    get:
      tags: [Form templates]
      operationId: getFormTemplateFile
      summary: Xem hoặc tải file mẫu đơn
      description: |
        Trả nội dung file từ database. Mặc định `Content-Disposition: inline` để xem; mẫu Word có bản PDF
        xem trước thì trả bản PDF đó. `download=true` luôn trả file gốc để tải về.
      x-status: implemented
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: File mẫu
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/msword: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404":
          description: Không có mẫu với id này (`TEMPLATE_NOT_FOUND`)
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/admin/form-templates:
    get:
      tags: [Dynamic form templates]
      operationId: listAdminDynamicFormTemplates
      summary: (Admin) Danh sách mẫu đơn dùng chung, mọi version và trạng thái
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - { name: domain, in: query, schema: { $ref: "#/components/schemas/DynamicFormDomain" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DynamicFormStatus" } }
        - { name: include_deleted, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }
    post:
      tags: [Dynamic form templates]
      operationId: createDynamicFormTemplate
      summary: (Admin) Tạo mẫu mới (version 1, draft)
      description: Nháp chỉ kiểm tra mềm (cho phép mục/thẻ rỗng, trường tự do chưa có tiêu đề).
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/DynamicFormContent" } }
      responses:
        "201": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/admin/form-templates/{template_id}:
    parameters:
      - $ref: "#/components/parameters/DynamicTemplateId"
    get:
      tags: [Dynamic form templates]
      operationId: getAdminDynamicFormTemplate
      summary: (Admin) Chi tiết một version (kể cả nháp, đã xóa)
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }
    put:
      tags: [Dynamic form templates]
      operationId: updateDynamicFormTemplate
      summary: (Admin) Sửa bản nháp
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/DynamicFormContent" } }
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "409": { $ref: "#/components/responses/DynamicFormTemplateConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }
    delete:
      tags: [Dynamic form templates]
      operationId: deleteDynamicFormTemplate
      summary: (Admin) Xóa mềm (đặt deleted_at)
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      responses:
        "204": { description: Đã xóa mềm }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/admin/form-templates/{template_id}/publish:
    post:
      tags: [Dynamic form templates]
      operationId: publishDynamicFormTemplate
      summary: (Admin) Xuất bản bản nháp hoặc bản đang ẩn
      description: |
        Kiểm tra đầy đủ trước khi xuất bản (có mục, mục có tên và thẻ, trường tự do có tiêu đề, select có options);
        lỗi trả 422 kèm `details[{field, message}]`. Bản published/hidden khác cùng nhóm chuyển `archived`.
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DynamicTemplateId"
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "409": { $ref: "#/components/responses/DynamicFormTemplateConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/admin/form-templates/{template_id}/hide:
    post:
      tags: [Dynamic form templates]
      operationId: hideDynamicFormTemplate
      summary: (Admin) Ẩn mẫu đang xuất bản khỏi công dân
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DynamicTemplateId"
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "409": { $ref: "#/components/responses/DynamicFormTemplateConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/admin/form-templates/{template_id}/new-version:
    post:
      tags: [Dynamic form templates]
      operationId: newVersionDynamicFormTemplate
      summary: (Admin) Tạo bản nháp mới cùng nhóm (chép content)
      description: Nhóm đã có bản nháp chưa xóa thì trả lại bản đó với 200, không tạo thêm.
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DynamicTemplateId"
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "201": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/admin/form-templates/{template_id}/restore:
    post:
      tags: [Dynamic form templates]
      operationId: restoreDynamicFormTemplate
      summary: (Admin) Khôi phục bản đã xóa mềm, giữ nguyên status
      x-status: implemented
      security: [{ BearerAuth: [] }, { CookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DynamicTemplateId"
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "409": { $ref: "#/components/responses/DynamicFormTemplateConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/form-templates:
    get:
      tags: [Dynamic form templates]
      operationId: listPublishedDynamicFormTemplates
      summary: Danh sách mẫu đơn dùng chung đang xuất bản (công khai)
      description: Chỉ bản `published` chưa xóa, mỗi nhóm một bản mới nhất.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - { name: domain, in: query, schema: { $ref: "#/components/schemas/DynamicFormDomain" } }
        - { name: procedure_id, in: query, schema: { type: string, example: DD-001 } }
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateList" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/form-templates/{template_id}:
    get:
      tags: [Dynamic form templates]
      operationId: getPublishedDynamicFormTemplate
      summary: Chi tiết mẫu đơn đang xuất bản (công khai)
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DynamicTemplateId"
      responses:
        "200": { $ref: "#/components/responses/DynamicFormTemplateOne" }
        "404": { $ref: "#/components/responses/DynamicFormTemplateNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /procedures/{procedure_id}:
    get:
      tags: [Procedures]
      operationId: getProcedure
      summary: Chi tiết thủ tục
      description: |
        Thông tin đầy đủ của một thủ tục: lệ phí, thời gian xử lý, căn cứ pháp lý và
        danh sách giấy tờ cần chuẩn bị. Cơ quan tiếp nhận cụ thể do **Location Service** trả
        (dựa trên `receiving_agency_level` và vị trí người dùng).
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: procedure_id
          in: path
          required: true
          description: ID thủ tục (UUID) hoặc Mã thủ tục (HKD-001, DD-001...)
          schema: { type: string }
      responses:
        "200":
          description: Chi tiết thủ tục
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcedureDetailResponse" }
              example:
                data:
                  id: 3d6f2a90-8c1b-4f0e-b7a2-5e4d9c1a2b3c
                  code: DD-001
                  name: Đăng ký biến động quyền sử dụng đất do chuyển nhượng
                  domain: land
                  description: Thủ tục sang tên khi mua bán, chuyển nhượng quyền sử dụng đất.
                  fee: null
                  fee_note: Theo mức thu do HĐND TP.HCM quy định
                  processing_days: 10
                  submission_channels: [direct, postal, online]
                  receiving_agency_level: commune
                  legal_bases:
                    - doc_number: 31/2024/QH15
                      title: Luật Đất đai 2024
                      article_ref: Điều 133
                      source_url: https://example.gov.vn/luat-dat-dai-2024
                  requirements:
                    - id: 0b8e1f6a-1c2d-4e3f-8a9b-0c1d2e3f4a5b
                      name: Giấy chứng nhận quyền sử dụng đất (bản gốc)
                      description: null
                      is_required: true
                      copies: 1
                      document_form: original
                      form_code: null
                      note: null
                    - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      name: Hợp đồng chuyển nhượng quyền sử dụng đất đã công chứng
                      description: null
                      is_required: true
                      copies: 1
                      document_form: certified_copy
                      form_code: null
