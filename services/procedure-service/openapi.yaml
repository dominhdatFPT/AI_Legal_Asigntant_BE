        `form_data` phải khớp `GET /procedures/form-schema/{procedure_code}`, áp dụng cho cả `draft` lẫn `submitted`:
        đủ mọi ô `required` (checkbox bắt buộc phải là `true`), giá trị `select` nằm trong `options`,
