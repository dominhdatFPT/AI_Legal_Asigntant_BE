components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    CookieAuth: { type: apiKey, in: cookie, name: access_token, description: Cookie HttpOnly của hệ thống }

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    ApplicationDomain:
      name: domain
      in: query
      description: Lọc theo lĩnh vực. Bỏ trống = tất cả.
      schema: { $ref: "#/components/schemas/Domain" }
    ApplicationStatusFilter:
      name: status
      in: query
      description: Lọc theo trạng thái. Bỏ trống = tất cả.
      schema: { $ref: "#/components/schemas/ApplicationStatus" }
    ApplicationPageSize:
      name: page_size
      in: query
      description: Số hồ sơ mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    DynamicTemplateId:
      name: template_id
      in: path
      required: true
      description: id một version của mẫu đơn dùng chung. Không phải UUID → 422.
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Thiếu, sai hoặc hết hạn access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error: { code: UNAUTHORIZED, message: Bạn cần đăng nhập. }
            request_id: req-123
    Forbidden:
      description: Không đủ quyền (chỉ admin)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error: { code: FORBIDDEN, message: Bạn không có quyền thực hiện thao tác này. }
            request_id: req-123
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: query
                  message: Phải có 1–2000 ký tự, không chỉ chứa khoảng trắng.
            request_id: req-123
    InternalError:
      description: Lỗi Backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123
    DbUnavailable:
      description: Không kết nối được database thủ tục. Không bao giờ trả dữ liệu giả thay thế.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: PROCEDURE_DB_UNAVAILABLE
              message: Không kết nối được cơ sở dữ liệu thủ tục, vui lòng thử lại sau.
            request_id: req-123
    DynamicFormTemplateOne:
      description: Một version mẫu đơn dùng chung
      content:
        application/json:
          schema:
            type: object
            required: [data, error, request_id]
            properties:
              data: { $ref: "#/components/schemas/DynamicFormTemplate" }
              error: { $ref: "#/components/schemas/NoError" }
              request_id: { $ref: "#/components/schemas/RequestIdValue" }
    DynamicFormTemplateList:
      description: Danh sách mẫu đơn dùng chung (không phân trang, số mẫu ít)
      content:
        application/json:
          schema:
            type: object
            required: [data, error, request_id]
            properties:
              data:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer, minimum: 0 }
                  items: { type: array, items: { $ref: "#/components/schemas/DynamicFormTemplate" } }
              error: { $ref: "#/components/schemas/NoError" }
              request_id: { $ref: "#/components/schemas/RequestIdValue" }
    DynamicFormTemplateNotFound:
      description: Không có mẫu (hoặc đã xóa / chưa xuất bản với API công khai)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error: { code: TEMPLATE_NOT_FOUND, message: Không tìm thấy mẫu đơn. }
            request_id: req-123
    DynamicFormTemplateConflict:
      description: Sai trạng thái (`TEMPLATE_NOT_DRAFT` khi sửa bản không phải nháp, `INVALID_STATUS` cho publish/hide/restore)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error: { code: TEMPLATE_NOT_DRAFT, message: Chỉ sửa được bản nháp. Hãy tạo phiên bản mới. }
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    # ---------- Mẫu đơn dùng chung (dynamic_form_templates, database/007) ----------
    DynamicFormDomain:
      type: string
      enum: [dat_dai, ho_kinh_doanh, doanh_nghiep]
    DynamicFormStatus:
      type: string
      enum: [draft, published, hidden, archived]
    DynamicFormField:
      type: object
      required: [key, type]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]*$", example: full_name }
        label: { type: string, maxLength: 255, example: Họ và tên }
        type: { type: string, enum: [text, textarea, number, date, past_date, dob, issue_date, cccd, phone, email, select] }
        required: { type: boolean, default: true }
        autofill: { type: string, nullable: true, pattern: "^profile\\.[a-z_]+$", example: profile.full_name }
        options: { type: array, nullable: true, items: { type: string } }
    DynamicFormBlock:
      type: object
      required: [instance_id, block_key, order]
      properties:
        instance_id: { type: string, pattern: "^[a-z_]+_[0-9]+$", example: personal_info_1 }
        block_key:
          type: string
          enum: [personal_info, dob, cccd, address, phone, email, tax_code, organization, business_lines, land_parcel, receiving_agency, free_field]
        order: { type: integer, minimum: 1 }
        fields: { type: array, items: { $ref: "#/components/schemas/DynamicFormField" } }
    DynamicFormSection:
      type: object
      required: [id, order]
      properties:
        id: { type: string, pattern: "^sec_[0-9]+$", example: sec_1 }
        title: { type: string, maxLength: 255, example: I. Bên ủy quyền }
        order: { type: integer, minimum: 1 }
        blocks: { type: array, items: { $ref: "#/components/schemas/DynamicFormBlock" } }
    DynamicFormContent:
      type: object
      description: JSON mẫu do trang admin dựng (FE `form-blocks.js`). Tối đa 256 KB.
      required: [name, domain]
      properties:
        schema_version: { type: integer, enum: [1], default: 1 }
        name: { type: string, minLength: 1, maxLength: 255, example: Hợp đồng ủy quyền }
        code: { type: string, nullable: true, maxLength: 50, example: HD-UQ }
        domain: { $ref: "#/components/schemas/DynamicFormDomain" }
        procedure_id: { type: string, nullable: true, example: DD-001 }
        sections: { type: array, items: { $ref: "#/components/schemas/DynamicFormSection" } }
    DynamicFormTemplate:
      type: object
      required: [id, template_group_id, version, status, name, domain, content, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        template_group_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/DynamicFormStatus" }
        name: { type: string }
        code: { type: string, nullable: true }
        domain: { $ref: "#/components/schemas/DynamicFormDomain" }
        procedure_id: { type: string, nullable: true }
        content: { $ref: "#/components/schemas/DynamicFormContent" }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, FE dùng để xử lý (xem API_GUIDELINES mục 5)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: query }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          description: Luôn `null` khi lỗi
          nullable: true
          enum: [null]
        error: { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Hồ sơ ----------
    ApplicationStatus:
      type: string
      enum: [draft, submitted, processing, completed, cancelled]
    ApplicationSubmitRequest:
      type: object
      additionalProperties: false
      required: [procedure_code]
      properties:
        procedure_code: { type: string, maxLength: 50, example: DD-001 }
        status: { type: string, enum: [draft, submitted], default: draft }
        form_data:
          type: object
          additionalProperties: true
          description: |
            Đất: applicant_name, applicant_id_number, applicant_phone, plot_number, map_sheet_number, land_area, land_address.
            Kinh doanh: applicant_name, business_name_vn, business_type, headquarters_address, charter_capital.
        extra_data: { type: object, additionalProperties: true }
    ApplicationRecord:
      type: object
      required: [id, user_id, procedure_code, status, domain, target_table, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        procedure_code: { type: string }
        procedure_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        applicant_name: { type: string, nullable: true }
        domain: { $ref: "#/components/schemas/Domain" }
        target_table: { type: string, enum: [land_procedure_records, business_procedure_records] }
        form_data: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApplicationListItem:
      type: object
      required: [id, domain, procedure_code, procedure_name, status, applicant_name, applicant_id_number, address,
                 fee, receiving_agency_level, created_at, due_date]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: Chỉ có ở danh sách của admin }
        domain: { $ref: "#/components/schemas/Domain" }
        procedure_code: { type: string }
        procedure_name: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        applicant_name: { type: string, nullable: true }
        applicant_id_number: { type: string, nullable: true }
        address: { type: string, nullable: true, description: Địa chỉ thửa đất hoặc trụ sở kinh doanh }
        fee: { type: integer, nullable: true, minimum: 0, description: Lệ phí (đồng) của thủ tục }
        receiving_agency_level: { type: string, nullable: true, enum: [commune, district, province, null] }
        created_at: { type: string, format: date-time }
        due_date: { type: string, format: date, nullable: true, description: "Ngày nộp + processing_days (ngày lịch); null nếu thủ tục chưa có thời hạn" }
    ApplicationListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ApplicationListItem" } }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Thủ tục ----------
    Domain:
      type: string
      description: "Lĩnh vực: `land` = đất đai, `business` = hộ kinh doanh"
      enum: [land, business]

    ProcedureSummary:
      type: object
      description: Thông tin rút gọn, dùng trong danh sách và kết quả tìm kiếm
      required: [id, code, name]
      properties:
        id:
          type: string
          description: UUID. Dữ liệu mẫu hiện tại tạm dùng `HKD-001`.
          example: 7c0e5b0e-2f4b-4c3e-9a51-1f0a6e2b9d10
        code:
          type: string
          description: Mã nghiệp vụ của thủ tục
          example: HKD-001
        name:
          type: string
          example: Đăng ký thành lập hộ kinh doanh
        domain:
          $ref: "#/components/schemas/Domain"

    Requirement:
      type: object
      description: Một giấy tờ cần chuẩn bị cho thủ tục
      required: [id, name, is_required, copies, document_form]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Giấy chứng nhận quyền sử dụng đất (bản gốc) }
        description: { type: string, nullable: true }
        is_required:
          type: boolean
          description: "`false` = chỉ cần khi rơi vào trường hợp ghi ở `note`"
        copies: { type: integer, minimum: 1, example: 1 }
        document_form:
          type: string
          description: "`original` = bản chính, `copy` = bản sao, `certified_copy` = bản sao có chứng thực"
          enum: [original, copy, certified_copy]
        form_code:
          type: string
          nullable: true
          description: Số hiệu mẫu tờ khai nếu có (lấy từ thủ tục TP.HCM đang áp dụng)
        note: { type: string, nullable: true }

    LegalBasis:
      type: object
      description: Văn bản pháp luật làm căn cứ cho thủ tục
      required: [doc_number, title]
      properties:
        doc_number: { type: string, example: 31/2024/QH15 }
        title: { type: string, example: Luật Đất đai 2024 }
        article_ref: { type: string, nullable: true, example: Điều 133 }
        source_url: { type: string, format: uri, nullable: true }

    ProcedureDetail:
      allOf:
        - $ref: "#/components/schemas/ProcedureSummary"
        - type: object
          required: [domain, submission_channels, receiving_agency_level, legal_bases, requirements, updated_at]
          properties:
            description: { type: string, nullable: true }
            fee:
              type: integer
              nullable: true
              minimum: 0
              description: Lệ phí (đồng). `null` khi mức thu phụ thuộc quy định địa phương, xem `fee_note`.
            fee_note: { type: string, nullable: true }
            processing_days:
              type: integer
              nullable: true
              minimum: 0
              description: Thời gian giải quyết (ngày làm việc)
            submission_channels:
              type: array
              description: "Cách nộp: `direct` = trực tiếp, `postal` = bưu chính, `online` = trực tuyến"
              items: { type: string, enum: [direct, postal, online] }
            receiving_agency_level:
              type: string
              description: "Cấp tiếp nhận: `commune` = xã/phường, `province` = tỉnh/thành phố"
              enum: [commune, province]
            legal_bases:
              type: array
              items: { $ref: "#/components/schemas/LegalBasis" }
            requirements:
              type: array
              items: { $ref: "#/components/schemas/Requirement" }
            effective_from:
              type: string
              format: date
              nullable: true
              description: Ngày thủ tục bắt đầu áp dụng
            updated_at: { type: string, format: date-time }

    ProcedureSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: Câu người dùng nhập. Khoảng trắng đầu/cuối được cắt bỏ; không được chỉ chứa khoảng trắng.
          example: đăng ký hộ kinh doanh

    # ---------- Kết quả từng API ----------
    ProcedureListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ProcedureSummary" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ProcedureSearchResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ProcedureSummary" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ProcedureDetailResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/ProcedureDetail" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }
