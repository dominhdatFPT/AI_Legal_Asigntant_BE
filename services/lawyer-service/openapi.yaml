openapi: 3.0.3

info:
  title: Lawyer Service API
  version: 0.2.0
  description: |
    Hồ sơ xin làm luật sư (trang `lawyer-registration` của FE) và tab duyệt luật sư của admin.

    Luồng: người dùng `citizen` đã khai CCCD gửi hồ sơ (`POST /lawyers`) → `pending` → admin duyệt
    (`approved`, tài khoản đổi sang vai trò `lawyer`) hoặc từ chối (`rejected`, kèm lý do).
    Bị từ chối thì sửa và gửi lại bằng `PUT /lawyers/me` (sau thời gian chờ `LAWYER_REAPPLY_COOLDOWN_HOURS`).
    Giấy tờ (thẻ luật sư, chứng chỉ hành nghề...) tải lên Document Service trước, ở đây chỉ gửi `document_id`.
    Chưa có Notification: kết quả duyệt/từ chối chỉ xem qua `GET /lawyers/me`.
    Operation `x-status: planned` là thiết kế, chưa có code.
  x-owner: "Người 1 · Đạt"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://lawyer-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Public
    description: Thông tin công khai (lĩnh vực, danh sách luật sư)
  - name: My Lawyer Profile
    description: Người dùng gửi / xem / gửi lại hồ sơ xin làm luật sư của mình
  - name: Admin
    description: Duyệt hồ sơ luật sư (chỉ vai trò `admin`)
  - name: Internal
    description: |
      Chỉ service khác gọi trong mạng Docker, header `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.

paths:
  /lawyers/health:
    get:
      tags: [Health]
      operationId: getLawyerHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: lawyer-service }

  # ---------------------------------------------------------------- Public
  /lawyers/specializations:
    get:
      tags: [Public]
      operationId: listSpecializations
      summary: Danh sách lĩnh vực tư vấn
      description: Không cần đăng nhập. Dùng cho form hồ sơ luật sư.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Danh sách lĩnh vực
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecializationListResponse" }
              example:
                data:
                  items:
                    - code: land
                      name: Đất đai
                    - code: business
                      name: Hộ kinh doanh
                error: null
                request_id: req-123
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /lawyers:
    get:
      tags: [Public]
      operationId: listLawyers
      summary: Danh sách luật sư
      description: |
        Chỉ trả luật sư đang hành nghề (hồ sơ `active`) của tài khoản không bị khóa.
        Tên, ảnh đại diện lấy từ User Service `POST /internal/v1/users/search` (kèm `X-Internal-Token`).
        Lọc `is_online=true` để xem ai đang online.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: specialization
          in: query
          description: Lọc theo mã lĩnh vực. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/SpecializationCode" }
        - name: is_online
          in: query
          description: "`true` = chỉ luật sư đang online. Bỏ trống = tất cả."
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách luật sư (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerPublicListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }
    post:
      tags: [My Lawyer Profile]
      operationId: submitLawyerApplication
      summary: Gửi hồ sơ xin làm luật sư
      description: |
        Chỉ vai trò `citizen`, tài khoản không bị khóa và đã khai CCCD ở User Service (họ tên trên CCCD được lưu
        vào `full_name` cho admin xem). Hồ sơ vào hàng chờ duyệt ngay (`pending`).
        Mỗi người chỉ gửi một lần; bị từ chối thì dùng `PUT /lawyers/me`.
        `credentials` bắt buộc có `the_luat_su` và `chung_chi_hanh_nghe`. Lawyer Service đọc từng giấy tờ ở
        Document Service bằng chính token của người gửi; giấy tờ không tồn tại / không thuộc người gửi → 422
        (`details[].field = credentials`).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerSubmitRequest" }
            example:
              bar_card_number: "12345/TP"
              law_firm: Văn phòng Luật sư ABC
              years_experience: 8
              bio: Chuyên tư vấn tranh chấp đất đai.
              specialization_codes: [land]
              credentials:
                - document_id: 2c4e6a8b-0d1f-4a3b-9c5d-7e9f1a3b5c7d
                  type: the_luat_su
                - document_id: 3d5f7b9c-1e2a-4b4c-8d6e-8f0a2b4c6d8e
                  type: chung_chi_hanh_nghe
      responses:
        "201":
          description: Đã gửi hồ sơ, chờ admin duyệt
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Đã gửi hồ sơ, trùng số thẻ hành nghề, hoặc chưa khai CCCD
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                da_co_ho_so:
                  summary: Người dùng đã gửi hồ sơ / đã là luật sư
                  value:
                    data: null
                    error:
                      code: LAWYER_PROFILE_EXISTS
                      message: Bạn đã gửi hồ sơ luật sư trước đó.
                    request_id: req-123
                trung_so_the:
                  summary: Trùng số thẻ hành nghề
                  value:
                    data: null
                    error:
                      code: BAR_CARD_NUMBER_TAKEN
                      message: Số thẻ hành nghề này đã được đăng ký.
                    request_id: req-124
                chua_khai_cccd:
                  summary: Chưa khai hồ sơ cá nhân (CCCD)
                  value:
                    data: null
                    error:
                      code: CITIZEN_PROFILE_REQUIRED
                      message: Bạn cần khai hồ sơ cá nhân (CCCD) trước khi gửi đơn.
                    request_id: req-125
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /lawyers/{lawyer_id}:
    get:
      tags: [Public]
      operationId: getLawyer
      summary: Chi tiết một luật sư
      description: |
        Chỉ xem được luật sư đang hành nghề. Hồ sơ chưa duyệt / bị ẩn trả 404 như không tồn tại.
        Tên, ảnh đại diện lấy từ User Service như `GET /lawyers`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/LawyerId"
      responses:
        "200":
          description: Thông tin công khai của luật sư
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerPublicResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LawyerNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  # ---------------------------------------------------------------- My lawyer profile
  /lawyers/me:
    get:
      tags: [My Lawyer Profile]
      operationId: getMyLawyerProfile
      summary: Xem hồ sơ luật sư của tôi
      description: |
        Hồ sơ gửi gần nhất, kể cả khi đang `pending` hoặc `rejected` (kèm `rejected_reason`).
        Chưa từng gửi → 404 `LAWYER_NOT_FOUND` (FE hiện form gửi hồ sơ).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Hồ sơ của tôi
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileResponse" }
              example:
                data:
                  id: 7d6c5b4a-3f2e-4d1c-9b8a-7f6e5d4c3b2a
                  user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                  full_name: Nguyễn Văn A
                  approval_status: rejected
                  rejected_reason: Ảnh thẻ hành nghề bị mờ, vui lòng tải lại.
                  bar_card_number: "12345/TP"
                  law_firm: Văn phòng Luật sư ABC
                  years_experience: 8
                  bio: Chuyên tư vấn tranh chấp đất đai.
                  specializations:
                    - code: land
                      name: Đất đai
                  credentials:
                    - document_id: 2c4e6a8b-0d1f-4a3b-9c5d-7e9f1a3b5c7d
                      type: the_luat_su
                    - document_id: 3d5f7b9c-1e2a-4b4c-8d6e-8f0a2b4c6d8e
                      type: chung_chi_hanh_nghe
                  reviewed_at: "2026-10-06T03:00:00Z"
                  created_at: "2026-10-05T09:00:00Z"
                  updated_at: "2026-10-06T03:00:00Z"
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LawyerNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }
    put:
      tags: [My Lawyer Profile]
      operationId: updateMyLawyerProfile
      summary: Gửi lại hồ sơ sau khi bị từ chối
      description: |
        Chỉ khi hồ sơ gần nhất đang `rejected` và đã hết thời gian chờ sau lần từ chối.
        Gửi lại toàn bộ hồ sơ (cùng body với `POST /lawyers`), kiểm tra như lần đầu; tạo hồ sơ mới `pending`
        (`id` mới), hồ sơ cũ giữ làm lịch sử.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerSubmitRequest" }
      responses:
        "200":
          description: Hồ sơ mới, chờ admin duyệt
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LawyerNotFound" }
        "409":
          description: Hồ sơ không ở trạng thái bị từ chối, chưa hết thời gian chờ, trùng số thẻ hoặc chưa khai CCCD
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                khong_sua_duoc:
                  summary: Hồ sơ đang `pending` / `approved`
                  value:
                    data: null
                    error:
                      code: APPLICATION_NOT_EDITABLE
                      message: Chỉ gửi lại được hồ sơ đã bị từ chối.
                    request_id: req-123
                cho_gui_lai:
                  summary: Chưa hết thời gian chờ sau lần bị từ chối
                  value:
                    data: null
                    error:
                      code: REAPPLY_COOLDOWN
                      message: Hồ sơ trước của bạn vừa bị từ chối, vui lòng chờ đến 10:00 06/10/2026 rồi gửi lại.
                    request_id: req-124
                trung_so_the:
                  summary: Trùng số thẻ hành nghề
                  value:
                    data: null
                    error:
                      code: BAR_CARD_NUMBER_TAKEN
                      message: Số thẻ hành nghề này đã được đăng ký.
                    request_id: req-125
                da_co_ho_so:
                  summary: Đã là luật sư
                  value:
                    data: null
                    error:
                      code: LAWYER_PROFILE_EXISTS
                      message: Bạn đã gửi hồ sơ luật sư trước đó.
                    request_id: req-126
                chua_khai_cccd:
                  summary: Chưa khai hồ sơ cá nhân (CCCD)
                  value:
                    data: null
                    error:
                      code: CITIZEN_PROFILE_REQUIRED
                      message: Bạn cần khai hồ sơ cá nhân (CCCD) trước khi gửi đơn.
                    request_id: req-127
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /lawyers/me/status:
    put:
      tags: [My Lawyer Profile]
      operationId: setMyOnlineStatus
      summary: Bật/tắt trạng thái Online
      description: |
        Chỉ luật sư đang hành nghề. Khi Online, luật sư thấy phòng chờ và nhận được yêu cầu tư vấn mới.
        Sẽ làm bằng WebSocket cùng Consultation Service.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnlineStatusRequest" }
            example: { is_online: true }
      responses:
        "200":
          description: Trạng thái sau khi cập nhật
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineStatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /lawyers/me/stats:
    get:
      tags: [My Lawyer Profile]
      operationId: getMyLawyerStats
      summary: Thống kê cơ bản của tôi
      description: |
        Chỉ luật sư đang hành nghề. Số liệu lấy từ Consultation Service `GET /consultations/stats`
        (chuyển tiếp JWT của luật sư); Lawyer Service không tự lưu các con số này.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Thống kê
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerStatsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  # ---------------------------------------------------------------- Admin
  /lawyers/applications:
    get:
      tags: [Admin]
      operationId: listLawyerApplications
      summary: Danh sách hồ sơ luật sư cần duyệt
      description: Chỉ `admin`. Mặc định trả hồ sơ `pending`, gửi sớm nhất lên trước.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: approval_status
          in: query
          description: Lọc theo trạng thái duyệt.
          schema:
            allOf:
              - $ref: "#/components/schemas/ApprovalStatus"
            default: pending
        - name: order
          in: query
          description: Sắp theo thời gian gửi hồ sơ (`asc` = cũ nhất trước).
          schema: { type: string, enum: [asc, desc], default: asc }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách hồ sơ (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /lawyers/{lawyer_id}/approve:
    post:
      tags: [Admin]
      operationId: approveLawyerApplication
      summary: Duyệt hồ sơ luật sư
      description: |
        Chỉ `admin`, chỉ duyệt được hồ sơ `pending`.
        Gọi User Service `PUT /internal/v1/users/{user_id}/role` (kèm `X-Internal-Token`) đổi vai trò sang
        `lawyer`; User Service lỗi thì hồ sơ vẫn `pending`. Tài khoản người gửi không còn hợp lệ (đã xóa,
        không đổi được vai trò) → 409 `APPLICANT_UNAVAILABLE`, admin nên từ chối hồ sơ.
        Người được duyệt phải đăng nhập lại (hoặc refresh token) để token có vai trò `lawyer`.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApplicationLawyerId"
      responses:
        "200":
          description: Hồ sơ sau khi duyệt (`approval_status = approved`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
        "409":
          description: Hồ sơ đã xử lý, trùng số thẻ với luật sư khác, hoặc tài khoản người gửi không còn hợp lệ
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                da_xu_ly:
                  summary: Hồ sơ không còn `pending`
                  value:
                    data: null
                    error:
                      code: APPLICATION_NOT_PENDING
                      message: Đơn này đã được xử lý trước đó.
                    request_id: req-123
                trung_so_the:
                  summary: Số thẻ đã thuộc luật sư khác
                  value:
                    data: null
                    error:
                      code: BAR_CARD_NUMBER_TAKEN
                      message: Số thẻ hành nghề này đã được đăng ký.
                    request_id: req-124
                nguoi_gui_khong_hop_le:
                  summary: Tài khoản người gửi đã xóa / không đổi được vai trò
                  value:
                    data: null
                    error:
                      code: APPLICANT_UNAVAILABLE
                      message: Tài khoản người gửi đơn không còn hợp lệ, hãy từ chối đơn này.
                    request_id: req-125
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /lawyers/{lawyer_id}/reject:
    post:
      tags: [Admin]
      operationId: rejectLawyerApplication
      summary: Từ chối hồ sơ luật sư
      description: Chỉ `admin`, chỉ từ chối được hồ sơ `pending`. Bắt buộc ghi lý do; người gửi thấy ở `rejected_reason`.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApplicationLawyerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectRequest" }
            example: { reason: Ảnh thẻ hành nghề bị mờ, vui lòng tải lại. }
      responses:
        "200":
          description: Hồ sơ sau khi từ chối (`approval_status = rejected`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
        "409": { $ref: "#/components/responses/NotPending" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /lawyers/{lawyer_id}/credentials/{document_id}:
    get:
      tags: [Admin]
      operationId: viewLawyerCredential
      summary: Admin mở giấy tờ đính kèm hồ sơ luật sư
      description: |
        Chỉ `admin`. Chỉ mở được giấy tờ có trong `credentials` của hồ sơ. Lawyer Service đọc file từ Document Service
        (API nội bộ, vẫn kiểm tra chủ sở hữu) và trả nguyên file với `Content-Disposition: inline` để xem ngay trên
        trình duyệt. File chưa quét virus xong → 409 `FILE_NOT_READY`; bị chặn → 409 `FILE_REJECTED`.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApplicationLawyerId"
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Nội dung file (PDF / JPG / PNG)
          headers:
            Content-Disposition: { schema: { type: string }, example: "inline; filename=\"the.pdf\"" }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`APPLICATION_NOT_FOUND` hoặc `CREDENTIAL_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "`FILE_NOT_READY` (chưa quét virus xong) hoặc `FILE_REJECTED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  # ---------------------------------------------------------------- Internal
  /internal/v1/lawyers/{user_id}/status:
    get:
      tags: [Internal]
      operationId: getLawyerStatusInternal
      summary: Trạng thái luật sư của một người (cho Consultation Service)
      description: |
        Header `X-Internal-Token`. Luôn trả 200 (kể cả người chưa từng có hồ sơ: `has_profile = false`).
        `can_practice` = có hồ sơ, không bị ẩn và đủ (`is_complete`). Khóa tài khoản / vai trò trong token vẫn do
        User Service quyết định; Consultation Service nên kiểm tra cả hai.
        Hồ sơ `incomplete` thì hỏi User Service `has_citizen_profile` (có thể 502/503/504).
      x-status: implemented
      servers:
        - url: http://lawyer-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Trạng thái
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerStatusResponse" }
              examples:
                du_dieu_kien:
                  summary: Luật sư đủ hồ sơ
                  value:
                    data:
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      has_profile: true
                      profile_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      profile_status: active
                      is_hidden: false
                      is_complete: true
                      missing_requirements: []
                      can_practice: true
                    error: null
                    request_id: req-123
                chua_co_ho_so:
                  summary: Người chưa từng là luật sư
                  value:
                    data:
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      has_profile: false
                      profile_id: null
                      profile_status: null
                      is_hidden: false
                      is_complete: false
                      missing_requirements: []
                      can_practice: false
                    error: null
                    request_id: req-124
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /internal/v1/lawyers/{user_id}/hide:
    post:
      tags: [Internal]
      operationId: hideLawyerProfileInternal
      summary: Ẩn hồ sơ luật sư (User Service gọi khi hạ vai trò / xóa tài khoản)
      description: |
        Header `X-Internal-Token`. User Service gọi **trước** khi lưu việc hạ vai trò `lawyer` → `citizen` hoặc
        xóa tài khoản luật sư; gọi lỗi thì User Service không đổi gì và trả 503.
        Hồ sơ → `hidden` (không xóa), ghi `hidden_at`, `hidden_reason`, tắt `is_online`. Hồ sơ đang chờ duyệt
        của người đó chuyển `withdrawn`.
        Gọi lại nhiều lần an toàn (idempotent). Không có hồ sơ vẫn trả 200 với `profile_found = false`.
        Đóng các cuộc tư vấn đang mở do User Service gọi Consultation Service (TODO ở
        `services/user-service/app/clients/consultation_client.py`).
      x-status: implemented
      servers:
        - url: http://lawyer-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HideProfileRequest" }
            example: { reason: role_changed }
      responses:
        "200":
          description: Đã ẩn (hoặc không có gì để ẩn)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HideProfileResponse" }
              example:
                data:
                  user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                  profile_found: true
                  is_hidden: true
                  withdrawn_application_ids: [7d6c5b4a-3f2e-4d1c-9b8a-7f6e5d4c3b2a]
                error: null
                request_id: req-123
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `access_token` lấy từ User Service (`POST /users/auth/firebase` hoặc `POST /users/auth/refresh`).
        Trình duyệt có thể gửi bằng cookie HttpOnly thay cho header.
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Giá trị `INTERNAL_TOKEN` trong `.env` (so bằng `hmac.compare_digest`), chỉ dùng cho `/internal/v1/...`.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    LawyerId:
      name: lawyer_id
      in: path
      required: true
      description: ID luật sư (UUID, `id` trong `LawyerPublic`)
      schema: { type: string, format: uuid }
    ApplicationLawyerId:
      name: lawyer_id
      in: path
      required: true
      description: ID hồ sơ cần duyệt (UUID, trường `id` của `LawyerProfile` trong `GET /lawyers/applications`)
      schema: { type: string, format: uuid }
    UserIdPath:
      name: user_id
      in: path
      required: true
      description: ID tài khoản ở User Service
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  responses:
    BadRequest:
      description: Body không phải JSON hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: BAD_REQUEST
              message: JSON gửi lên không đọc được.
            request_id: req-123
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ (kể cả ID trên đường dẫn không phải UUID)
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: credentials
                  message: Giấy tờ không tồn tại hoặc không thuộc về bạn.
            request_id: req-123
    Unauthorized:
      description: Thiếu token, token sai hoặc đã hết hạn (API nội bộ - sai `X-Internal-Token`)
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            chua_dang_nhap:
              summary: Thiếu / sai token
              value:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: Bạn cần đăng nhập để tiếp tục.
                request_id: req-123
            het_han:
              summary: Token hết hạn (FE gọi refresh rồi thử lại)
              value:
                data: null
                error:
                  code: TOKEN_EXPIRED
                  message: Phiên đăng nhập đã hết hạn.
                request_id: req-124
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền (sai vai trò) hoặc tài khoản bị khóa
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            sai_vai_tro:
              summary: Sai vai trò
              value:
                data: null
                error:
                  code: FORBIDDEN
                  message: Bạn không có quyền thực hiện thao tác này.
                request_id: req-123
            bi_khoa:
              summary: Tài khoản bị khóa (khi gửi hồ sơ)
              value:
                data: null
                error:
                  code: ACCOUNT_LOCKED
                  message: Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.
                request_id: req-124
    LawyerNotFound:
      description: Không có hồ sơ luật sư phù hợp
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_NOT_FOUND
              message: Không tìm thấy hồ sơ luật sư.
            request_id: req-123
    ApplicationNotFound:
      description: Không có hồ sơ với ID này
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: APPLICATION_NOT_FOUND
              message: Không tìm thấy hồ sơ xin làm luật sư.
            request_id: req-123
    NotPending:
      description: Hồ sơ không ở trạng thái chờ duyệt
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: APPLICATION_NOT_PENDING
              message: Đơn này đã được xử lý trước đó.
            request_id: req-123
    ServiceBadResponse:
      description: Service phụ trả lỗi 5xx hoặc dữ liệu sai cấu trúc
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            user:
              summary: User Service trả lỗi
              value:
                data: null
                error:
                  code: USER_BAD_RESPONSE
                  message: Hệ thống tài khoản đang gặp lỗi, vui lòng thử lại sau.
                request_id: req-123
            document:
              summary: Document Service trả lỗi
              value:
                data: null
                error:
                  code: DOCUMENT_BAD_RESPONSE
                  message: Hệ thống giấy tờ đang gặp lỗi, vui lòng thử lại sau.
                request_id: req-124
    ServiceUnavailable:
      description: Không kết nối được service phụ hoặc Lawyer DB
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            user:
              summary: User Service không phản hồi
              value:
                data: null
                error:
                  code: USER_UNAVAILABLE
                  message: Hệ thống tài khoản tạm thời không phản hồi, vui lòng thử lại sau.
                request_id: req-123
            document:
              summary: Document Service không phản hồi
              value:
                data: null
                error:
                  code: DOCUMENT_UNAVAILABLE
                  message: Hệ thống giấy tờ tạm thời không phản hồi, vui lòng thử lại sau.
                request_id: req-124
            db:
              summary: Lawyer DB không kết nối được
              value:
                data: null
                error:
                  code: LAWYER_DB_UNAVAILABLE
                  message: Hệ thống luật sư tạm thời không truy cập được dữ liệu, vui lòng thử lại sau.
                request_id: req-125
    DbUnavailable:
      description: Lawyer DB không kết nối được
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_DB_UNAVAILABLE
              message: Hệ thống luật sư tạm thời không truy cập được dữ liệu, vui lòng thử lại sau.
            request_id: req-123
    ServiceTimeout:
      description: Service phụ quá thời gian chờ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            user:
              summary: User Service quá chậm
              value:
                data: null
                error:
                  code: USER_TIMEOUT
                  message: Hệ thống tài khoản phản hồi quá chậm, vui lòng thử lại sau.
                request_id: req-123
            document:
              summary: Document Service quá chậm
              value:
                data: null
                error:
                  code: DOCUMENT_TIMEOUT
                  message: Hệ thống giấy tờ phản hồi quá chậm, vui lòng thử lại sau.
                request_id: req-124
    InternalError:
      description: Lỗi Backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    NullValue:
      description: Giá trị `null` (dùng trong `anyOf` cho trường có thể rỗng)
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, FE dùng để xử lý (xem API_GUIDELINES mục 5)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: specialization_codes }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          description: Luôn `null` khi lỗi
          nullable: true
          enum: [null]
        error: { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Enum ----------
    SpecializationCode:
      type: string
      description: "`land` = Đất đai, `business` = Hộ kinh doanh"
      enum: [land, business]

    ApprovalStatus:
      type: string
      description: "`pending` = chờ duyệt, `approved` = đã duyệt, `rejected` = bị từ chối"
      enum: [pending, approved, rejected]

    CredentialType:
      type: string
      description: |
        Loại giấy tờ theo các ô tải lên ở trang `lawyer-registration`: `the_luat_su` = thẻ luật sư,
        `chung_chi_hanh_nghe` = chứng chỉ hành nghề, `bang_cu_nhan` = bằng cử nhân luật, `khac` = khác.
      enum: [the_luat_su, chung_chi_hanh_nghe, bang_cu_nhan, khac]

    ProfileStatus:
      type: string
      description: |
        Trạng thái hồ sơ hành nghề (chỉ dùng ở API nội bộ): `incomplete` = chưa đủ, `active` = đang hiệu lực,
        `hidden` = bị ẩn do hạ vai trò hoặc xóa tài khoản
      enum: [incomplete, active, hidden]

    MissingRequirement:
      type: string
      description: "Điều kiện còn thiếu để hồ sơ đủ"
      enum: [citizen_profile, bar_card_number, specializations]

    # ---------- Luật sư ----------
    Specialization:
      type: object
      required: [code, name]
      properties:
        code: { $ref: "#/components/schemas/SpecializationCode" }
        name: { type: string, example: Đất đai }

    Credential:
      type: object
      additionalProperties: false
      required: [document_id, type]
      properties:
        document_id:
          type: string
          format: uuid
          description: ID giấy tờ trong Document Service (người gửi tải lên trước)
        type: { $ref: "#/components/schemas/CredentialType" }

    LawyerProfile:
      type: object
      description: |
        Một hồ sơ xin làm luật sư; chỉ chủ hồ sơ và admin xem được. `id` là mã hồ sơ, dùng cho
        `POST /lawyers/{lawyer_id}/approve | reject` (gửi lại sau khi bị từ chối sẽ có `id` mới).
      additionalProperties: false
      required: [id, user_id, full_name, approval_status, rejected_reason, bar_card_number, law_firm,
                 years_experience, bio, specializations, credentials, reviewed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        full_name:
          type: string
          nullable: true
          description: Họ tên trên CCCD (lấy từ User Service lúc gửi hồ sơ)
        approval_status: { $ref: "#/components/schemas/ApprovalStatus" }
        rejected_reason:
          type: string
          nullable: true
          description: Chỉ có khi `approval_status` = `rejected`
        bar_card_number: { type: string, example: "12345/TP" }
        law_firm: { type: string, nullable: true }
        years_experience: { type: integer, minimum: 0, nullable: true }
        bio: { type: string, nullable: true }
        specializations:
          type: array
          items: { $ref: "#/components/schemas/Specialization" }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/Credential" }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, description: Thời điểm gửi hồ sơ }
        updated_at: { type: string, format: date-time, nullable: true }

    LawyerPublic:
      type: object
      description: Thông tin công khai, người dân xem được (dùng cho API planned)
      required: [id, user_id, full_name, avatar_url, law_firm, years_experience, bio, specializations, is_online]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        full_name:
          type: string
          nullable: true
          description: Lấy từ User Service
        avatar_url: { type: string, format: uri, nullable: true }
        law_firm: { type: string, nullable: true }
        years_experience: { type: integer, minimum: 0, nullable: true }
        bio: { type: string, nullable: true }
        specializations:
          type: array
          items: { $ref: "#/components/schemas/Specialization" }
        is_online: { type: boolean }

    LawyerStats:
      type: object
      required: [accepted_count, in_progress_count, closed_count]
      properties:
        accepted_count: { type: integer, minimum: 0, description: Tổng số yêu cầu đã nhận }
        in_progress_count: { type: integer, minimum: 0, description: Số cuộc đang tư vấn }
        closed_count: { type: integer, minimum: 0, description: Số cuộc đã đóng }

    LawyerStatus:
      type: object
      required: [user_id, has_profile, profile_id, profile_status, is_hidden, is_complete, missing_requirements,
                 can_practice]
      properties:
        user_id: { type: string, format: uuid }
        has_profile: { type: boolean }
        profile_id: { type: string, format: uuid, nullable: true }
        profile_status:
          anyOf:
            - $ref: "#/components/schemas/ProfileStatus"
            - $ref: "#/components/schemas/NullValue"
        is_hidden: { type: boolean }
        is_complete: { type: boolean }
        missing_requirements:
          type: array
          items: { $ref: "#/components/schemas/MissingRequirement" }
        can_practice: { type: boolean, description: Được dùng chức năng luật sư (nhận tư vấn...) }

    # ---------- Body gửi lên ----------
    LawyerSubmitRequest:
      type: object
      additionalProperties: false
      required: [bar_card_number, specialization_codes, credentials]
      properties:
        bar_card_number:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
          description: Số thẻ hành nghề luật sư (bỏ khoảng trắng hai đầu)
          example: "12345/TP"
        law_firm:
          type: string
          maxLength: 255
          nullable: true
          description: Chuỗi rỗng / chỉ khoảng trắng được coi là `null`
        years_experience: { type: integer, minimum: 0, maximum: 70, nullable: true }
        bio:
          type: string
          maxLength: 2000
          nullable: true
          description: Chuỗi rỗng / chỉ khoảng trắng được coi là `null`
        specialization_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/SpecializationCode" }
          description: Mã lĩnh vực, lấy từ `GET /lawyers/specializations`
        credentials:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Không trùng `document_id`; bắt buộc có ít nhất một `the_luat_su` và một `chung_chi_hanh_nghe`.
          items: { $ref: "#/components/schemas/Credential" }

    RejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: Lý do từ chối, người gửi hồ sơ sẽ thấy câu này

    OnlineStatusRequest:
      type: object
      required: [is_online]
      properties:
        is_online: { type: boolean }

    HideProfileRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [role_changed, deleted]

    # ---------- Kết quả từng API ----------
    SpecializationListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Specialization" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerProfileResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerProfile" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerProfileListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/LawyerProfile" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerPublicResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerPublic" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerPublicListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/LawyerPublic" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    OnlineStatusResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [is_online]
          properties:
            is_online: { type: boolean }
            last_seen_at: { type: string, format: date-time, nullable: true }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerStatsResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerStats" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerStatusResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerStatus" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    HideProfileResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [user_id, profile_found, is_hidden, withdrawn_application_ids]
          properties:
            user_id: { type: string, format: uuid }
            profile_found: { type: boolean }
            is_hidden: { type: boolean }
            withdrawn_application_ids:
              type: array
              items: { type: string, format: uuid }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }
