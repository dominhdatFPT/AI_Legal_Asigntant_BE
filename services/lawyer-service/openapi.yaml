  /lawyers/me/applications/{application_id}/submit:
    post:
      tags: [My Applications]
      operationId: submitMyLawyerApplication
      summary: Gửi đơn nháp cho admin duyệt
      description: |
        Chỉ đơn `draft` → `pending`, ghi `submitted_at`.
        Điều kiện:
        - Đã khai CCCD (User Service `GET /internal/v1/users/{id}/status`, `has_citizen_profile`) → không thì
          409 `CITIZEN_PROFILE_REQUIRED`. Tài khoản bị khóa → 403 `ACCOUNT_LOCKED`.
        - Đủ trường: `new` cần `bar_card_number`, ≥ 1 `specialization_codes`, `card_document_id`;
          `card_change` cần `card_document_id` (và `bar_card_number` nếu đổi số). Thiếu → 422 kèm `details`.
        - Số thẻ không trùng hồ sơ đang hoạt động / đơn đang chờ của người khác → 409 `BAR_CARD_NUMBER_TAKEN`.
        - Đơn gần nhất bị từ chối chưa quá `LAWYER_REAPPLY_COOLDOWN_HOURS` giờ (mặc định 24) →
          409 `REAPPLY_COOLDOWN`; thời điểm được gửi lại xem ở `can_reapply_at` của đơn bị từ chối.
        Khi gửi, lưu `applicant_full_name` lấy từ hồ sơ CCCD (User Service `GET /internal/v1/users/{id}/citizen-profile`)
        để admin xem danh sách.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Đơn sau khi gửi (`pending`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
        "409":
          description: Không đủ điều kiện gửi
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                chua_khai_cccd:
                  summary: Chưa khai CCCD
                  value:
                    data: null
                    error:
                      code: CITIZEN_PROFILE_REQUIRED
                      message: Bạn cần khai hồ sơ cá nhân (CCCD) trước khi gửi đơn.
                    request_id: req-123
                cho_gui_lai:
                  summary: Đang trong thời gian chờ sau khi bị từ chối
                  value:
                    data: null
                    error:
                      code: REAPPLY_COOLDOWN
                      message: Đơn trước của bạn vừa bị từ chối, vui lòng chờ 24 giờ rồi gửi lại.
                    request_id: req-124
                khong_phai_nhap:
                  summary: Đơn không ở trạng thái nháp
                  value:
                    data: null
                    error:
                      code: APPLICATION_NOT_DRAFT
                      message: Chỉ gửi được đơn đang ở trạng thái nháp.
                    request_id: req-125
                trung_so_the:
                  summary: Trùng số thẻ
                  value:
                    data: null
                    error:
                      code: BAR_CARD_NUMBER_TAKEN
                      message: Số thẻ hành nghề này đã được đăng ký.
                    request_id: req-126
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

