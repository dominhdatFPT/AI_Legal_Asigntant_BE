  /lawyers/applications/{application_id}/approve:
    post:
      tags: [Admin]
      operationId: approveLawyerApplication
      summary: Duyệt đơn
      description: |
        Chỉ `admin`, chỉ đơn `pending`. Kiểm tra lại số thẻ không trùng (409).
        - `new`: gọi User Service `PUT /internal/v1/users/{id}/role` đổi vai trò sang `lawyer` **trước**
          (User Service thu hồi mọi refresh token → lần refresh sau trả 401 `ROLE_CHANGED_RELOGIN`).
          User Service lỗi 5xx/timeout → 502/503/504, đơn vẫn `pending`. User Service trả 404/409 (tài khoản đã
          xóa, là admin...) → 409 `APPLICANT_UNAVAILABLE`. Sau đó tạo hồ sơ (hoặc dùng lại hồ sơ `hidden`),
          nguồn `self_applied`, ghi đè toàn bộ trường từ đơn, trạng thái `active`.
          Nếu lưu DB lỗi sau khi đã đổi vai trò: admin bấm duyệt lại (đổi vai trò lặp lại an toàn).
        - `card_change`: không gọi User Service; ghi đè `bar_card_number` (nếu có) và ảnh thẻ + JSON OCR lên hồ sơ.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Đơn sau khi duyệt
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
        "409":
          description: Đơn không còn chờ duyệt, số thẻ đã được dùng, hoặc người gửi không còn hợp lệ
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                khong_cho_duyet:
                  summary: Đơn đã được xử lý
                  value:
                    data: null
                    error:
                      code: APPLICATION_NOT_PENDING
                      message: Đơn này đã được xử lý trước đó.
                    request_id: req-123
                nguoi_gui:
                  summary: Tài khoản người gửi đã bị xóa
                  value:
                    data: null
                    error:
                      code: APPLICANT_UNAVAILABLE
                      message: Tài khoản người gửi đơn không còn hợp lệ, hãy từ chối đơn này.
                    request_id: req-124
                trung_so_the:
                  summary: Trùng số thẻ
                  value:
                    data: null
                    error:
                      code: BAR_CARD_NUMBER_TAKEN
                      message: Số thẻ hành nghề này đã được đăng ký.
                    request_id: req-125
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /lawyers/applications/{application_id}/reject:
    post:
      tags: [Admin]
      operationId: rejectLawyerApplication
      summary: Từ chối đơn
      description: |
        Chỉ `admin`, chỉ đơn `pending`. Bắt buộc ghi lý do (người gửi thấy câu này).
        Người bị từ chối phải chờ `LAWYER_REAPPLY_COOLDOWN_HOURS` giờ mới gửi đơn mới.
        Đơn `card_change` bị từ chối thì hồ sơ giữ nguyên thông tin thẻ cũ.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectRequest" }
            example: { reason: "Ảnh thẻ hành nghề bị mờ, vui lòng chụp lại." }
      responses:
        "200":
          description: Đơn sau khi từ chối
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
        "409": { $ref: "#/components/responses/NotPending" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- Internal
  /internal/v1/lawyers/{user_id}/status:
    get:
      tags: [Internal]
      operationId: getLawyerStatusInternal
      summary: Trạng thái luật sư của một người (cho Consultation Service)
      description: |
        Header `X-Internal-Token`. Luôn trả 200 (kể cả người chưa từng có hồ sơ: `has_profile = false`).
        `can_practice` = có hồ sơ, không bị ẩn và đủ (`is_complete`). Khóa tài khoản / vai trò trong token vẫn do
        User Service quyết định; Consultation Service nên kiểm tra cả hai.
        Hồ sơ `incomplete` đã có số thẻ + lĩnh vực thì hỏi User Service `has_citizen_profile` (có thể 502/503/504).
      x-status: implemented
      servers:
        - url: http://lawyer-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Trạng thái
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerStatusResponse" }
              examples:
                du_dieu_kien:
                  summary: Luật sư đủ hồ sơ
                  value:
                    data:
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      has_profile: true
                      profile_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      profile_status: active
                      is_hidden: false
                      is_complete: true
                      missing_requirements: []
                      can_practice: true
                    error: null
                    request_id: req-123
                chua_co_ho_so:
                  summary: Người chưa từng là luật sư
                  value:
                    data:
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      has_profile: false
                      profile_id: null
                      profile_status: null
                      is_hidden: false
                      is_complete: false
                      missing_requirements: []
                      can_practice: false
                    error: null
                    request_id: req-124
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /internal/v1/lawyers/{user_id}/hide:
    post:
      tags: [Internal]
      operationId: hideLawyerProfileInternal
      summary: Ẩn hồ sơ luật sư (User Service gọi khi hạ vai trò / xóa tài khoản)
      description: |
        Header `X-Internal-Token`. User Service gọi **trước** khi lưu việc hạ vai trò `lawyer` → `citizen` hoặc
        xóa tài khoản luật sư; gọi lỗi thì User Service không đổi gì và trả 503.
        Hồ sơ → `hidden` (không xóa), ghi `hidden_at`, `hidden_reason`, tắt `is_online`. Đơn `draft`/`pending`
        của người đó chuyển `withdrawn`. Người đó được xin làm luật sư lại sau (đơn `new`).
        Gọi lại nhiều lần an toàn (idempotent). Không có hồ sơ vẫn trả 200 với `profile_found = false`.
        Đóng các cuộc tư vấn đang mở do User Service gọi Consultation Service (TODO ở
        `services/user-service/app/clients/consultation_client.py`).
      x-status: implemented
      servers:
        - url: http://lawyer-service:8000
          description: Chỉ gọi được trong mạng Docker
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HideProfileRequest" }
            example: { reason: role_changed }
      responses:
        "200":
          description: Đã ẩn (hoặc không có gì để ẩn)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HideProfileResponse" }
              example:
                data:
                  user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                  profile_found: true
                  is_hidden: true
                  withdrawn_application_ids: [7d6c5b4a-3f2e-4d1c-9b8a-7f6e5d4c3b2a]
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`access_token` lấy từ User Service (`POST /users/auth/firebase` hoặc `POST /users/auth/refresh`)."
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Giá trị `INTERNAL_TOKEN` trong `.env` (so bằng `hmac.compare_digest`), chỉ dùng cho `/internal/v1/...`.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Mã lần gọi. Gateway tự tạo; gọi trực tiếp không có thì service tự tạo.
      schema: { type: string, example: req-123 }
    Page:
      name: page
      in: query
      description: Trang cần lấy, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    LawyerId:
      name: lawyer_id
      in: path
      required: true
      description: ID hồ sơ luật sư (UUID, `lawyer_profiles.id`)
      schema: { type: string, format: uuid }
    ApplicationId:
      name: application_id
      in: path
      required: true
      description: ID đơn (UUID, `lawyer_applications.id`)
      schema: { type: string, format: uuid }
    UserIdPath:
      name: user_id
      in: path
      required: true
      description: ID tài khoản ở User Service
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Mã lần gọi, giống `request_id` trong body.
      schema: { type: string }

  responses:
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu gửi lên không hợp lệ.
              details:
                - field: specialization_codes
                  message: Phải chọn ít nhất 1 lĩnh vực.
            request_id: req-123
    Unauthorized:
      description: Thiếu token, token sai hoặc đã hết hạn (API nội bộ - sai `X-Internal-Token`)
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: UNAUTHORIZED
              message: Bạn cần đăng nhập để tiếp tục.
            request_id: req-123
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền (sai vai trò) hoặc tài khoản bị khóa
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            sai_vai_tro:
              summary: Sai vai trò
              value:
                data: null
                error:
                  code: FORBIDDEN
                  message: Bạn không có quyền thực hiện thao tác này.
                request_id: req-123
            bi_khoa:
              summary: Tài khoản bị khóa (khi gửi đơn)
              value:
                data: null
                error:
                  code: ACCOUNT_LOCKED
                  message: Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.
                request_id: req-124
    NotActiveLawyer:
      description: Chỉ luật sư có hồ sơ đủ (`active`) mới dùng được API này
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_PROFILE_INCOMPLETE
              message: Hồ sơ luật sư của bạn chưa đủ thông tin.
            request_id: req-123
    LawyerNotFound:
      description: Không có hồ sơ luật sư phù hợp
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: LAWYER_NOT_FOUND
              message: Không tìm thấy hồ sơ luật sư.
            request_id: req-123
    ApplicationNotFound:
      description: Không có đơn, hoặc đơn không phải của người gọi
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: APPLICATION_NOT_FOUND
              message: Không tìm thấy đơn.
            request_id: req-123
    NotPending:
      description: Đơn không ở trạng thái chờ duyệt
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: APPLICATION_NOT_PENDING
              message: Đơn này đã được xử lý trước đó.
            request_id: req-123
    ServiceBadResponse:
      description: Service phụ trả lỗi 5xx hoặc dữ liệu sai cấu trúc
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            user:
              summary: User Service trả lỗi
              value:
                data: null
                error:
                  code: USER_BAD_RESPONSE
                  message: Hệ thống tài khoản đang gặp lỗi, vui lòng thử lại sau.
                request_id: req-123
            document:
              summary: Document Service trả lỗi
              value:
                data: null
                error:
                  code: DOCUMENT_BAD_RESPONSE
                  message: Không kiểm tra được ảnh thẻ, vui lòng thử lại sau.
                request_id: req-124
            consultation:
              summary: Consultation Service trả lỗi
              value:
                data: null
                error:
                  code: CONSULTATION_BAD_RESPONSE
                  message: Không lấy được số liệu tư vấn, vui lòng thử lại sau.
                request_id: req-125
    ServiceUnavailable:
      description: Không kết nối được service phụ
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            user:
              summary: User Service không phản hồi
              value:
                data: null
                error:
                  code: USER_UNAVAILABLE
                  message: Hệ thống tài khoản tạm thời không phản hồi, vui lòng thử lại sau.
                request_id: req-123
            document:
              summary: Document Service không phản hồi
              value:
                data: null
                error:
                  code: DOCUMENT_UNAVAILABLE
                  message: Hệ thống giấy tờ tạm thời không phản hồi, vui lòng thử lại sau.
                request_id: req-124
    ServiceTimeout:
      description: Service phụ quá thời gian chờ (5 giây)
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            user:
              summary: User Service quá chậm
              value:
                data: null
                error:
                  code: USER_TIMEOUT
                  message: Hệ thống tài khoản phản hồi quá chậm, vui lòng thử lại sau.
                request_id: req-123
            document:
              summary: Document Service quá chậm
              value:
                data: null
                error:
                  code: DOCUMENT_TIMEOUT
                  message: Hệ thống giấy tờ phản hồi quá chậm, vui lòng thử lại sau.
                request_id: req-124
    InternalError:
      description: Lỗi Backend không lường trước
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            data: null
            error:
              code: INTERNAL_ERROR
              message: Hệ thống đang gặp lỗi, vui lòng thử lại sau.
            request_id: req-123

  schemas:
    # ---------- Kiểu dùng chung ----------
    RequestIdValue:
      type: string
      description: Mã lần gọi API
      example: req-123

    NoError:
      description: Luôn `null` khi thành công
      nullable: true
      enum: [null]

    NullValue:
      description: Giá trị `null` (dùng trong `anyOf` cho trường có thể rỗng)
      nullable: true
      enum: [null]

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 1 }
        total_pages: { type: integer, minimum: 0, example: 1 }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi cố định, FE dùng để xử lý (xem API_GUIDELINES mục 5)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Câu báo lỗi tiếng Việt, hiển thị được cho người dùng
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `VALIDATION_ERROR`)
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: specialization_codes }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          description: Luôn `null` khi lỗi
          nullable: true
          enum: [null]
        error: { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    # ---------- Enum ----------
    SpecializationCode:
      type: string
      description: "`land` = Đất đai, `business` = Hộ kinh doanh"
      enum: [land, business]

    ProfileStatus:
      type: string
      description: |
        `incomplete` = chưa đủ (thiếu CCCD / số thẻ / lĩnh vực), `active` = đủ và đang hiệu lực,
        `hidden` = bị ẩn do hạ vai trò hoặc xóa tài khoản
      enum: [incomplete, active, hidden]

    ProfileSource:
      type: string
      description: "`admin_created` = admin tạo tài khoản, `self_applied` = người dùng tự xin và được duyệt"
      enum: [admin_created, self_applied]

    ApplicationType:
      type: string
      description: "`new` = xin làm luật sư, `card_change` = đổi số thẻ / ảnh thẻ"
      enum: [new, card_change]

    ApplicationStatus:
      type: string
      description: |
        `draft` → `pending` → `approved` | `rejected`; `draft`/`pending` → `withdrawn` (người dùng rút hoặc
        hồ sơ bị ẩn).
      enum: [draft, pending, approved, rejected, withdrawn]

    MissingRequirement:
      type: string
      description: "Điều kiện còn thiếu để hồ sơ đủ"
      enum: [citizen_profile, bar_card_number, specializations]

    BarCardNumber:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '\S'
      description: Số thẻ hành nghề luật sư (bỏ khoảng trắng hai đầu; so trùng không phân biệt hoa thường)
      example: "12345/TP"

    # ---------- Luật sư ----------
    Specialization:
      type: object
      required: [code, name]
      properties:
        code: { $ref: "#/components/schemas/SpecializationCode" }
        name: { type: string, example: Đất đai }

    LawyerPublic:
      type: object
      description: Thông tin công khai, người dân xem được
      required: [id, user_id, full_name, avatar_url, law_firm, years_experience, bio, specializations, is_online]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        full_name:
          type: string
          nullable: true
          description: Lấy từ User Service
        avatar_url: { type: string, format: uri, nullable: true }
        law_firm: { type: string, nullable: true }
        years_experience: { type: integer, minimum: 0, nullable: true }
        bio: { type: string, nullable: true }
        specializations:
          type: array
          items: { $ref: "#/components/schemas/Specialization" }
        is_online: { type: boolean }

    ApplicationRef:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ApplicationType" }
        status: { $ref: "#/components/schemas/ApplicationStatus" }

    LawyerProfile:
      type: object
      description: Hồ sơ đầy đủ, chỉ chủ hồ sơ và admin xem được
      required: [id, user_id, source, status, bar_card_number, card_document_id, law_firm, years_experience, bio,
                 specializations, is_online, is_complete, missing_requirements, pending_application, hidden_at,
                 created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ProfileSource" }
        status: { $ref: "#/components/schemas/ProfileStatus" }
        bar_card_number: { type: string, nullable: true, example: "12345/TP" }
        card_document_id:
          type: string
          format: uuid
          nullable: true
          description: Ảnh thẻ đang hiệu lực (`null` với luật sư admin tạo chưa từng đổi thẻ)
        law_firm: { type: string, nullable: true }
        years_experience: { type: integer, minimum: 0, nullable: true }
        bio: { type: string, nullable: true }
        specializations:
          type: array
          items: { $ref: "#/components/schemas/Specialization" }
        is_online:
          type: boolean
          description: Luôn `false` cho tới khi làm WebSocket cùng Consultation Service
        is_complete: { type: boolean }
        missing_requirements:
          type: array
          items: { $ref: "#/components/schemas/MissingRequirement" }
        pending_application:
          anyOf:
            - $ref: "#/components/schemas/ApplicationRef"
            - $ref: "#/components/schemas/NullValue"
          description: Đơn `draft`/`pending` đang mở (nếu có)
        hidden_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OcrFields:
      type: object
      description: Trường đọc được từ ảnh thẻ; đọc không chắc thì `null`
      required: [full_name, bar_card_number, bar_association, issue_date]
      properties:
        full_name: { type: string, nullable: true }
        bar_card_number: { type: string, nullable: true }
        bar_association: { type: string, nullable: true, description: Đoàn luật sư }
        issue_date: { type: string, format: date, nullable: true }

    OcrResult:
      type: object
      description: JSON OCR lấy từ Document Service lúc gắn ảnh vào đơn (Lawyer Service không tự chạy OCR)
      required: [status, fields, warnings, error_code, engine]
      properties:
        status:
          type: string
          enum: [completed, failed]
          description: "`failed` = ảnh mờ / OCR lỗi; người dùng tự nhập, admin đối chiếu bằng ảnh"
        fields:
          anyOf:
            - $ref: "#/components/schemas/OcrFields"
            - $ref: "#/components/schemas/NullValue"
        warnings:
          type: array
          items: { type: string }
        error_code: { type: string, nullable: true, example: null }
        engine: { type: string, example: tesseract-local }

    LawyerApplication:
      type: object
      required: [id, user_id, type, status, bar_card_number, law_firm, years_experience, bio, specializations,
                 card_document_id, ocr_result, applicant_full_name, reject_reason, reviewed_by, reviewed_at,
                 submitted_at, withdrawn_at, can_reapply_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ApplicationType" }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        bar_card_number:
          type: string
          nullable: true
          description: Với `card_change`, `null` = giữ số thẻ cũ, chỉ đổi ảnh
        law_firm: { type: string, nullable: true, description: "Luôn `null` với `card_change`" }
        years_experience: { type: integer, nullable: true }
        bio: { type: string, nullable: true }
        specializations:
          type: array
          nullable: true
          description: "`null` với `card_change`"
          items: { $ref: "#/components/schemas/Specialization" }
        card_document_id: { type: string, format: uuid, nullable: true }
        ocr_result:
          anyOf:
            - $ref: "#/components/schemas/OcrResult"
            - $ref: "#/components/schemas/NullValue"
        applicant_full_name:
          type: string
          nullable: true
          description: Họ tên trên CCCD lúc gửi đơn (để admin xem danh sách)
        reject_reason: { type: string, nullable: true }
        reviewed_by: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        withdrawn_at: { type: string, format: date-time, nullable: true }
        can_reapply_at:
          type: string
          format: date-time
          nullable: true
          description: Chỉ có với đơn `rejected` = `reviewed_at` + thời gian chờ
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApplicationReview:
      type: object
      required: [application, card_image, citizen_profile, current_profile, checks]
      properties:
        application: { $ref: "#/components/schemas/LawyerApplication" }
        card_image:
          type: object
          nullable: true
          required: [url, expires_in]
          properties:
            url: { type: string, format: uri }
            expires_in: { type: integer, example: 300, description: Số giây link còn hiệu lực }
        citizen_profile:
          type: object
          nullable: true
          additionalProperties: true
          description: Nguyên `data` của User Service `GET /internal/v1/users/{id}/citizen-profile`
        current_profile:
          anyOf:
            - $ref: "#/components/schemas/LawyerProfile"
            - $ref: "#/components/schemas/NullValue"
        checks:
          type: object
          required: [is_name_mismatch, is_card_number_mismatch]
          properties:
            is_name_mismatch: { type: boolean, nullable: true }
            is_card_number_mismatch: { type: boolean, nullable: true }

    LawyerStats:
      type: object
      required: [accepted_count, in_progress_count, closed_count]
      properties:
        accepted_count: { type: integer, minimum: 0, description: Tổng số yêu cầu đã nhận }
        in_progress_count: { type: integer, minimum: 0, description: Số cuộc đang tư vấn }
        closed_count: { type: integer, minimum: 0, description: Số cuộc đã đóng }

    LawyerStatus:
      type: object
      required: [user_id, has_profile, profile_id, profile_status, is_hidden, is_complete, missing_requirements,
                 can_practice]
      properties:
        user_id: { type: string, format: uuid }
        has_profile: { type: boolean }
        profile_id: { type: string, format: uuid, nullable: true }
        profile_status:
          anyOf:
            - $ref: "#/components/schemas/ProfileStatus"
            - $ref: "#/components/schemas/NullValue"
        is_hidden: { type: boolean }
        is_complete: { type: boolean }
        missing_requirements:
          type: array
          items: { $ref: "#/components/schemas/MissingRequirement" }
        can_practice: { type: boolean, description: Được dùng chức năng luật sư (nhận tư vấn...) }

    # ---------- Body gửi lên ----------
    SpecializationCodes:
      type: array
      minItems: 1
      uniqueItems: true
      items: { $ref: "#/components/schemas/SpecializationCode" }
      description: Mã lĩnh vực, lấy từ `GET /lawyers/specializations`

    LawyerProfileUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bar_card_number:
          allOf:
            - $ref: "#/components/schemas/BarCardNumber"
          description: Chỉ nhận khi hồ sơ chưa có số thẻ
        law_firm: { type: string, maxLength: 255, nullable: true }
        years_experience: { type: integer, minimum: 0, maximum: 70, nullable: true }
        bio: { type: string, maxLength: 2000, nullable: true }
        specialization_codes: { $ref: "#/components/schemas/SpecializationCodes" }

    LawyerApplicationCreateRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/ApplicationType" }
        bar_card_number:
          anyOf:
            - $ref: "#/components/schemas/BarCardNumber"
            - $ref: "#/components/schemas/NullValue"
        law_firm: { type: string, maxLength: 255, nullable: true, description: Chỉ với `new` }
        years_experience: { type: integer, minimum: 0, maximum: 70, nullable: true, description: Chỉ với `new` }
        bio: { type: string, maxLength: 2000, nullable: true, description: Chỉ với `new` }
        specialization_codes:
          type: array
          nullable: true
          uniqueItems: true
          items: { $ref: "#/components/schemas/SpecializationCode" }
          description: Chỉ với `new`; nháp được để rỗng, gửi duyệt cần ≥ 1
        card_document_id:
          type: string
          format: uuid
          nullable: true
          description: "`card_id` từ Document Service `POST /documents/lawyer-card-ocr`"

    LawyerApplicationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Như `LawyerApplicationCreateRequest` nhưng không có `type` (không đổi loại đơn)
      properties:
        bar_card_number:
          anyOf:
            - $ref: "#/components/schemas/BarCardNumber"
            - $ref: "#/components/schemas/NullValue"
        law_firm: { type: string, maxLength: 255, nullable: true }
        years_experience: { type: integer, minimum: 0, maximum: 70, nullable: true }
        bio: { type: string, maxLength: 2000, nullable: true }
        specialization_codes:
          type: array
          nullable: true
          uniqueItems: true
          items: { $ref: "#/components/schemas/SpecializationCode" }
        card_document_id: { type: string, format: uuid, nullable: true }

    CreateLawyerAccountRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 128, description: Admin đặt; luật sư đổi lại sau }
        full_name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }

    RejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: Lý do từ chối, người gửi đơn sẽ thấy câu này

    HideProfileRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [role_changed, deleted]

    # ---------- Kết quả từng API ----------
    SpecializationListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Specialization" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerPublicResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerPublic" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerPublicListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/LawyerPublic" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerProfileResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerProfile" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerAccountResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [user, profile]
          properties:
            user:
              type: object
              required: [id, email, full_name, role]
              properties:
                id: { type: string, format: uuid }
                email: { type: string }
                full_name: { type: string, nullable: true }
                role: { type: string, enum: [lawyer] }
            profile: { $ref: "#/components/schemas/LawyerProfile" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerApplicationResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerApplication" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerApplicationListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/LawyerApplication" }
            pagination: { $ref: "#/components/schemas/Pagination" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ApplicationSummaryResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [total, by_status, by_type]
          properties:
            total: { type: integer, minimum: 0, description: Tổng số đơn không tính nháp }
            by_status:
              type: object
              required: [pending, approved, rejected, withdrawn]
              properties:
                pending: { type: integer, minimum: 0 }
                approved: { type: integer, minimum: 0 }
                rejected: { type: integer, minimum: 0 }
                withdrawn: { type: integer, minimum: 0 }
            by_type:
              type: object
              required: [new, card_change]
              properties:
                new: { type: integer, minimum: 0 }
                card_change: { type: integer, minimum: 0 }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    ApplicationReviewResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/ApplicationReview" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerStatsResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerStats" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    LawyerStatusResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: "#/components/schemas/LawyerStatus" }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }

    HideProfileResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [user_id, profile_found, is_hidden, withdrawn_application_ids]
          properties:
            user_id: { type: string, format: uuid }
            profile_found: { type: boolean }
            is_hidden: { type: boolean }
            withdrawn_application_ids:
              type: array
              items: { type: string, format: uuid }
        error: { $ref: "#/components/schemas/NoError" }
        request_id: { $ref: "#/components/schemas/RequestIdValue" }
