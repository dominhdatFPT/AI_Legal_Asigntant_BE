  /lawyers/applications/{application_id}:
    get:
      tags: [Admin]
      operationId: getLawyerApplicationReview
      summary: Chi tiết đơn để duyệt
      description: |
        Chỉ `admin`. Đơn `draft` trả 404. Gồm:
        - `application`: thông tin đơn, kể cả `ocr_result`.
        - `card_image`: link xem ảnh thẻ có hạn 300 giây, Document Service cấp qua
          `POST /internal/v1/documents/lawyer-cards/{card_id}/view-url`.
        - `citizen_profile`: hồ sơ CCCD của người gửi, User Service `GET /internal/v1/users/{id}/citizen-profile`
          (`null` nếu người đó chưa khai).
        - `current_profile`: hồ sơ luật sư đang hiệu lực (đơn `card_change` để so số thẻ cũ/mới), `null` nếu chưa có.
        - `checks`: cờ không khớp. `is_name_mismatch` so họ tên CCCD với họ tên OCR; `is_card_number_mismatch`
          so số thẻ người dùng nhập với số thẻ OCR. So sánh không phân biệt hoa thường, dấu, khoảng trắng.
          `null` khi thiếu dữ liệu để so (OCR lỗi, chưa khai CCCD...).
        User Service hoặc Document Service lỗi → 502/503/504 (không trả dữ liệu thiếu).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApplicationId"
