openapi: 3.0.3

info:
  title: Lawyer Service API
  version: 0.2.0
  description: |
    Hồ sơ luật sư và đơn xin làm luật sư / đổi thông tin thẻ; admin tạo tài khoản luật sư và duyệt đơn.

    Hai cách trở thành luật sư:
    1. Admin tạo tài khoản luật sư (`POST /lawyers/accounts`): tài khoản có vai trò `lawyer` ngay, hồ sơ ở
       trạng thái `incomplete`. Luật sư tự điền số thẻ, lĩnh vực... lần đầu không cần duyệt (`PATCH /lawyers/me`).
    2. Người dùng tự gửi đơn (`POST /lawyers/me/applications`, loại `new`), admin duyệt.

    Hồ sơ "đủ" (`is_complete`) = đã khai CCCD ở User Service + có số thẻ + ít nhất 1 lĩnh vực.
    Chưa đủ thì người đó chỉ dùng được chức năng citizen. Luật sư vẫn dùng được mọi chức năng citizen.
    Chưa có Notification: kết quả duyệt/từ chối chỉ xem qua trạng thái đơn.
    Xem thiết kế đầy đủ ở `docs/api/LAWYER_DESIGN.md`.
  x-owner: "Người 1 · Đạt"

servers:
  - url: http://localhost:8080/api
    description: Qua Gateway (Frontend và Postman dùng địa chỉ này)
  - url: http://localhost:8000/api/v1
    description: Chạy riêng service bằng uvicorn trên máy
  - url: http://lawyer-service:8000/api/v1
    description: Service khác gọi trong mạng Docker

tags:
  - name: Health
    description: Kiểm tra service còn chạy
  - name: Public
    description: Thông tin công khai (lĩnh vực, danh sách luật sư)
  - name: My Lawyer Profile
    description: Luật sư xem / sửa hồ sơ của mình
  - name: My Applications
    description: Người dùng tạo, sửa, gửi, rút đơn xin làm luật sư hoặc đổi thông tin thẻ
  - name: Admin
    description: Tạo tài khoản luật sư, xem và duyệt đơn (chỉ vai trò `admin`)
  - name: Internal
    description: |
      Chỉ service khác gọi trong mạng Docker, header `X-Internal-Token`. Gateway không chuyển tiếp `/internal/...`.

paths:
  /lawyers/health:
    get:
      tags: [Health]
      operationId: getLawyerHealth
      summary: Kiểm tra service
      description: Không dùng format `{data, error, request_id}` (ngoại lệ cho health check).
      x-status: implemented
      responses:
        "200":
          description: Service đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: lawyer-service }

  # ---------------------------------------------------------------- Public
  /lawyers/specializations:
    get:
      tags: [Public]
      operationId: listSpecializations
      summary: Danh sách lĩnh vực tư vấn
      description: Không cần đăng nhập. Dùng cho form hồ sơ luật sư và bộ lọc danh sách luật sư.
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Danh sách lĩnh vực
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecializationListResponse" }
              example:
                data:
                  items:
                    - code: land
                      name: Đất đai
                    - code: business
                      name: Hộ kinh doanh
                error: null
                request_id: req-123
        "500": { $ref: "#/components/responses/InternalError" }

  /lawyers:
    get:
      tags: [Public]
      operationId: listLawyers
      summary: Danh sách luật sư
      description: |
        Chỉ trả hồ sơ `active` (đã đủ thông tin, không bị ẩn) của tài khoản không bị khóa.
        Tên, ảnh đại diện lấy từ User Service `POST /internal/v1/users/search` (kèm `X-Internal-Token`).
        Lọc `is_online=true` để xem ai đang online. Trạng thái online sẽ làm bằng WebSocket cùng
        Consultation Service; hiện cột `is_online` luôn là `false`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: specialization
          in: query
          description: Lọc theo mã lĩnh vực. Bỏ trống = tất cả.
          schema: { $ref: "#/components/schemas/SpecializationCode" }
        - name: is_online
          in: query
          description: "`true` = chỉ luật sư đang online. Bỏ trống = tất cả."
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách luật sư (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerPublicListResponse" }
              example:
                data:
                  items:
                    - id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      full_name: Luật sư Trần Thị B
                      avatar_url: null
                      law_firm: Văn phòng Luật sư ABC
                      years_experience: 8
                      bio: Chuyên tư vấn tranh chấp đất đai.
                      specializations:
                        - code: land
                          name: Đất đai
                      is_online: false
                  pagination: { page: 1, page_size: 20, total: 1, total_pages: 1 }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /lawyers/{lawyer_id}:
    get:
      tags: [Public]
      operationId: getLawyer
      summary: Chi tiết một luật sư
      description: |
        Chỉ xem được hồ sơ `active`. Hồ sơ `incomplete` / `hidden` trả 404 như không tồn tại.
        Tên, ảnh đại diện lấy từ User Service như `GET /lawyers`.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/LawyerId"
      responses:
        "200":
          description: Thông tin công khai của luật sư
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerPublicResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LawyerNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  # ---------------------------------------------------------------- My lawyer profile
  /lawyers/me:
    get:
      tags: [My Lawyer Profile]
      operationId: getMyLawyerProfile
      summary: Xem hồ sơ luật sư của tôi
      description: |
        Mọi vai trò đã đăng nhập gọi được. Chưa từng có hồ sơ thì trả 404 `LAWYER_NOT_FOUND`
        (FE hiện nút "Đăng ký làm luật sư").
        `is_complete` / `missing_requirements` cho biết còn thiếu gì. Khi hồ sơ `incomplete` đã có số thẻ và
        lĩnh vực, service hỏi User Service `GET /internal/v1/users/{id}/status` (`has_citizen_profile`);
        đủ thì tự chuyển hồ sơ sang `active`. Vì vậy API này có thể trả 502/503/504 khi User Service lỗi.
        `pending_application` là đơn đang `draft`/`pending` (nếu có); trong lúc chờ duyệt, thông tin cũ vẫn hiệu lực.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Hồ sơ của tôi
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileResponse" }
              examples:
                chua_hoan_thien:
                  summary: Luật sư do admin tạo, chưa điền số thẻ
                  value:
                    data:
                      id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      source: admin_created
                      status: incomplete
                      bar_card_number: null
                      card_document_id: null
                      law_firm: null
                      years_experience: null
                      bio: null
                      specializations: []
                      is_online: false
                      is_complete: false
                      missing_requirements: [citizen_profile, bar_card_number, specializations]
                      pending_application: null
                      hidden_at: null
                      created_at: "2026-10-15T02:00:00Z"
                      updated_at: "2026-10-15T02:00:00Z"
                    error: null
                    request_id: req-123
                dang_hoat_dong:
                  summary: Luật sư đủ hồ sơ, đang chờ duyệt đổi số thẻ
                  value:
                    data:
                      id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      source: self_applied
                      status: active
                      bar_card_number: "12345/TP"
                      card_document_id: 2c4e6a8b-0d1f-4a3b-9c5d-7e9f1a3b5c7d
                      law_firm: Văn phòng Luật sư ABC
                      years_experience: 8
                      bio: Chuyên tư vấn tranh chấp đất đai.
                      specializations:
                        - code: land
                          name: Đất đai
                      is_online: false
                      is_complete: true
                      missing_requirements: []
                      pending_application:
                        id: 7d6c5b4a-3f2e-4d1c-9b8a-7f6e5d4c3b2a
                        type: card_change
                        status: pending
                      hidden_at: null
                      created_at: "2026-10-01T02:00:00Z"
                      updated_at: "2026-10-10T08:30:00Z"
                    error: null
                    request_id: req-124
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LawyerNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }
    patch:
      tags: [My Lawyer Profile]
      operationId: updateMyLawyerProfile
      summary: Sửa hồ sơ (lưu ngay, không cần duyệt)
      description: |
        Chỉ vai trò `lawyer` (token), hồ sơ không bị ẩn. Gửi trường nào sửa trường đó.
        - `law_firm`, `years_experience`, `bio`, `specialization_codes`: lưu ngay.
        - `bar_card_number`: chỉ nhận khi hồ sơ **chưa có** số thẻ (lần điền đầu của luật sư do admin tạo),
          lưu ngay không cần duyệt. Hồ sơ đã có số thẻ mà gửi số khác → 409 `CARD_CHANGE_REQUIRES_REVIEW`;
          muốn đổi thì tạo đơn `card_change`. Gửi lại đúng số đang có thì bỏ qua.
        Sau khi lưu, nếu hồ sơ đủ (kể cả đã khai CCCD) thì chuyển `incomplete` → `active` (hỏi User Service,
        nên có thể trả 502/503/504; khi đó dữ liệu đã gửi **không** được lưu).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerProfileUpdateRequest" }
            example:
              bar_card_number: "12345/TP"
              law_firm: Văn phòng Luật sư ABC
              years_experience: 8
              bio: Chuyên tư vấn tranh chấp đất đai.
              specialization_codes: [land, business]
      responses:
        "200":
          description: Hồ sơ sau khi sửa
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LawyerNotFound" }
        "409":
          description: Đổi số thẻ cần duyệt, hoặc số thẻ đã được dùng
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                can_duyet:
                  summary: Hồ sơ đã có số thẻ
                  value:
                    data: null
                    error:
                      code: CARD_CHANGE_REQUIRES_REVIEW
                      message: Đổi số thẻ hành nghề cần admin duyệt, vui lòng tạo đơn đổi thông tin thẻ.
                    request_id: req-123
                trung_so_the:
                  summary: Trùng số thẻ
                  value:
                    data: null
                    error:
                      code: BAR_CARD_NUMBER_TAKEN
                      message: Số thẻ hành nghề này đã được đăng ký.
                    request_id: req-124
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  /lawyers/me/stats:
    get:
      tags: [My Lawyer Profile]
      operationId: getMyLawyerStats
      summary: Thống kê cơ bản của tôi
      description: |
        Chỉ luật sư có hồ sơ `active`. Số liệu lấy từ Consultation Service `GET /consultations/stats`
        (chuyển tiếp JWT của luật sư); Lawyer Service không tự lưu các con số này.
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Thống kê
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerStatsResponse" }
              example:
                data:
                  accepted_count: 12
                  in_progress_count: 2
                  closed_count: 10
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotActiveLawyer" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ServiceBadResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/ServiceTimeout" }

  # ---------------------------------------------------------------- My applications
  /lawyers/me/applications:
    get:
      tags: [My Applications]
      operationId: listMyLawyerApplications
      summary: Danh sách đơn của tôi
      description: Mọi vai trò đã đăng nhập. Mới nhất lên trước. Đơn bị từ chối có `reject_reason` và `can_reapply_at`.
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Danh sách đơn (rỗng thì `items` = `[]`)
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerApplicationListResponse" }
              example:
                data:
                  items:
                    - id: 7d6c5b4a-3f2e-4d1c-9b8a-7f6e5d4c3b2a
                      user_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      type: new
                      status: rejected
                      bar_card_number: "12345/TP"
                      law_firm: Văn phòng Luật sư ABC
                      years_experience: 8
                      bio: Chuyên tư vấn tranh chấp đất đai.
                      specializations:
                        - code: land
                          name: Đất đai
                      card_document_id: 2c4e6a8b-0d1f-4a3b-9c5d-7e9f1a3b5c7d
                      ocr_result:
                        status: completed
                        fields:
                          full_name: NGUYỄN VĂN A
                          bar_card_number: "12345/TP"
                          bar_association: Đoàn Luật sư TP. Hồ Chí Minh
                          issue_date: "2020-05-12"
                        warnings: [OCR_REQUIRES_USER_REVIEW]
                        error_code: null
                        engine: tesseract-local
                      applicant_full_name: Nguyễn Văn A
                      reject_reason: Ảnh thẻ bị mờ, vui lòng chụp lại.
                      reviewed_by: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
                      reviewed_at: "2026-10-14T03:00:00Z"
                      submitted_at: "2026-10-13T09:00:00Z"
                      withdrawn_at: null
                      can_reapply_at: "2026-10-15T03:00:00Z"
                      created_at: "2026-10-13T08:50:00Z"
                      updated_at: "2026-10-14T03:00:00Z"
                  pagination: { page: 1, page_size: 20, total: 1, total_pages: 1 }
                error: null
                request_id: req-123
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [My Applications]
      operationId: createMyLawyerApplication
      summary: Tạo đơn nháp
      description: |
        Luôn tạo đơn ở trạng thái `draft`; gửi duyệt bằng `POST /lawyers/me/applications/{id}/submit`.
        Mỗi người chỉ có **một** đơn `draft`/`pending` (mọi loại) tại một thời điểm → 409 `OPEN_APPLICATION_EXISTS`.
        - `type = new`: chỉ vai trò `citizen`; không có hồ sơ luật sư hoặc hồ sơ đang `hidden` (xin lại).
          Có hồ sơ chưa ẩn → 409 `LAWYER_PROFILE_EXISTS`.
        - `type = card_change`: chỉ vai trò `lawyer`, hồ sơ không ẩn và đã có số thẻ. Chỉ gửi
          `bar_card_number` và/hoặc `card_document_id`; các trường khác bị từ chối (422).
        Nháp được để trống trường, kiểm tra đủ khi gửi duyệt.
        `card_document_id` là `card_id` lấy từ Document Service `POST /documents/lawyer-card-ocr`.
        Lawyer Service gọi Document Service `GET /internal/v1/documents/lawyer-cards/{card_id}` để kiểm tra
        ảnh thuộc người gửi và lấy JSON OCR; không thuộc người gửi → 422 (field `card_document_id`).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerApplicationCreateRequest" }
            examples:
              xin_lam_luat_su:
                summary: Đơn xin làm luật sư
                value:
                  type: new
                  bar_card_number: "12345/TP"
                  law_firm: Văn phòng Luật sư ABC
                  years_experience: 8
                  bio: Chuyên tư vấn tranh chấp đất đai.
                  specialization_codes: [land]
                  card_document_id: 2c4e6a8b-0d1f-4a3b-9c5d-7e9f1a3b5c7d
              doi_the:
                summary: Đơn đổi thông tin thẻ
                value:
                  type: card_change
                  bar_card_number: "67890/TP"
                  card_document_id: 3d5f7b9c-1e2a-4b4c-8d6e-8f0a2b4c6d8e
      responses:
        "201":
          description: Đã tạo đơn nháp
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LawyerApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Đã có đơn đang mở, đã có hồ sơ luật sư, hoặc chưa có số thẻ để đổi
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                don_dang_mo:
                  summary: Đã có đơn draft/pending
                  value:
                    data: null
                    error:
                      code: OPEN_APPLICATION_EXISTS
                      message: Bạn đang có một đơn chưa xử lý xong, hãy sửa hoặc rút đơn đó trước.
                    request_id: req-123
                da_co_ho_so:
                  summary: Đã là luật sư
                  value:
                    data: null
                    error:
                      code: LAWYER_PROFILE_EXISTS
                      message: Bạn đã có hồ sơ luật sư.
                    request_id: req-124
                chua_co_so_the:
                  summary: Đổi thẻ khi hồ sơ chưa có số thẻ
