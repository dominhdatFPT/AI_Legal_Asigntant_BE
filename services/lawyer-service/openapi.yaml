  # ---------------------------------------------------------------- Admin
  /lawyers/accounts:
    post:
      tags: [Admin]
      operationId: createLawyerAccount
      summary: Admin tạo tài khoản luật sư
      description: |
        Chỉ `admin`. Các bước:
        1. Gọi User Service `POST /internal/v1/users` (X-Internal-Token) tạo tài khoản `local` đăng nhập bằng
           email + mật khẩu, vai trò `lawyer` ngay, `created_by` = admin đang gọi.
           Lỗi 409 của User Service (email/SĐT đã dùng) trả nguyên mã cho FE.
        2. Tạo hồ sơ luật sư `incomplete`, nguồn `admin_created`, không cần ảnh thẻ.
        3. Lưu hồ sơ lỗi → gọi User Service `DELETE /internal/v1/users/{id}` để **xóa cứng** tài khoản vừa tạo
           (không xóa mềm vì email xóa mềm không đăng ký lại được), rồi trả 503 `LAWYER_DB_UNAVAILABLE`.
        Không tự retry (không phải thao tác gọi lại an toàn).
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLawyerAccountRequest" }
            example:
              email: luatsu.c@gmail.com
              password: matkhau123
              full_name: Lê Văn C
      responses:
        "201":
          description: Đã tạo tài khoản và hồ sơ chưa hoàn thiện
